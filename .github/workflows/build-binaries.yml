name: Build Binaries

on:
  push:
    tags:
      - "v*"          # Trigger on version tags like v0.1.0
  workflow_dispatch:   # Allow manual trigger from Actions tab
    inputs:
      version:
        description: "Version label for the release (e.g. 0.1.0)"
        required: false
        default: "dev"

permissions:
  contents: write      # Needed to upload assets to the release

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact: captain-claw-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: captain-claw-linux-arm64
          - os: windows-latest
            platform: windows-x64
            artifact: captain-claw-windows-x64
          - os: macos-latest
            platform: macos-universal
            artifact: captain-claw-macos

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with PyInstaller
        run: pyinstaller captain_claw.spec

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== dist/captain-claw contents ==="
          ls -la dist/captain-claw/
          echo ""
          echo "=== Checking executables exist ==="
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            test -f dist/captain-claw/captain-claw.exe
            test -f dist/captain-claw/captain-claw-web.exe
            test -f dist/captain-claw/captain-claw-orchestrate.exe
          else
            test -f dist/captain-claw/captain-claw
            test -f dist/captain-claw/captain-claw-web
            test -f dist/captain-claw/captain-claw-orchestrate
          fi
          echo ""
          echo "=== Checking bundled data (PyInstaller 6+ uses _internal/) ==="
          INTERNAL="dist/captain-claw/_internal"
          if [[ ! -d "$INTERNAL" ]]; then
            INTERNAL="dist/captain-claw"
          fi
          test -d "$INTERNAL/captain_claw/web/static"
          test -d "$INTERNAL/captain_claw/instructions"
          echo "All checks passed."

      - name: Smoke test — version
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            dist/captain-claw/captain-claw.exe --version
          else
            dist/captain-claw/captain-claw --version
          fi

      # ── Package artifacts ──────────────────────────────────────

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar czf ${{ matrix.artifact }}-${{ steps.version.outputs.version }}.tar.gz captain-claw/
          echo "ARCHIVE=${{ matrix.artifact }}-${{ steps.version.outputs.version }}.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path captain-claw -DestinationPath "${{ matrix.artifact }}-${{ steps.version.outputs.version }}.zip"
          echo "ARCHIVE=${{ matrix.artifact }}-${{ steps.version.outputs.version }}.zip" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ env.ARCHIVE }}
          retention-days: 30

  # ── Attach to the GitHub release (only on version tags) ────────
  # Releases are made by hand: the release title, the notes from
  # release-notes/RELEASE_NOTES_<version>.md, and the desktop app's files
  # (scripts/desktop_release.py), which installed desktop apps read from the
  # release GitHub calls latest. This job only ADDS the binaries to that
  # release. It never creates one, renames it, drafts it or writes its notes:
  # the action used before did all four, and run after a release was
  # published it would have turned it back into a draft.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    name: Attach to release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files
        run: find artifacts/ -type f

      - name: Upload the binaries to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag usually comes before the release: wait for it, up to 30 minutes.
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              mapfile -t files < <(find artifacts/ -type f)
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              echo "Attached ${#files[@]} files to $TAG."
              exit 0
            fi
            echo "No release for $TAG yet; looking again in a minute ($i/30)."
            sleep 60
          done
          echo "::warning::No release for $TAG after 30 minutes, so nothing was attached. The binaries stay as this run's artifacts for 30 days; attach them with: gh release upload $TAG <files>"
