; Captain Claw voice client — one source tree, one env per device:
;   pio run -e sticks3 -t upload      M5Stack StickS3 (ESP32-S3-PICO-1-N8R8, 240×135 LCD)
;   pio run -e stopwatch -t upload    M5Stack StopWatch (ESP32-S3R8, 466×466 round AMOLED)
;   pio run -e papercolor -t upload   M5Stack PaperColor (ESP32-S3R8, 400×600 Spectra 6 e-paper)
;   pio run -e papercolor_b -t upload the PaperColor the "B" way: lights first, the screen a dashboard
;   pio run -e epaper154 -t upload    Waveshare ESP32-S3-ePaper-1.54 V2 (SKU 32298; 200×200 e-paper)
;   pio run -e epaper154_touch -t upload  the Touch version (SKU 34212)
;   pio run -e preview                the StopWatch screens on a Mac (preview/render.py)
;   pio run -e preview_paper          the PaperColor screens on a Mac (preview/render.py paper)
;   pio run -e preview_epaper154      the Waveshare screens on a Mac (preview/render.py epaper154)
; Serial log:  pio device monitor --dtr 0 --rts 0
; Timing (one "[perf]" line a second on the serial log: loop, frame draw/push,
; WebSocket and speaker-feed gaps):  PLATFORMIO_BUILD_FLAGS=-DCLAW_PERF pio run -e stopwatch -t upload
[platformio]
default_envs = sticks3

; What only the Waveshare 1.54" board builds (its screen layer, panel driver, hardware).
[epaper154_files]
exclude = -<ui_epaper154.cpp> -<epd_ssd1681.cpp> -<hw_epaper154.cpp>

[env]
platform = espressif32@6.12.0
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Pinned: StopWatch support in M5Unified/M5GFX is recent and still moving.
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.2.26
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5PM1
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

[env:sticks3]
board = esp32-s3-devkitc-1
; Two app slots for over-the-air updates (docs/device-ota-plan.md); the
; trimmed fonts keep the build well under 3.3 MB. NVS stays at 0x9000, so
; saved settings survive a partition switch.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -DBOARD_STICKS3
build_src_filter = +<*> -<ui_round.cpp> -<ui_paper.cpp> -<ui_paper_b.cpp> -<fonts.cpp> ${epaper154_files.exclude}

[env:stopwatch]
board = esp32s3box
; Two app slots (OTA) with room for the smooth fonts.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DBOARD_STOPWATCH
build_src_filter = +<*> -<ui_stick.cpp> -<ui_paper.cpp> -<ui_paper_b.cpp> ${epaper154_files.exclude}
board_build.embed_files =
    fonts/small.vlw
    fonts/body_s.vlw
    fonts/body_m.vlw
    fonts/body_l.vlw
    fonts/title.vlw
    fonts/badge.vlw
    fonts/digits.vlw

[env:papercolor]
board = esp32s3box
; Two app slots (OTA) and a LittleFS partition ("spiffs") that keeps the last
; and the pinned answer across deep sleep.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DBOARD_PAPERCOLOR
build_src_filter = +<*> -<ui_stick.cpp> -<ui_round.cpp> -<ui_paper_b.cpp> ${epaper154_files.exclude}
board_build.embed_files = ${env:stopwatch.board_build.embed_files}

; The same paper, the "B" way (ui_paper_b.cpp): the lights and the voice
; carry it; the screen is a dashboard redrawn every half hour, the last answer
; on B, the options code on A. Published under hw "papercolor", version 1.x.
[env:papercolor_b]
board = esp32s3box
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DBOARD_PAPERCOLOR -DPAPER_B
build_src_filter = +<*> -<ui_stick.cpp> -<ui_round.cpp> -<ui_paper.cpp> ${epaper154_files.exclude}
board_build.embed_files = ${env:stopwatch.board_build.embed_files}

; Waveshare ESP32-S3-ePaper-1.54 V2: the same module as the StickS3 (8 MB flash,
; 8 MB PSRAM), and its bitmap fonts. M5Unified doesn't know the board: see hw.h.
[env:epaper154]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -DBOARD_EPAPER154
build_src_filter = +<*> -<ui_stick.cpp> -<ui_round.cpp> -<ui_paper.cpp> -<ui_paper_b.cpp> -<fonts.cpp>

; The Touch version: an FT6336 over the same panel, otherwise the same board.
[env:epaper154_touch]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -DBOARD_EPAPER154 -DEPAPER154_TOUCH
build_src_filter = ${env:epaper154.build_src_filter}

; The StopWatch screens rendered on a Mac (needs SDL2 from Homebrew for M5GFX's
; desktop build; nothing opens a window):
;   pio run -e preview && .pio/build/preview/program preview/out
;   uv run --no-project --with pillow python preview/render.py preview/out
[env:preview]
platform = native
framework =
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.33
build_flags =
    -std=c++17
    -O1
    -Ipreview/include
    -DBOARD_STOPWATCH
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter = -<*> +<ui_round.cpp> +<face*.cpp> +<efont_subset.cpp> +<../preview/preview.cpp>

; The PaperColor screens rendered on a Mac, in the panel's six inks:
;   pio run -e preview_paper
;   uv run --no-project --with pillow python preview/render.py paper
[env:preview_paper]
platform = native
framework =
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.33
build_flags =
    -std=c++17
    -O1
    -Ipreview/include
    -DBOARD_PAPERCOLOR
    -DPREVIEW
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter = -<*> +<ui_paper.cpp> +<face*.cpp> +<efont_subset.cpp> +<../preview/paper.cpp>

; The PaperColor "B" screens on a Mac:
;   pio run -e preview_paper_b
;   uv run --no-project --with pillow python preview/render.py paper_b
[env:preview_paper_b]
platform = native
framework =
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.33
build_flags =
    -std=c++17
    -O1
    -Ipreview/include
    -DBOARD_PAPERCOLOR
    -DPAPER_B
    -DPREVIEW
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter = -<*> +<ui_paper_b.cpp> +<face*.cpp> +<efont_subset.cpp> +<../preview/paper_b.cpp>

; The Waveshare 1.54" screens on a Mac, black on white as the panel shows them:
;   pio run -e preview_epaper154 -e preview_epaper154_touch
;   uv run --no-project --with pillow python preview/render.py epaper154
[env:preview_epaper154]
platform = native
framework =
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.33
build_flags =
    -std=c++17
    -O1
    -Ipreview/include
    -DBOARD_EPAPER154
    -DPREVIEW
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter = -<*> +<ui_epaper154.cpp> +<face*.cpp> +<efont_subset.cpp> +<../preview/epaper154.cpp>

[env:preview_epaper154_touch]
platform = native
framework =
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.33
build_flags = ${env:preview_epaper154.build_flags} -DEPAPER154_TOUCH
build_src_filter = ${env:preview_epaper154.build_src_filter}
