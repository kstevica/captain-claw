<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasses bridge — mobile</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0b0f14; color: #e6f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.4; }
  body { padding: 14px 14px env(safe-area-inset-bottom) 14px; }
  h1 { font-size: 18px; margin: 4px 0 8px; color: #9fb8ff; font-weight: 600; }
  .row { margin: 8px 0; }
  .chan-input {
    font: 600 14px/1.2 ui-monospace, Menlo, monospace; color: #cfe;
    background: #11161d; border: 1px solid #2a3140; border-radius: 6px;
    padding: 4px 8px; min-width: 110px; width: 140px;
    -webkit-appearance: none; appearance: none;
  }
  .chan-input:focus { outline: none; border-color: #4a8; background: #131a22; }
  .chan-btn {
    font: 600 12px/1 ui-monospace, Menlo, monospace; color: #9ab;
    background: #1c2330; border: 1px solid #2a3140; border-radius: 6px;
    padding: 6px 8px; margin-left: 4px; width: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .chan-btn:active { background: #2a3140; }
  select, textarea, button {
    font-size: 17px; width: 100%; box-sizing: border-box;
    background: #11161d; color: #fff; border: 1px solid #2a3140;
    border-radius: 8px; padding: 10px 12px;
  }
  textarea { min-height: 92px; resize: vertical; }
  button {
    background: #1a3d72; border-color: #2b5fa6; color: #fff;
    font-weight: 600; padding: 12px 14px; margin-top: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #2b5fa6; }
  button[disabled] { opacity: 0.5; }
  .log { margin-top: 10px; background: #0d1218; border: 1px solid #1c2330;
    border-radius: 8px; padding: 10px; max-height: 240px; overflow-y: auto;
    font: 14px/1.45 ui-monospace, Menlo, monospace; }
  .log .u { color: #cfe }
  .log .a { color: #ffd58a }
  .log .s { color: #6a7a8a; font-size: 12px }
  .log .e { color: #ff8a8a }
  .hint { color: #6a7a8a; font-size: 12px; margin-top: 10px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: #1c2330; font-size: 12px; color: #9fb; }
  .pill.off { color: #d99; }
  label { display:block; margin-bottom: 4px; color: #9aa8bb; font-size: 13px; }

  /* ── Photo attach ────────────────────────────────────── */
  .photo-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .photo-btn {
    background: #1c2330; border: 1px solid #2a3140; color: #cfe;
    font-size: 14px; font-weight: 600; padding: 8px 12px; margin: 0;
    border-radius: 8px; width: auto; flex: 0 0 auto;
  }
  .photo-btn:active { background: #2a3140; }
  #photo-input { display: none; }
  .photo-preview {
    position: relative; display: none;
    background: #11161d; border: 1px solid #2a3140; border-radius: 8px;
    padding: 4px; max-width: 100%;
  }
  .photo-preview img {
    display: block; max-width: 100%; max-height: 140px;
    border-radius: 6px;
  }
  .photo-meta {
    font: 12px ui-monospace, Menlo, monospace; color: #99a;
    margin-top: 4px; padding: 0 4px 4px;
  }
  .photo-remove {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.7); color: #fff;
    border: 1px solid #444; border-radius: 999px;
    width: 28px; height: 28px; padding: 0; margin: 0;
    font-size: 16px; line-height: 26px; text-align: center;
  }
</style>
</head>
<body>
<h1>Glasses bridge</h1>
<div class="row">
  channel
  <input class="chan-input" id="chan" type="text" inputmode="text" autocapitalize="off"
         autocorrect="off" spellcheck="false" maxlength="40"
         aria-label="channel id">
  <button class="chan-btn" id="chan-new" type="button" title="generate random">⟳</button>
  · <span class="pill off" id="status">disconnected</span>
</div>

<div class="row">
  <label for="agent">Target agent</label>
  <select id="agent"></select>
</div>

<div class="row">
  <label for="text">Message to send to agent</label>
  <textarea id="text" placeholder="Type your prompt…" autocomplete="off"></textarea>
  <div class="photo-row">
    <button class="photo-btn" id="photo-btn" type="button">📷 Add photo</button>
    <input id="photo-input" type="file" accept="image/*" capture="environment">
  </div>
  <div class="photo-preview" id="photo-preview">
    <button class="photo-remove" id="photo-remove" type="button" title="remove">×</button>
    <img id="photo-img" alt="">
    <div class="photo-meta" id="photo-meta"></div>
  </div>
</div>

<button id="send" disabled>Send to agent</button>

<div class="log" id="log"></div>

<div class="hint">
  Glasses view: <a id="glink" style="color:#9bf" href="#">/glasses/view?c=…</a>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  function randChannel() { return Math.random().toString(36).slice(2, 10); }
  function sanitize(s) {
    // Allow letters, digits, dash, underscore. Strip everything else.
    return String(s || '').trim().replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  }

  let channel = sanitize(params.get('c'));
  if (!channel) {
    channel = randChannel();
    params.set('c', channel);
    history.replaceState(null, '', location.pathname + '?' + params.toString());
  }

  const chanInput = document.getElementById('chan');
  const chanNew = document.getElementById('chan-new');
  const glink = document.getElementById('glink');

  function syncChannelUi() {
    if (document.activeElement !== chanInput) chanInput.value = channel;
    glink.href = '/glasses/view?c=' + encodeURIComponent(channel);
    glink.textContent = '/glasses/view?c=' + channel;
  }
  syncChannelUi();

  const agentSel = document.getElementById('agent');
  const sendBtn = document.getElementById('send');
  const textEl = document.getElementById('text');
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');

  const t = params.get('t') || '';
  const qs = t ? ('&t=' + encodeURIComponent(t)) : '';
  const httpQs = t ? ('?t=' + encodeURIComponent(t)) : '';

  function logLine(cls, txt) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = txt;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function loadAgents() {
    try {
      const r = await fetch('/glasses/agents' + httpQs, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const arr = await r.json();
      agentSel.innerHTML = '';
      if (!arr.length) {
        const opt = document.createElement('option');
        opt.textContent = '(no running process agents)';
        opt.disabled = true;
        agentSel.appendChild(opt);
        sendBtn.disabled = true;
        return;
      }
      for (const c of arr) {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ host: c.host, port: c.port });
        opt.textContent = c.name + '  ·  :' + c.port + (c.model ? '  ·  ' + c.model : '');
        agentSel.appendChild(opt);
      }
      sendBtn.disabled = false;
    } catch (e) {
      logLine('e', 'list agents failed: ' + e.message);
    }
  }

  let ws = null;
  let wsChannel = '';        // channel the current ws was opened for
  let wsManualClose = false; // suppress auto-reconnect when we close on purpose
  function openWs() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    wsChannel = channel;
    wsManualClose = false;
    ws = new WebSocket(scheme + '://' + location.host + '/glasses/ws?c=' + encodeURIComponent(channel) + '&role=mobile' + qs);
    ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.classList.remove('off'); };
    ws.onclose = () => {
      statusEl.textContent = 'disconnected';
      statusEl.classList.add('off');
      if (!wsManualClose) setTimeout(() => { if (channel === wsChannel) openWs(); }, 1500);
    };
    ws.onerror = () => { logLine('e', 'ws error'); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'user')   logLine('u', '› ' + (m.image_path ? '📷 ' : '') + (m.text || (m.image_path ? '(photo)' : '')));
      else if (m.type === 'agent') logLine('a', '‹ ' + m.text);
      else if (m.type === 'error') logLine('e', '! ' + m.text);
      else if (m.type === 'status') logLine('s', '· ' + (m.status || ''));
    };
  }

  function switchChannel(next) {
    next = sanitize(next);
    if (!next || next === channel) {
      syncChannelUi();
      return;
    }
    channel = next;
    // Persist in URL so reloads keep the choice + shareable link.
    params.set('c', channel);
    history.replaceState(null, '', location.pathname + '?' + params.toString());
    syncChannelUi();
    // Close the old socket and open a new one on the new channel.
    logLine('s', '· switched to channel ' + channel);
    wsManualClose = true;
    try { if (ws && ws.readyState <= 1) ws.close(); } catch (_) {}
    openWs();
  }

  chanInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); chanInput.blur(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); chanInput.value = channel; chanInput.blur(); }
  });
  chanInput.addEventListener('blur', () => switchChannel(chanInput.value));
  chanNew.addEventListener('click', () => switchChannel(randChannel()));

  // ── Photo attach state ─────────────────────────────────────────────
  const photoBtn = document.getElementById('photo-btn');
  const photoInput = document.getElementById('photo-input');
  const photoPreview = document.getElementById('photo-preview');
  const photoImg = document.getElementById('photo-img');
  const photoMeta = document.getElementById('photo-meta');
  const photoRemove = document.getElementById('photo-remove');

  // The selected File (pre-upload) plus, after upload, the agent-side path.
  let photoFile = null;
  let photoObjectUrl = null;

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  function clearPhoto() {
    photoFile = null;
    if (photoObjectUrl) { URL.revokeObjectURL(photoObjectUrl); photoObjectUrl = null; }
    photoImg.removeAttribute('src');
    photoPreview.style.display = 'none';
    photoInput.value = '';
    photoMeta.textContent = '';
  }

  photoBtn.addEventListener('click', () => photoInput.click());
  photoRemove.addEventListener('click', clearPhoto);
  photoInput.addEventListener('change', () => {
    const f = photoInput.files && photoInput.files[0];
    if (!f) return;
    if (!f.type || !f.type.startsWith('image/')) {
      logLine('e', 'not an image file');
      photoInput.value = '';
      return;
    }
    photoFile = f;
    if (photoObjectUrl) URL.revokeObjectURL(photoObjectUrl);
    photoObjectUrl = URL.createObjectURL(f);
    photoImg.src = photoObjectUrl;
    photoMeta.textContent = (f.name || 'photo') + '  ·  ' + formatBytes(f.size);
    photoPreview.style.display = 'block';
  });

  async function uploadPhoto(target) {
    const fd = new FormData();
    fd.append('file', photoFile, photoFile.name || 'photo.jpg');
    fd.append('host', target.host);
    fd.append('port', String(target.port));
    const r = await fetch('/glasses/upload-image' + httpQs, {
      method: 'POST',
      cache: 'no-store',
      body: fd,
    });
    if (!r.ok) {
      let detail = ''; try { detail = (await r.json()).detail || ''; } catch (_) {}
      throw new Error('HTTP ' + r.status + (detail ? ' ' + detail : ''));
    }
    const data = await r.json();
    if (!data.path) throw new Error('no path in upload response');
    return data.path;
  }

  sendBtn.addEventListener('click', async () => {
    const txt = textEl.value.trim();
    if (!txt && !photoFile) return;
    const sel = agentSel.value;
    if (!sel) return;
    const target = JSON.parse(sel);
    sendBtn.disabled = true;
    let imagePath = '';
    try {
      if (photoFile) {
        logLine('s', '· uploading photo…');
        imagePath = await uploadPhoto(target);
        logLine('s', '· uploaded → ' + imagePath);
      }
      const r = await fetch('/glasses/send' + httpQs, {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          channel, host: target.host, port: target.port,
          text: txt,
          image_path: imagePath || undefined,
        }),
      });
      if (!r.ok) {
        const t = await r.text();
        logLine('e', 'send failed: ' + r.status + ' ' + t);
      } else {
        textEl.value = '';
        clearPhoto();
      }
    } catch (e) {
      logLine('e', 'send error: ' + e.message);
    } finally {
      sendBtn.disabled = false;
    }
  });

  loadAgents();
  openWs();
})();
</script>
</body>
</html>
