<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain Claw</title>

<!-- ── App icons for Meta Ray-Ban Display launcher ─────────────────────
     Meta's wearables runtime scans <link rel="icon"> + the manifest for
     this. PNG only — SVG is explicitly not supported. -->
<link rel="icon"             href="/icon-192.png"        sizes="192x192" type="image/png">
<link rel="icon"             href="/icon-96.png"         sizes="96x96"   type="image/png">
<link rel="icon"             href="/icon-512.png"        sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/glasses/view-manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<style>
  /* ── Design tokens — HUD-style for transparent glasses display ──── */
  :root {
    color-scheme: dark;
    --bg:        #000;        /* pure black is most readable on HUD */
    --ink:       #e8ffe8;
    --ink-dim:   #7faf8a;
    --ink-mut:   #4c6f56;
    --hud:       #5fff9f;     /* primary HUD green */
    --hud-soft:  rgba(95,255,159,0.18);
    --hud-glow:  rgba(95,255,159,0.45);
    --user:      #9bd0ff;
    --user-bg:   #07111d;
    --agent:     #f4ffd6;
    --agent-bg:  #0a140a;
    --err:       #ff8a8a;
    --err-bg:    #1a0a0a;
    --warn:      #ffd877;
    --line:      #1c2820;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 24px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 56px 18px 76px;
    transition: padding-bottom .18s ease;
  }
  body.thinking { padding-bottom: 116px; }
  ::selection { background: var(--hud-soft); color: var(--ink); }

  /* ── Floating HUD header bar ───────────────────────────────────── */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.65) 70%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5; gap: 8px;
    font-size: 11px;
  }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 999px;
    font: 600 10px/1 ui-monospace, Menlo, monospace;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .pill .ssr { color: var(--warn); }
  /* App brand pill — distinct purple matches the Captain Claw mark. */
  .pill.brand {
    background: linear-gradient(135deg, rgba(134,59,255,0.22), rgba(71,191,255,0.16));
    border-color: rgba(134,59,255,0.55);
    color: #efe6ff;
    text-transform: uppercase;
    padding: 3px 10px 3px 6px;
    box-shadow: 0 0 12px rgba(134,59,255,0.25);
  }
  .pill.brand .brand-icon {
    width: 14px; height: 14px;
    display: inline-block;
    filter: drop-shadow(0 0 4px rgba(134,59,255,0.6));
  }
  .pill.brand .brand-name { font-weight: 700; letter-spacing: 0.14em; }
  .pill.conn { color: var(--hud); border-color: rgba(95,255,159,0.3); }
  .pill.conn::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--hud); box-shadow: 0 0 6px var(--hud-glow);
    animation: hud-pulse 2.4s ease-in-out infinite;
  }
  .pill.conn.off { color: var(--err); border-color: rgba(255,138,138,0.3); }
  .pill.conn.off::before { background: var(--err); box-shadow: 0 0 6px rgba(255,138,138,0.6); animation: none; }
  @keyframes hud-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .tts-btn, .tts-link {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px;
    width: 28px; height: 28px; padding: 0; margin: 0;
    font: 13px ui-monospace, Menlo, monospace;
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .tts-btn:hover, .tts-link:hover { background: var(--hud-soft); color: var(--ink); border-color: rgba(95,255,159,0.35); }
  .tts-btn:active, .tts-link:active { background: rgba(95,255,159,0.28); }
  .tts-btn.muted { color: var(--err); border-color: rgba(255,138,138,0.35); }
  .tts-btn.engine {
    font-size: 10px; opacity: 0.85; width: auto; padding: 0 8px;
    letter-spacing: 0.05em;
  }
  /* Hidden — selectors live on /glasses/settings as button grids. */
  .tts-lang { display: none; }

  /* ── First-load audio-gesture notice ───────────────────────────── */
  #gesture-notice {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    background: rgba(13, 26, 17, 0.92);
    border: 1px solid var(--hud);
    color: var(--ink); border-radius: 12px;
    padding: 12px 18px;
    font: 600 14px/1.3 ui-monospace, Menlo, monospace;
    box-shadow: 0 0 0 1px rgba(95,255,159,0.15) inset,
                0 8px 32px rgba(0,0,0,0.7),
                0 0 24px rgba(95,255,159,0.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 10; cursor: pointer;
    transition: opacity .35s, transform .35s;
    max-width: 88%; text-align: center;
    letter-spacing: 0.02em;
  }
  #gesture-notice.hidden { opacity: 0; transform: translate(-50%, -10px); pointer-events: none; }

  /* ── Message stack ─────────────────────────────────────────────── */
  #stack { display: flex; flex-direction: column; gap: 12px; }
  .msg {
    padding: 12px 16px;
    border-radius: 14px;
    background: var(--agent-bg);
    border: 1px solid transparent;
    opacity: 0.55;
    position: relative;
    transition: opacity .25s, transform .25s, border-color .25s;
  }
  .msg.user  { background: var(--user-bg);  color: var(--user); }
  .msg.agent { background: var(--agent-bg); color: var(--agent); }
  .msg.error { background: var(--err-bg);   color: var(--err); }
  /* System breadcrumbs — bridge status mirrored from another channel
     (e.g. WhatsApp "transcribing…" / "transcription: …"). Visually quieter
     than a real turn: dashed border, muted ink, never spoken by TTS. */
  .msg.system {
    background: rgba(255,255,255,0.02);
    border: 1px dashed var(--line); color: var(--ink-dim);
  }
  .msg.system .role { color: var(--ink-dim); }
  .msg.newest { opacity: 1; }
  .msg.newest.agent { border-color: rgba(95,255,159,0.25); box-shadow: 0 0 0 1px rgba(95,255,159,0.08) inset; }
  .msg.newest.user  { border-color: rgba(155,208,255,0.22); }
  .msg.newest.error { border-color: rgba(255,138,138,0.3); }

  .msg-head {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 11px/1 ui-monospace, Menlo, monospace;
    color: var(--ink-mut); margin-bottom: 6px;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .role { display: inline-flex; align-items: center; gap: 6px; }
  .role .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.65;
  }
  .msg.user  .role { color: var(--user); }
  .msg.agent .role { color: var(--hud); }
  .msg.error .role { color: var(--err); }
  .ts { color: var(--ink-mut); font-weight: 500; letter-spacing: 0.05em; }

  .text { word-wrap: break-word; overflow-wrap: anywhere; }
  .text p { margin: 0.3em 0; }
  .text p:first-child { margin-top: 0; }
  .text p:last-child { margin-bottom: 0; }
  .text h1, .text h2, .text h3, .text h4 {
    margin: 0.5em 0 0.2em; line-height: 1.2; font-weight: 700;
  }
  .text h1 { font-size: 1.15em; }
  .text h2 { font-size: 1.08em; }
  .text h3, .text h4 { font-size: 1.0em; }
  .text ul, .text ol { margin: 0.3em 0; padding-left: 1.4em; }
  .text li { margin: 0.15em 0; }
  .text code {
    background: rgba(255,255,255,0.06); color: var(--warn);
    padding: 1px 6px; border-radius: 4px; font-size: 0.9em;
  }
  .text pre {
    background: rgba(0,0,0,0.5); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 10px;
    overflow-x: auto; margin: 0.5em 0;
  }
  .text pre code { background: transparent; padding: 0; color: inherit; }
  .text blockquote {
    margin: 0.4em 0; padding: 4px 12px;
    border-left: 3px solid var(--hud); color: var(--ink);
    background: rgba(95,255,159,0.05);
    border-radius: 0 8px 8px 0;
  }
  .text a { color: var(--user); }
  .text table {
    border-collapse: separate; border-spacing: 0;
    margin: 0.5em 0; font-size: 0.9em; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .text th, .text td {
    padding: 6px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  .text tr:last-child td { border-bottom: 0; }
  .text th {
    background: rgba(255,255,255,0.04);
    font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; font-size: 0.85em;
    color: var(--ink-dim);
  }
  .text tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .text hr { border: 0; border-top: 1px solid var(--line); margin: 0.6em 0; }

  /* ── Status footer (sysbar) ────────────────────────────────────── */
  #sysbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
    border-top: 1px solid var(--line);
    padding: 6px 14px 8px;
    font: 600 12px/1.25 ui-monospace, Menlo, monospace;
    color: var(--ink-mut);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: padding .2s ease, background .2s ease,
                border-color .2s ease, font-size .2s ease,
                box-shadow .2s ease;
    z-index: 4;
  }
  #sysbar .now {
    display: flex; align-items: center; gap: 7px;
    color: var(--ink-dim); font-weight: 600; letter-spacing: 0.06em;
    font-size: 16px;
  }
  #sysbar .now::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.6; flex: 0 0 auto;
  }
  /* Clock pinned to the right edge of the footer; tabular figures so the
     seconds don't jitter the layout as they tick. */
  #sysbar .now-time {
    margin-left: auto; flex: 0 0 auto;
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  #sysbar .now.idle { color: var(--ink-mut); }
  #sysbar .now.busy { color: var(--warn); }
  #sysbar .now.err  { color: var(--err); }
  #sysbar .hist {
    color: var(--ink-mut); opacity: 0.55; font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 3px;
  }
  #sysbar .hist span { margin-right: 12px; }

  /* ── Thinking state ────────────────────────────────────────────── */
  #sysbar.thinking {
    padding: 18px 22px 20px;
    background: linear-gradient(180deg, rgba(45,28,5,0.95), rgba(20,12,2,0.98));
    border-top: 1px solid rgba(255,200,100,0.4);
    font-size: 22px;
    box-shadow: 0 -8px 32px rgba(255, 200, 80, 0.22),
                0 0 0 1px rgba(255,200,100,0.1) inset;
  }
  #sysbar.thinking .now {
    color: var(--warn);
    font-size: 22px; font-weight: 700;
    text-transform: lowercase; letter-spacing: 0.04em;
    gap: 14px;
  }
  #sysbar.thinking .now::before {
    width: 14px; height: 14px; opacity: 1;
    box-shadow: 0 0 14px rgba(255, 216, 119, 0.85),
                0 0 28px rgba(255, 216, 119, 0.4);
    animation: tk-pulse 1.1s ease-in-out infinite;
  }
  #sysbar.thinking .hist { display: none; }

  @keyframes tk-pulse {
    0%, 100% { transform: scale(0.7); opacity: 0.55; }
    50%      { transform: scale(1.25); opacity: 1; }
  }

  /* ── Mode switcher (chat / datastore / files) ──────────────────────
     Sits in the HUD-left. Three compact toggle buttons; the active one
     glows HUD-green so the current surface is obvious at a glance. */
  .modebar { display: inline-flex; align-items: center; gap: 4px; }
  .mode-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px;
    height: 24px; min-width: 28px; padding: 0 8px; margin: 0;
    font: 12px ui-monospace, Menlo, monospace;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .mode-btn:hover { background: var(--hud-soft); color: var(--ink); }
  .mode-btn:focus {
    outline: 2px solid var(--hud); outline-offset: 2px;
    background: var(--hud-soft); color: var(--ink);
  }
  .mode-btn.active {
    color: var(--bg); background: var(--hud);
    border-color: var(--hud);
    box-shadow: 0 0 10px var(--hud-glow);
    font-weight: 700;
  }

  /* ── Content views (datastore / files) ─────────────────────────────
     Full-screen overlays that sit below the HUD (which stays on top so
     the switcher is always reachable). Each owns its own vertical scroll
     so the chat's body-scroll behaviour is untouched underneath. */
  .contentview {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 3; background: var(--bg);
    padding-top: 46px;
    /* Reserve room for the status footer (sysbar) so it shows on every page
       without covering the scrollable content underneath it. */
    padding-bottom: 52px;
    display: none; flex-direction: column;
  }
  .contentview.show { display: flex; }

  /* ── Two-step navigation: step-1 menu → step-2 content ───────────────
     Each content view (datastore / files) holds two panes. Only one shows
     at a time. Step 1 is a full-screen vertical list of buttons (tables or
     files); picking one slides to step 2 (the content), which carries a
     back button to return to the list. */
  .pane {
    display: none; flex-direction: column;
    flex: 1 1 auto; min-height: 0;
  }
  .pane.show { display: flex; }

  /* Step-1 menu: full-width buttons stacked vertically, centered labels.
     Owns its own vertical scroll so a long table/file list stays reachable. */
  .menu {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: stretch;
    gap: 12px; padding: 18px 16px 28px;
    scrollbar-width: thin;
  }
  .menu::-webkit-scrollbar { width: 6px; }
  .menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  /* A <div role=button> (not a native <button>) so the glasses focus-walk
     lands on it — the Meta Ray-Ban Display only steps focus onto tabindexed
     <div>s and skips <button>s. */
  .menu-item {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); color: var(--ink);
    border-radius: 14px;
    font: 600 20px/1.25 ui-monospace, Menlo, monospace;
    text-align: center; white-space: normal; word-break: break-word;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .menu-item:hover { background: var(--hud-soft); border-color: rgba(95,255,159,0.35); }
  .menu-item:focus {
    outline: 2px solid var(--hud); outline-offset: 2px;
    background: var(--hud-soft); border-color: var(--hud);
  }
  .menu-item .count {
    opacity: 0.7; font-weight: 500; font-size: 0.8em; color: var(--ink-dim);
  }

  /* Step-2 back bar: a back button + the current table/file title. */
  .backbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10,20,12,0.9), rgba(0,0,0,0.6));
  }
  .back-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 999px;
    font: 600 14px/1 ui-monospace, Menlo, monospace;
    cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .back-btn:hover { background: var(--hud-soft); color: var(--ink); }
  .back-btn:focus {
    outline: 2px solid var(--hud); outline-offset: 2px;
    background: var(--hud-soft); color: var(--ink); border-color: var(--hud);
  }
  .backbar .title {
    flex: 1 1 auto; min-width: 0;
    font: 600 16px/1.2 ui-monospace, Menlo, monospace;
    color: var(--hud); letter-spacing: 0.04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .backbar .title .count {
    opacity: 0.7; font-weight: 500; font-size: 0.8em;
    color: var(--ink-dim); margin-left: 6px;
  }

  /* The file viewer reuses the datastore .record-pager / .record-page pair
     (see that block below) — it's the only encapsulation that both scrolls
     and keeps the content usable on the Meta Ray-Ban Display webview. */

  .vnote {
    color: var(--ink-mut); font-size: 14px; text-align: center;
    padding: 28px 16px; line-height: 1.5;
  }
  .vnote.err { color: var(--err); }

  /* ── Datastore row cards ───────────────────────────────────────────── */
  .card {
    background: var(--agent-bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  /* Focus ring for the keyboard/NeuralBand focus walk through the file
     viewer's focusable scroller + cards (matches the datastore's focus look).
     Plain :focus (not :focus-visible) so gesture-driven focus always shows. */
  .record-page:focus, .card:focus {
    outline: 2px solid var(--hud);
    outline-offset: -2px;
  }
  /* Per-block focus stops inside a markdown file (paragraphs, headings, …). */
  .file-md > *:focus {
    outline: 2px solid var(--hud);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .card-id {
    font: 700 11px/1 ui-monospace, Menlo, monospace;
    color: var(--hud); letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 8px; display: inline-block;
  }
  .field { margin: 6px 0; }
  .field-k {
    font: 600 16px/1.2 ui-monospace, Menlo, monospace;
    color: var(--ink-mut); text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .field-v {
    color: var(--ink); word-wrap: break-word; overflow-wrap: anywhere;
    white-space: pre-wrap; font-size: 20px;
  }
  .field-v.empty { color: var(--ink-mut); font-style: italic; }

  /* ── Datastore record pager (one record per screen, swipe L/R) ──────── */
  .recordbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.45);
    font: 600 12px/1 ui-monospace, Menlo, monospace; color: var(--ink-dim);
  }
  .recordbar:empty { display: none; }
  .recordbar .nav {
    background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px;
    width: 28px; height: 28px; padding: 0; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px; -webkit-tap-highlight-color: transparent;
    transition: background .12s, color .12s;
  }
  .recordbar .nav:disabled { opacity: 0.3; cursor: default; }
  .recordbar .nav:not(:disabled):hover { background: var(--hud-soft); color: var(--ink); }
  .recordbar .pos { color: var(--hud); letter-spacing: 0.06em; min-width: 56px; text-align: center; }
  .recordbar .dots { display: flex; gap: 5px; overflow: hidden; flex: 1 1 auto; }
  .recordbar .dots .d {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line); flex: 0 0 auto;
  }
  .recordbar .dots .d.on { background: var(--hud); box-shadow: 0 0 6px var(--hud-glow); }
  .recordbar .hint { margin-left: auto; color: var(--ink-mut); font-size: 10px; font-weight: 500; }

  .record-pager {
    flex: 1 1 auto; display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .record-pager::-webkit-scrollbar { height: 0; width: 0; }
  .record-pager > .vnote { flex: 1 0 100%; }
  .record-page {
    flex: 0 0 100%; width: 100%; max-width: 100%;
    scroll-snap-align: center;
    overflow-y: auto; overflow-x: hidden;
    padding: 14px 14px 28px;
  }
  .record-page::-webkit-scrollbar { width: 6px; }
  .record-page::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .rec-id {
    font: 700 12px/1 ui-monospace, Menlo, monospace; color: var(--hud);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 12px; display: inline-block;
  }

  /* ── File viewer ───────────────────────────────────────────────────── */
  .file-md { color: var(--ink); }
  .file-md h1, .file-md h2, .file-md h3 { color: var(--agent); line-height: 1.2; }
  .file-md h1 { font-size: 1.25em; }
  .file-md h2 { font-size: 1.12em; }
  .file-md pre {
    background: rgba(0,0,0,0.5); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 10px; overflow-x: auto;
  }
  .file-md code { background: rgba(255,255,255,0.06); color: var(--warn);
    padding: 1px 6px; border-radius: 4px; font-size: 0.9em; }
  .file-md pre code { background: transparent; padding: 0; }
  .file-md a { color: var(--user); }
  .file-md table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
  .file-md th, .file-md td { border: 1px solid var(--line); padding: 6px 10px; }
  .file-md img { max-width: 100%; height: auto; }
  .file-md blockquote {
    margin: 0.5em 0; padding: 4px 14px;
    border-left: 3px solid var(--hud); color: var(--ink);
    background: rgba(95,255,159,0.05); border-radius: 0 8px 8px 0;
  }
  .file-md ul, .file-md ol { padding-left: 1.4em; }
  .file-frame {
    display: block; width: 100%; border: 0; background: #fff;
    border-radius: 10px;
    /* Height is set from the document's own content height (posted by the
       injected script) so the whole file flows into the scrollable view and
       the outer .record-page — not the iframe — does the scrolling. The floor
       just avoids a flash before that first message arrives. */
    min-height: 200px;
  }

  /* Source badge on a chat message (which channel the user wrote from). */
  .via {
    font: 600 9px/1 ui-monospace, Menlo, monospace;
    color: var(--ink-mut); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 6px; margin-left: 8px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<header class="hud">
  <div class="hud-left">
    <span class="pill brand" title="Captain Claw">
      <img class="brand-icon" src="/favicon.svg" alt="">
      <span class="brand-name">Claw</span>
    </span>
    <span class="pill" title="server-render token / time">
      <span class="ssr">{{SSR_TOKEN}}</span>
    </span>
    <span class="pill conn off" id="conn">…</span>
    <span class="modebar" role="tablist" aria-label="view">
      <!-- <div role=button tabindex=0>, NOT <button>: the Meta Ray-Ban Display
           focus-walk only lands on tabindexed <div>s and skips <button>s, so
           buttons here were unreachable by the NeuralBand down gesture. -->
      <div class="mode-btn active" id="mode-chat" role="button" tabindex="0" title="chat" aria-label="chat">💬</div>
      <div class="mode-btn" id="mode-ds" role="button" tabindex="0" title="datastore" aria-label="datastore">🗄</div>
      <div class="mode-btn" id="mode-files" role="button" tabindex="0" title="files" aria-label="files">📄</div>
    </span>
  </div>
  <div class="hud-right">
    <button class="tts-btn" id="tts-toggle" type="button" title="toggle voice">🔊</button>
    <button class="tts-btn" id="tts-mode" type="button" title="stream vs one-shot">📡</button>
    <a class="tts-link" id="input-probe" href="#" title="input probe">✎</a>
    <a class="tts-link" id="tts-settings" href="#" title="language &amp; voice settings">⚙</a>
    <select class="tts-lang" id="tts-lang" title="voice language" aria-label="voice language"></select>
    <select class="tts-lang" id="tts-voice" title="voice" aria-label="voice"></select>
    <span class="tts-btn engine" id="tts-engine">—</span>
  </div>
</header>

<div id="gesture-notice">🔇 Voice is off — tap 🔊 to enable</div>

<div id="stack"></div>

<div id="sysbar">
  <div class="now idle" id="sysnow">—</div>
  <div class="hist" id="syshist"></div>
</div>

<!-- ── Datastore view: two steps ──────────────────────────────────────────
     Step 1 (#ds-pane-select): a vertical menu of table buttons.
     Step 2 (#ds-pane-content): the chosen table's records — one per screen,
     every field its own card, swipe left/right (or ‹ ›) between records — with
     a back button to return to the table list. -->
<div class="contentview" id="ds-view">
  <div class="pane show" id="ds-pane-select">
    <div class="menu" id="ds-tables">
      <div class="vnote">Loading tables…</div>
    </div>
  </div>
  <div class="pane" id="ds-pane-content">
    <div class="backbar">
      <div class="back-btn" id="ds-back" role="button" tabindex="0">‹ Tables</div>
      <div class="title" id="ds-title"></div>
    </div>
    <div class="recordbar" id="ds-pos"></div>
    <div class="record-pager" id="ds-rows">
      <div class="vnote">Pick a table.</div>
    </div>
  </div>
</div>

<!-- ── Files view: two steps ──────────────────────────────────────────────
     Step 1 (#files-pane-select): a vertical menu of .md/.html file buttons.
     Step 2 (#files-pane-content): the chosen file's scrollable content — one
     .record-page in the pager, exactly like a single datastore record — with a
     back button to return to the file list. ``#files-content`` IS the pager;
     openFile() builds the .record-page. -->
<div class="contentview" id="files-view">
  <div class="pane show" id="files-pane-select">
    <div class="menu" id="files-list">
      <div class="vnote">Loading files…</div>
    </div>
  </div>
  <div class="pane" id="files-pane-content">
    <div class="backbar">
      <div class="back-btn" id="files-back" role="button" tabindex="0">‹ Files</div>
      <div class="title" id="files-title"></div>
    </div>
    <div class="record-pager" id="files-content">
      <div class="vnote">Pick a file.</div>
    </div>
  </div>
</div>

<!-- marked for markdown + tables. Fallback to plain text if it fails to load. -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const channel = params.get('c') || '';
  const t = params.get('t') || '';
  const qs = t ? ('&t=' + encodeURIComponent(t)) : '';

  // Settings page link — preserves channel + token so "back to glasses"
  // can return here.
  (() => {
    const link = document.getElementById('tts-settings');
    if (!link) return;
    const sp = new URLSearchParams();
    if (channel) sp.set('c', channel);
    if (t) sp.set('t', t);
    const qstr = sp.toString();
    link.href = '/glasses/settings' + (qstr ? '?' + qstr : '');
  })();

  // Input-probe link — experimental page testing whether the Display webview
  // accepts text input (focus, system keyboard, dictation, handwriting…).
  // Preserves channel so the probe can post back to /glasses/send without
  // needing its own agent picker.
  (() => {
    const link = document.getElementById('input-probe');
    if (!link) return;
    const sp = new URLSearchParams();
    if (channel) sp.set('c', channel);
    if (t) sp.set('t', t);
    const qstr = sp.toString();
    link.href = '/glasses/input' + (qstr ? '?' + qstr : '');
  })();

  const stack = document.getElementById('stack');
  const conn = document.getElementById('conn');
  const sysnow = document.getElementById('sysnow');
  const syshist = document.getElementById('syshist');

  // Configure marked once (GFM enabled → tables, fenced code, autolinks).
  const hasMarked = (typeof window.marked !== 'undefined');
  if (hasMarked) {
    try {
      marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
    } catch (_) {}
  }
  // Strip markdown formatting characters before sending text to Soniox TTS.
  // Soniox pronounces literal asterisks, underscores, and backticks ("star",
  // "underscore"), so a card like "**Ana** _Last seen: just now_" would be
  // read out as "star star Ana star star underscore Last seen…". We strip
  // the formatting tokens but keep the words. Visual rendering is unaffected
  // because renderMarkdown() runs on the original text.
  function stripMarkdownForTts(src) {
    let s = String(src || '');
    // Inline code: `code` → code   (do before bold/italic so backticks go)
    s = s.replace(/`+([^`]+)`+/g, '$1');
    // Bold + italic: ***text*** / ___text___
    s = s.replace(/(\*{3}|_{3})([^*_\n]+)\1/g, '$2');
    // Bold: **text** / __text__
    s = s.replace(/(\*{2}|_{2})([^*_\n]+)\1/g, '$2');
    // Italic: *text* / _text_   (word-boundary aware so 'snake_case' survives)
    s = s.replace(/(?<![A-Za-z0-9])\*([^*\n]+?)\*(?![A-Za-z0-9])/g, '$1');
    s = s.replace(/(?<![A-Za-z0-9])_([^_\n]+?)_(?![A-Za-z0-9])/g, '$1');
    // Links: [label](url) → label
    s = s.replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, '$1');
    // Images: ![alt](url) → alt
    s = s.replace(/!\[([^\]\n]*)\]\(([^)\n]+)\)/g, '$1');
    // Strip leading list markers + heading hashes at line start.
    s = s.replace(/^\s*[-*+]\s+/gm, '');
    s = s.replace(/^\s*\d+\.\s+/gm, '');
    s = s.replace(/^\s*#{1,6}\s+/gm, '');
    // Blockquote markers: leading ">"
    s = s.replace(/^\s*>\s?/gm, '');
    // Collapse multiple blank lines so Soniox doesn't pause forever.
    s = s.replace(/\n{2,}/g, '. ').replace(/\s+\n/g, '\n');
    return s.trim();
  }

  function renderMarkdown(src) {
    if (hasMarked) {
      try { return marked.parse(String(src || '')); } catch (_) {}
    }
    // Fallback: HTML-escape + newline-to-<br>.
    const esc = String(src || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
    return esc.replace(/\n/g, '<br>');
  }

  const MAX_CONTENT = 3;   // last 3 conversation messages on screen
  const MAX_HIST = 5;      // last 5 status events shown in the footer history
  const content = [];      // user / agent / error
  const statuses = [];     // status events { status, ts }

  function fmtTs(iso) {
    try { return new Date(iso).toLocaleTimeString(); } catch { return ''; }
  }
  // Live 24-hour wall clock (HH:MM, no seconds) for the status footer.
  // Reads the current time, not a status timestamp — it's refreshed on an
  // interval so it always shows "now".
  function fmtClock() {
    try {
      return new Date().toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
      });
    } catch { return ''; }
  }

  function renderStack() {
    stack.innerHTML = '';
    const view = content.slice(-MAX_CONTENT);
    // Find the highest index of a user message in the visible slice so we
    // can keep it readable even after the agent has replied. Without this,
    // a user message at index N-2 drops to opacity:0.55 the moment the
    // agent reply lands at N-1 — on the Ray-Ban Display projector that
    // makes the (already-dark) user-bg essentially invisible. UX: a user
    // always wants to see what they just typed; older user messages can
    // still fade normally, only the most recent one gets the lift.
    let lastUserIdx = -1;
    for (let j = view.length - 1; j >= 0; j--) {
      if (view[j] && view[j].type === 'user') { lastUserIdx = j; break; }
    }
    view.forEach((m, i) => {
      const div = document.createElement('div');
      const cls = m.type === 'user' ? 'user'
        : (m.type === 'error' ? 'error'
        : (m.type === 'system' ? 'system' : 'agent'));
      const isNewest = i === view.length - 1;
      const isLastUser = i === lastUserIdx;
      div.className = 'msg ' + cls + (isNewest || isLastUser ? ' newest' : '');

      // Header: role badge + timestamp on a single row.
      const head = document.createElement('div');
      head.className = 'msg-head';

      const role = document.createElement('span');
      role.className = 'role';
      const dot = document.createElement('span'); dot.className = 'dot';
      role.appendChild(dot);
      let label = m.type === 'user' ? 'You'
        : (m.type === 'error' ? 'Error'
        : (m.type === 'system' ? 'System' : 'Agent'));
      if (m.type === 'user' && m.image_path) label = '📷  ' + label;
      role.appendChild(document.createTextNode(label));

      // Source badge — where a user message arrived from (WhatsApp,
      // Messenger, …). Lets the wearer see at a glance that a message on
      // the HUD came in over another channel, not the mobile bridge.
      if (m.via) {
        const via = document.createElement('span');
        via.className = 'via';
        via.textContent = m.via;
        role.appendChild(via);
      }

      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = fmtTs(m.ts);

      head.appendChild(role);
      head.appendChild(ts);

      const txt = document.createElement('div');
      txt.className = 'text';
      // Markdown for agent + user (so user-typed *emphasis* etc renders too);
      // errors stay plain text since they're usually short and may contain
      // characters that look like markdown but aren't.
      if (m.type === 'error' || m.type === 'system') {
        // Plain text — errors and bridge breadcrumbs (a transcription may
        // contain characters that look like markdown but aren't).
        txt.textContent = m.text || '';
      } else {
        txt.innerHTML = renderMarkdown(m.text);
      }

      div.appendChild(head);
      div.appendChild(txt);
      stack.appendChild(div);
    });
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // Map common status strings to colour classes.
  function statusClass(s) {
    s = String(s || '').toLowerCase();
    if (s.includes('think') || s.includes('busy') || s.includes('working')) return 'busy';
    if (s.includes('error') || s.includes('fail')) return 'err';
    if (s.includes('ready') || s.includes('done') || s.includes('idle')) return 'idle';
    if (s.includes('connect') || s.includes('subscribe')) return 'idle';
    return 'idle';
  }

  // Toggle the prominent "thinking" look on both the sysbar and the body
  // (the latter so body padding-bottom grows to keep the last message
  // visible above the enlarged bar).
  const sysbar = document.getElementById('sysbar');
  function setThinking(on) {
    sysbar.classList.toggle('thinking', !!on);
    document.body.classList.toggle('thinking', !!on);
  }

  function renderStatus() {
    const latest = statuses[statuses.length - 1];
    if (!latest) {
      sysnow.textContent = '—';
      sysnow.className = 'now idle';
      syshist.innerHTML = '';
      setThinking(false);
      return;
    }
    const cls = statusClass(latest.status);
    sysnow.className = 'now ' + cls;
    sysnow.innerHTML = '';
    const st = document.createElement('span');
    st.className = 'now-status';
    st.textContent = latest.status;
    sysnow.appendChild(st);
    // Right-aligned 24h clock. Dropped while thinking — the bar enlarges to
    // show just the verb, big (existing design).
    if (cls !== 'busy') {
      const tm = document.createElement('span');
      tm.className = 'now-time';
      tm.textContent = fmtClock();
      sysnow.appendChild(tm);
    }
    setThinking(cls === 'busy');
    // History: prior statuses, oldest first, dimmed.
    const prior = statuses.slice(-MAX_HIST - 1, -1);
    syshist.innerHTML = '';
    prior.forEach(s => {
      const span = document.createElement('span');
      span.textContent = s.status;
      syshist.appendChild(span);
    });
  }

  // Tick the footer clock every 10 s so it stays current without a status
  // event. Only touches the time span when one is present (idle "—" has none).
  setInterval(() => {
    const tm = document.querySelector('#sysnow .now-time');
    if (tm) tm.textContent = fmtClock();
  }, 10000);

  // True once the WS has finished its backfill (signalled by the bridge's
  // ``status:"subscribed"`` event). TTS is suppressed before this so a page
  // reload doesn't re-speak old replies.
  let liveMode = false;

  function push(m) {
    if (!m || !m.type) return;
    if (m.type === 'user' || m.type === 'agent' || m.type === 'error' || m.type === 'system') {
      content.push(m);
      if (content.length > 30) content.shift();
      renderStack();
      // An agent reply (or an error) means thinking is over — shrink the
      // bar back to the compact look right away, don't wait for the next
      // status tick which may lag a second or two.
      if (m.type === 'agent' || m.type === 'error') {
        statuses.push({ status: 'ready', ts: m.ts || new Date().toISOString() });
        if (statuses.length > 50) statuses.shift();
        renderStatus();
      }
      // Speak the agent's reply once we're past the backfill window.
      if (liveMode && m.type === 'agent' && m.text) {
        try { tts.speak(stripMarkdownForTts(m.text)); } catch (_) {}
      }
    } else if (m.type === 'status') {
      const s = String(m.status || '');
      if (s === 'subscribed') liveMode = true;
      // Skip noisy duplicates (same status text back-to-back).
      const last = statuses[statuses.length - 1];
      if (!s) return;
      if (last && last.status === s) {
        last.ts = m.ts || last.ts;
      } else {
        statuses.push({ status: s, ts: m.ts || new Date().toISOString() });
        if (statuses.length > 50) statuses.shift();
      }
      renderStatus();
    }
  }

  // ── TTS via Soniox. Two paths:
  //      stream   — WS /glasses/tts-stream, PCM s16le @ 24 kHz, Web Audio
  //                 scheduler. First-audio latency is ~150–300 ms; the rest
  //                 of the clip arrives while the start is already playing.
  //      oneshot  — POST /glasses/tts, full MP3 → <audio>. Simpler but
  //                 has to wait for the whole file before any sound.
  //      Default is stream. The toggle is remembered in localStorage.
  const tts = (() => {
    const toggleBtn = document.getElementById('tts-toggle');
    const modeBtn = document.getElementById('tts-mode');
    const langSel = document.getElementById('tts-lang');
    const voiceSel = document.getElementById('tts-voice');
    const engineLabel = document.getElementById('tts-engine');
    const gestureNotice = document.getElementById('gesture-notice');
    // Voice starts OFF — the user must explicitly enable it by tapping 🔊.
    // This avoids two problems at once: no Soniox calls happen unless the
    // user wanted them, and the first audio play coincides with a real
    // user gesture so autoplay policy never blocks.
    let muted = true;
    let sonioxAvailable = true;         // false on 503 from /glasses/tts*
    let currentAudio = null;             // active <Audio> (one-shot path)
    let currentStream = null;            // active stream context (stream path)
    let queue = Promise.resolve();       // sequential play queue
    let gestureGranted = false;          // flipped on first user interaction

    const MODE_KEY = 'glasses.tts.mode';
    const LANG_KEY = 'glasses.tts.lang';
    const VOICE_KEY = 'glasses.tts.voice';
    let mode = (() => {
      try { return localStorage.getItem(MODE_KEY) || 'stream'; }
      catch (_) { return 'stream'; }
    })();
    let lang = (() => {
      try { return localStorage.getItem(LANG_KEY) || 'en'; }
      catch (_) { return 'en'; }
    })();
    let voice = (() => {
      try { return localStorage.getItem(VOICE_KEY) || 'Adrian'; }
      catch (_) { return 'Adrian'; }
    })();

    // 60+ Soniox TTS languages (tts-rt-v1). Sorted by display name.
    const LANGS = [
      ['af','Afrikaans'], ['sq','Albanian'], ['ar','Arabic'], ['az','Azerbaijani'],
      ['eu','Basque'], ['be','Belarusian'], ['bn','Bengali'], ['bs','Bosnian'],
      ['bg','Bulgarian'], ['ca','Catalan'], ['zh','Chinese'], ['hr','Croatian'],
      ['cs','Czech'], ['da','Danish'], ['nl','Dutch'], ['en','English'],
      ['et','Estonian'], ['fi','Finnish'], ['fr','French'], ['gl','Galician'],
      ['de','German'], ['el','Greek'], ['gu','Gujarati'], ['he','Hebrew'],
      ['hi','Hindi'], ['hu','Hungarian'], ['id','Indonesian'], ['it','Italian'],
      ['ja','Japanese'], ['kn','Kannada'], ['kk','Kazakh'], ['ko','Korean'],
      ['lv','Latvian'], ['lt','Lithuanian'], ['mk','Macedonian'], ['ms','Malay'],
      ['ml','Malayalam'], ['mr','Marathi'], ['no','Norwegian'], ['fa','Persian'],
      ['pl','Polish'], ['pt','Portuguese'], ['pa','Punjabi'], ['ro','Romanian'],
      ['ru','Russian'], ['sr','Serbian'], ['sk','Slovak'], ['sl','Slovenian'],
      ['es','Spanish'], ['sw','Swahili'], ['sv','Swedish'], ['tl','Tagalog'],
      ['ta','Tamil'], ['te','Telugu'], ['th','Thai'], ['tr','Turkish'],
      ['uk','Ukrainian'], ['ur','Urdu'], ['vi','Vietnamese'], ['cy','Welsh'],
    ];
    LANGS.sort((a, b) => a[1].localeCompare(b[1]));
    for (const [code, name] of LANGS) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name + ' (' + code + ')';
      langSel.appendChild(opt);
    }
    if (!LANGS.find(l => l[0] === lang)) lang = 'en';
    langSel.value = lang;

    // 28 Soniox voices (all multilingual). Grouped by accent for browsing.
    const VOICES = [
      ['Neutral', ['Maya','Daniel','Noah','Nina','Emma','Jack','Adrian','Claire','Grace','Owen','Mina','Kenji']],
      ['British', ['Oliver','Arthur','Isla','Victoria']],
      ['American/Spanish', ['Rafael','Mateo','Lucia','Sofia']],
      ['Australian', ['Cooper','Mason','Ruby','Elise']],
      ['Indian', ['Arjun','Rohan','Priya','Meera']],
    ];
    const VOICE_FLAT = VOICES.flatMap(g => g[1]);
    for (const [group, names] of VOICES) {
      const og = document.createElement('optgroup');
      og.label = group;
      for (const n of names) {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        og.appendChild(opt);
      }
      voiceSel.appendChild(og);
    }
    if (!VOICE_FLAT.includes(voice)) voice = 'Adrian';
    voiceSel.value = voice;

    function setEngineLabel(s) { engineLabel.textContent = s || ''; }
    function applyModeUi() {
      modeBtn.textContent = mode === 'stream' ? '📡' : '📦';
      modeBtn.title = mode === 'stream' ? 'streaming (tap for one-shot)' : 'one-shot (tap for streaming)';
    }
    function applyMutedUi() {
      toggleBtn.textContent = muted ? '🔇' : '🔊';
      toggleBtn.classList.toggle('muted', muted);
      toggleBtn.title = muted ? 'voice is off — tap to enable' : 'voice is on — tap to mute';
    }
    setEngineLabel(muted ? 'off' : 'soniox');
    applyModeUi();
    applyMutedUi();

    function stopAll() {
      if (currentAudio) {
        try { currentAudio.pause(); currentAudio.removeAttribute('src'); currentAudio.load(); } catch (_) {}
        currentAudio = null;
      }
      if (currentStream) {
        try { currentStream.cancel(); } catch (_) {}
        currentStream = null;
      }
    }

    function dismissGestureNotice() {
      if (gestureGranted) return;
      gestureGranted = true;
      gestureNotice.classList.add('hidden');
      // Hide for real after the fade so it can't be tabbed/clicked.
      setTimeout(() => { gestureNotice.style.display = 'none'; }, 400);
    }
    // Any direct tap on the notice itself also counts as a gesture and
    // unlocks audio — handy on glasses where pointing at controls is hard.
    gestureNotice.addEventListener('click', () => {
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      dismissGestureNotice();
    });

    toggleBtn.addEventListener('click', () => {
      muted = !muted;
      applyMutedUi();
      setEngineLabel(muted ? 'off' : (sonioxAvailable ? 'soniox' : 'off'));
      if (muted) stopAll();
      // Tapping the button counts as a user gesture — wake any suspended
      // AudioContext so the next reply can play.
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      // Only dismiss the "enable voice" notice when audio is actually on.
      if (!muted) dismissGestureNotice();
    });

    modeBtn.addEventListener('click', () => {
      mode = (mode === 'stream') ? 'oneshot' : 'stream';
      try { localStorage.setItem(MODE_KEY, mode); } catch (_) {}
      applyModeUi();
      // Cancel anything in flight so the next message uses the new path.
      stopAll();
      // Counts as a gesture — useful when the user later unmutes.
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      // Don't dismiss the gesture notice: this button doesn't enable audio.
    });

    langSel.addEventListener('change', () => {
      lang = langSel.value || 'en';
      try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
      stopAll();
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
    });

    voiceSel.addEventListener('change', () => {
      voice = voiceSel.value || 'Adrian';
      try { localStorage.setItem(VOICE_KEY, voice); } catch (_) {}
      stopAll();
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
    });

    // Convert markdown/HTML to clean speakable text.
    function plainify(src) {
      // Strip fenced code blocks (they don't speak well).
      let s = String(src || '').replace(/```[\s\S]*?```/g, ' code block ');
      // Strip inline code backticks.
      s = s.replace(/`([^`]+)`/g, '$1');
      // Drop markdown emphasis markers + headings + list bullets + links.
      s = s.replace(/\*\*([^*]+)\*\*/g, '$1')
           .replace(/\*([^*]+)\*/g, '$1')
           .replace(/^#{1,6}\s+/gm, '')
           .replace(/^[\s]*[-*+]\s+/gm, '')
           .replace(/^[\s]*\d+\.\s+/gm, '')
           .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
           // Tables: keep cell contents, drop pipes/divider rows.
           .replace(/^\s*\|?\s*[:\-\s|]+\s*\|?\s*$/gm, '')
           .replace(/\|/g, ', ');
      // Collapse whitespace.
      s = s.replace(/\s+/g, ' ').trim();
      // Trim insanely long replies — TTS bill / latency guard.
      if (s.length > 600) s = s.slice(0, 600).replace(/[^.!?]*$/, '') || s.slice(0, 600);
      return s;
    }

    // Surface TTS failures via the status footer so we can see them on the
    // glasses without DevTools. Distinguish permanent (turn off + stop
    // trying) from transient (retry next reply).
    function ttsStatusEvent(text) {
      push({ type: 'status', status: 'tts:' + text, ts: new Date().toISOString() });
    }
    function ttsFail(reason, permanent) {
      if (permanent) {
        sonioxAvailable = false;
        setEngineLabel('off:' + reason);
      } else {
        setEngineLabel('err:' + reason);
      }
      ttsStatusEvent((permanent ? 'off ' : 'err ') + reason);
    }

    async function playSoniox(text) {
      let resp;
      try {
        resp = await fetch('/glasses/tts' + (t ? '?t=' + encodeURIComponent(t) : ''), {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, language: lang, voice }),
        });
      } catch (e) {
        // Network/CORS/FD-down. Retryable.
        ttsFail('net', false);
        return;
      }
      if (resp.status === 503 || resp.status === 401 || resp.status === 403) {
        // Server config / auth issue — won't fix itself mid-session.
        ttsFail(String(resp.status), true);
        return;
      }
      if (!resp.ok) {
        // Other non-200: log and try again next reply.
        ttsFail(String(resp.status), false);
        return;
      }
      // Success on the HTTP side — clear any prior 'err:' label.
      setEngineLabel('soniox');
      const blob = await resp.blob();
      if (!blob || blob.size === 0) { ttsFail('empty', false); return; }
      // Surface the MIME the server sent — handy when debugging "no sound
      // but no error" (usually codec mismatch).
      const contentType = resp.headers.get('content-type') || '';
      const url = URL.createObjectURL(blob);
      await new Promise((resolve) => {
        const a = new Audio();
        // Set type via the source element so the browser doesn't have to
        // sniff — avoids decoder picking the wrong path on some webviews.
        if (contentType) a.type = contentType;
        a.src = url;
        currentAudio = a;
        let done = false;
        const finish = (errCode) => {
          if (done) return;
          done = true;
          // Detach the element from the blob URL BEFORE revoking, so any
          // in-flight fetch is cancelled cleanly instead of logging
          // ERR_FILE_NOT_FOUND. The revoke is deferred to the next tick
          // so the pause/load can settle.
          try { a.pause(); a.removeAttribute('src'); a.load(); } catch (_) {}
          setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 0);
          if (currentAudio === a) currentAudio = null;
          if (errCode) ttsFail(errCode, errCode === '503' || errCode === '401' || errCode === '403');
          resolve();
        };
        a.onended = () => { dismissGestureNotice(); finish(null); };
        a.onerror = () => {
          // a.error.code: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED
          const codes = { 1: 'abort', 2: 'net', 3: 'decode', 4: 'codec' };
          const c = (a.error && codes[a.error.code]) || 'audio';
          finish(c);
        };
        a.play().catch((err) => {
          const name = (err && err.name) || 'play';
          finish(name === 'NotAllowedError' ? 'gesture' : 'play');
        });
      });
    }

    // ── Streaming path: WS + Web Audio scheduler ─────────────────────
    // Lazy-create the AudioContext on first use so it can inherit a user
    // gesture (mute/mode-toggle clicks above resume() it if suspended).
    let audioCtx = null;
    function getCtx(sampleRate) {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC({ sampleRate }); }
      catch (_) { audioCtx = new AC(); }
      return audioCtx;
    }

    async function playSonioxStream(text) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) {
        ttsFail('noaudioctx', false);
        return playSoniox(text);  // graceful fallback to one-shot
      }

      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = scheme + '://' + location.host + '/glasses/tts-stream'
                + (t ? '?t=' + encodeURIComponent(t) : '');

      return new Promise((resolve) => {
        let ws;
        try { ws = new WebSocket(url); }
        catch (_) { ttsFail('wsopen', false); return resolve(); }
        ws.binaryType = 'arraybuffer';

        let ctx = null;
        let nextStart = 0;
        let scheduled = 0;
        let finished = 0;
        let streamEnded = false;
        let settled = false;
        const sources = [];
        let cancelled = false;

        const settle = () => {
          if (settled) return;
          settled = true;
          if (currentStream === api) currentStream = null;
          resolve();
        };
        const tryFinalize = () => {
          if (streamEnded && finished >= scheduled) settle();
        };
        const api = {
          cancel() {
            cancelled = true;
            streamEnded = true;
            try { ws.close(); } catch (_) {}
            for (const s of sources) { try { s.stop(); } catch (_) {} }
            settle();
          },
        };
        currentStream = api;

        ws.onopen = () => {
          ws.send(JSON.stringify({ text, language: lang, voice }));
        };
        ws.onmessage = (ev) => {
          if (cancelled) return;
          if (typeof ev.data === 'string') {
            let m; try { m = JSON.parse(ev.data); } catch { return; }
            if (m.type === 'info') {
              ctx = getCtx(m.sample_rate || 24000);
              if (!ctx) { ttsFail('ctx', false); try { ws.close(); } catch (_) {} return settle(); }
              if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
              nextStart = ctx.currentTime;
              setEngineLabel('soniox');
            } else if (m.type === 'error') {
              const code = String(m.code || '');
              const perm = (code === '503' || code === '401' || code === '403');
              ttsFail(code || 'stream', perm);
              try { ws.close(); } catch (_) {}
              streamEnded = true;
              tryFinalize();
            } else if (m.type === 'end') {
              streamEnded = true;
              tryFinalize();
            }
            return;
          }
          // Binary PCM s16le mono.
          if (!ctx) return;            // shouldn't happen — info comes first
          const int16 = new Int16Array(ev.data);
          if (int16.length === 0) return;
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
          const buf = ctx.createBuffer(1, float32.length, ctx.sampleRate);
          buf.copyToChannel(float32, 0);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          // Tiny safety margin so back-to-back chunks don't clip on slow
          // schedulers; effectively zero for our use.
          const startAt = Math.max(ctx.currentTime + 0.01, nextStart);
          src.start(startAt);
          nextStart = startAt + buf.duration;
          scheduled++;
          sources.push(src);
          src.onended = () => {
            finished++;
            // Real audio actually came out — gesture must have been granted.
            if (finished === 1) dismissGestureNotice();
            tryFinalize();
          };
        };
        ws.onerror = () => {
          if (cancelled) return;
          // Don't flip the engine off — could be a transient hiccup.
          ttsFail('wserr', false);
        };
        ws.onclose = () => {
          streamEnded = true;
          // If we got 0 chunks (e.g. error during setup), fall back to
          // one-shot for THIS reply so it isn't silent. The 'err:' label
          // is already set; soniox availability stays true.
          if (!cancelled && scheduled === 0) {
            settle();
            playSoniox(text);
            return;
          }
          tryFinalize();
        };
      });
    }

    async function speakOne(rawText) {
      if (muted || !sonioxAvailable) return;
      const text = plainify(rawText);
      if (!text) return;
      if (mode === 'stream') {
        await playSonioxStream(text);
      } else {
        await playSoniox(text);
      }
    }

    function speak(text) {
      // Hard short-circuit BEFORE the queue: if voice is off (or Soniox is
      // unavailable), never schedule a Soniox call at all. This guarantees
      // zero network traffic to /glasses/tts* while muted, even if multiple
      // agent replies pile up while the user is deciding to enable voice.
      if (muted || !sonioxAvailable) return;
      // Queue so replies play in order, never overlapping.
      queue = queue.then(() => speakOne(text)).catch(() => {});
    }

    return { speak };
  })();

  let ws = null;
  function openWs() {
    if (!channel) { conn.textContent = 'no channel'; return; }
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = scheme + '://' + location.host + '/glasses/ws?c=' + encodeURIComponent(channel) + '&role=glasses' + qs;
    ws = new WebSocket(url);
    // Reset liveMode on every (re)connect; bridge will set it back to true
    // when its "subscribed" status arrives after the backfill batch.
    liveMode = false;
    ws.onopen = () => { conn.textContent = 'live'; conn.classList.remove('off'); };
    ws.onclose = () => {
      conn.textContent = 'reconnecting'; conn.classList.add('off');
      liveMode = false;
      setTimeout(openWs, 1500);
    };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      push(m);
    };
  }

  openWs();
})();
</script>

<!-- ── Content views: mode switching + datastore / files rendering ──────
     Independent of the chat IIFE above. The chat WebSocket keeps running
     underneath while a content view is shown, so switching back is instant
     and never drops live messages. All data is proxied through Flight Deck
     to the agent this channel is bound to (/glasses/datastore/*, /glasses/
     files*); nothing is fetched until its tab is first opened. -->
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const channel = params.get('c') || '';
  const t = params.get('t') || '';
  const cq = 'c=' + encodeURIComponent(channel);
  const tq = t ? ('&t=' + encodeURIComponent(t)) : '';

  const hasMarked = (typeof window.marked !== 'undefined');
  // Ensure GFM is on for this renderer too (tables, fenced code, autolinks).
  // The chat IIFE already calls setOptions, but marked's config is global so
  // setting it here as well is harmless and keeps the file viewer self-
  // contained — markdown tables render even if that call ever moves.
  if (hasMarked) {
    try { marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false }); } catch (_) {}
  }
  function renderMd(src) {
    if (hasMarked) { try { return marked.parse(String(src || '')); } catch (_) {} }
    return String(src || '')
      .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
      .replace(/\n/g, '<br>');
  }

  // Injected into every .html file shown in the iframe. Two jobs:
  //   1. Minimum 16px text (base rule + a pass that bumps any element whose
  //      computed size is still under 16px — covers explicit small px sizes).
  //   2. Post the document's content height back to the parent so the iframe
  //      can be sized to fit. Without this the iframe stays a fixed height and
  //      only scrolls internally (unreliable on the glasses); sizing it to its
  //      content lets the outer .record-page do the scrolling like markdown does.
  const HTML_MIN_SIZE = 16;
  const HTML_CLAMP =
    '<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}' +
    'html,body{margin:0;}body{font-size:' + HTML_MIN_SIZE + 'px;line-height:1.5;}</style>' +
    '<script>(function(){' +
    'function clamp(){try{var e=document.querySelectorAll("*");' +
    'for(var i=0;i<e.length;i++){var s=parseFloat(getComputedStyle(e[i]).fontSize);' +
    'if(s&&s<' + HTML_MIN_SIZE + '){e[i].style.fontSize="' + HTML_MIN_SIZE + 'px";}}}catch(_){}}' +
    'function postH(){try{var b=document.body,d=document.documentElement;' +
    'var h=Math.max(d?d.scrollHeight:0,b?b.scrollHeight:0,b?b.offsetHeight:0);' +
    'parent.postMessage({__glassesFrameHeight:h},"*");}catch(_){}}' +
    'function run(){clamp();postH();}' +
    'if(document.readyState!=="loading"){run();}else{document.addEventListener("DOMContentLoaded",run);}' +
    'window.addEventListener("load",postH);window.addEventListener("resize",postH);' +
    'setTimeout(postH,300);setTimeout(postH,1200);' +   // re-measure after late fonts/images
    '})();<\/script>';

  const stack = document.getElementById('stack');
  const dsView = document.getElementById('ds-view');
  const filesView = document.getElementById('files-view');
  const btnChat = document.getElementById('mode-chat');
  const btnDs = document.getElementById('mode-ds');
  const btnFiles = document.getElementById('mode-files');

  let dsLoaded = false, filesLoaded = false;

  function setMode(next) {
    btnChat.classList.toggle('active', next === 'chat');
    btnDs.classList.toggle('active', next === 'ds');
    btnFiles.classList.toggle('active', next === 'files');
    dsView.classList.toggle('show', next === 'ds');
    filesView.classList.toggle('show', next === 'files');
    // Hide only the chat message stack when a content view is up (so the
    // chat's body-scroll can't peek through). The status footer stays
    // visible on every page — content views reserve room for it via
    // padding-bottom.
    stack.style.display = (next === 'chat') ? '' : 'none';
    if (next === 'ds' && !dsLoaded) loadTables();
    if (next === 'files' && !filesLoaded) loadFiles();
  }
  // onActivate = click + Enter/Space, so the glasses select gesture works on
  // these <div role=button>s (a <div>, unlike <button>, doesn't activate on
  // Enter/Space by itself). onActivate is hoisted (function declaration below).
  onActivate(btnChat, () => setMode('chat'));
  onActivate(btnDs, () => setMode('ds'));
  onActivate(btnFiles, () => setMode('files'));

  function note(el, text, isErr) {
    el.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'vnote' + (isErr ? ' err' : '');
    d.textContent = text;
    el.appendChild(d);
  }

  async function getJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    let body = null;
    try { body = await r.json(); } catch (_) {}
    if (!r.ok) {
      const msg = (body && (body.detail || body.error)) || ('HTTP ' + r.status);
      throw new Error(msg);
    }
    return body;
  }

  // Wire a focusable <div role=button> for both tap and the glasses select
  // gesture (which arrives as Enter/Space on the focused element).
  function onActivate(el, fn) {
    el.addEventListener('click', fn);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
    });
  }

  // ── Datastore: table menu (step 1) → one record per screen (step 2) ──
  const dsTablesEl = document.getElementById('ds-tables');
  const dsRowsEl = document.getElementById('ds-rows');
  const dsPosEl = document.getElementById('ds-pos');
  const dsPaneSelect = document.getElementById('ds-pane-select');
  const dsPaneContent = document.getElementById('ds-pane-content');
  const dsTitleEl = document.getElementById('ds-title');
  const dsBackEl = document.getElementById('ds-back');
  let dsActive = '';

  // Step toggling. Returning to the list keeps the menu intact (no reload),
  // so going back is instant.
  function showDsSelect() {
    dsPaneContent.classList.remove('show');
    dsPaneSelect.classList.add('show');
  }
  function showDsContent(table, count) {
    dsTitleEl.innerHTML = '';
    dsTitleEl.appendChild(document.createTextNode(table));
    if (count !== undefined && count !== null) {
      const c = document.createElement('span');
      c.className = 'count'; c.textContent = count;
      dsTitleEl.appendChild(c);
    }
    dsPaneSelect.classList.remove('show');
    dsPaneContent.classList.add('show');
  }
  onActivate(dsBackEl, showDsSelect);
  let dsCount = 0;     // record pages currently rendered
  let dsIdx = 0;       // index of the record currently in view (display)
  let dsTarget = 0;    // index the nav buttons step from (stable across clicks)
  let dsProgUntil = 0; // while a programmatic smooth-scroll is animating, the
                       // scroll handler must not adopt intermediate offsets as
                       // the new target — otherwise rapid ‹ › taps drift.

  // Build the position bar: ‹ prev / next ›, "n / m", and dots (when the
  // row count is small enough to fit). Returns nothing; wires the buttons.
  function buildPosBar(total) {
    dsPosEl.innerHTML = '';
    if (!dsCount) return;
    const prev = document.createElement('button');
    prev.className = 'nav'; prev.textContent = '‹'; prev.title = 'previous record';
    prev.addEventListener('click', () => goTo(dsTarget - 1));
    const next = document.createElement('button');
    next.className = 'nav'; next.textContent = '›'; next.title = 'next record';
    next.addEventListener('click', () => goTo(dsTarget + 1));
    const pos = document.createElement('span');
    pos.className = 'pos'; pos.id = 'ds-pos-text';
    const dots = document.createElement('span');
    dots.className = 'dots'; dots.id = 'ds-pos-dots';
    // Dots only when they comfortably fit; otherwise the n/m counter alone.
    if (dsCount <= 18) {
      for (let i = 0; i < dsCount; i++) {
        const d = document.createElement('span');
        d.className = 'd';
        dots.appendChild(d);
      }
    }
    dsPosEl.appendChild(prev);
    dsPosEl.appendChild(pos);
    dsPosEl.appendChild(next);
    dsPosEl.appendChild(dots);
    if (total > dsCount) {
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = 'first ' + dsCount + ' of ' + total;
      dsPosEl.appendChild(hint);
    }
  }

  function updatePos(idx) {
    dsIdx = Math.max(0, Math.min(idx, dsCount - 1));
    const posText = document.getElementById('ds-pos-text');
    if (posText) posText.textContent = (dsIdx + 1) + ' / ' + dsCount;
    const dots = document.getElementById('ds-pos-dots');
    if (dots) {
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i === dsIdx));
    }
    const navs = dsPosEl.querySelectorAll('.nav');
    if (navs[0]) navs[0].disabled = (dsIdx <= 0);
    if (navs[1]) navs[1].disabled = (dsIdx >= dsCount - 1);
  }

  function goTo(idx) {
    const clamped = Math.max(0, Math.min(idx, dsCount - 1));
    dsTarget = clamped;
    const w = dsRowsEl.clientWidth || 1;
    dsProgUntil = Date.now() + 700;   // ignore scroll-derived target until settled
    dsRowsEl.scrollTo({ left: clamped * w, behavior: 'smooth' });
    updatePos(clamped);
  }

  // Track swipes: derive the current record from the pager's scroll offset.
  // A manual swipe also becomes the new nav target, but only once any
  // programmatic smooth-scroll has settled (so button taps aren't clobbered).
  let dsScrollRaf = 0;
  dsRowsEl.addEventListener('scroll', () => {
    if (dsScrollRaf) return;
    dsScrollRaf = requestAnimationFrame(() => {
      dsScrollRaf = 0;
      const w = dsRowsEl.clientWidth || 1;
      const idx = Math.round(dsRowsEl.scrollLeft / w);
      updatePos(idx);
      if (Date.now() > dsProgUntil) dsTarget = idx;
    });
  });

  async function loadTables() {
    dsLoaded = true;
    note(dsTablesEl, 'Loading tables…');
    showDsSelect();
    let tables;
    try {
      tables = await getJSON('/glasses/datastore/tables?' + cq + tq) || [];
    } catch (e) {
      note(dsTablesEl, 'Could not load datastore: ' + e.message, true);
      return;
    }
    if (!tables.length) { note(dsTablesEl, 'No tables in the datastore yet.'); return; }
    dsTablesEl.innerHTML = '';
    tables.forEach((tb) => {
      // A <div role=button> (not a native <button>) so the glasses focus-walk
      // lands on it — the Display only steps focus onto tabindexed <div>s.
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.appendChild(document.createTextNode(tb.name));
      const cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = tb.row_count;
      item.appendChild(cnt);
      onActivate(item, () => { showDsContent(tb.name, tb.row_count); loadRows(tb.name); });
      dsTablesEl.appendChild(item);
    });
  }

  async function loadRows(table) {
    dsActive = table;
    note(dsRowsEl, 'Loading ' + table + '…');
    let data;
    try {
      data = await getJSON('/glasses/datastore/rows?' + cq +
        '&table=' + encodeURIComponent(table) + tq);
    } catch (e) {
      dsPosEl.innerHTML = '';
      note(dsRowsEl, 'Could not load rows: ' + e.message, true);
      return;
    }
    if (table !== dsActive) return;   // a newer chip selection superseded this
    const cols = (data && data.columns) || [];
    const rows = (data && data.rows) || [];
    if (!rows.length) {
      dsPosEl.innerHTML = '';
      note(dsRowsEl, 'Table “' + table + '” has no rows.');
      return;
    }
    // One record per page; every field is its own card on that page.
    dsRowsEl.innerHTML = '';
    rows.forEach((row, ri) => {
      const page = document.createElement('div');
      page.className = 'record-page';
      const idEl = document.createElement('div');
      idEl.className = 'rec-id';
      idEl.textContent = (row._id !== undefined) ? ('#' + row._id) : ('Record ' + (ri + 1));
      page.appendChild(idEl);
      cols.forEach(col => {
        if (col === '_id') return;
        const card = document.createElement('div');
        card.className = 'card';
        const k = document.createElement('div');
        k.className = 'field-k';
        k.textContent = col;
        const v = document.createElement('div');
        v.className = 'field-v';
        const val = row[col];
        if (val === null || val === undefined || val === '') {
          v.classList.add('empty');
          v.textContent = '—';
        } else {
          v.textContent = (typeof val === 'object') ? JSON.stringify(val) : String(val);
        }
        card.appendChild(k);
        card.appendChild(v);
        page.appendChild(card);
      });
      dsRowsEl.appendChild(page);
    });
    dsCount = rows.length;
    dsTarget = 0;
    dsRowsEl.scrollLeft = 0;
    buildPosBar((data && data.total) || rows.length);
    updatePos(0);
  }

  // ── Files: file menu (step 1) → scrollable content (step 2) ────────
  const filesListEl = document.getElementById('files-list');
  const filesContentEl = document.getElementById('files-content');
  const filesPaneSelect = document.getElementById('files-pane-select');
  const filesPaneContent = document.getElementById('files-pane-content');
  const filesTitleEl = document.getElementById('files-title');
  const filesBackEl = document.getElementById('files-back');
  let filesActive = '';
  let filesFrame = null;   // the live .html iframe, sized from its content

  function showFilesSelect() {
    filesPaneContent.classList.remove('show');
    filesPaneSelect.classList.add('show');
  }
  function showFilesContent(title) {
    filesTitleEl.textContent = title || '';
    filesPaneSelect.classList.remove('show');
    filesPaneContent.classList.add('show');
  }
  onActivate(filesBackEl, showFilesSelect);

  // Size the .html iframe to the content height its injected script reports,
  // so the document flows into the scrollable view (the outer .record-page
  // scrolls) instead of scrolling inside a fixed-height frame.
  window.addEventListener('message', (e) => {
    const h = e && e.data && e.data.__glassesFrameHeight;
    if (typeof h === 'number' && h > 0 && filesFrame) {
      filesFrame.style.height = h + 'px';
    }
  });

  // Left/right (NeuralBand → ArrowLeft/ArrowRight) jump the open file to its
  // top / bottom — but ONLY while focus is inside the file content, so the
  // gesture doesn't hijack anything else (chat, datastore record paging, the
  // file selector pills). Down/up keep doing the focus-walk through blocks.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (!filesContentEl.contains(document.activeElement)) return;
    const page = filesContentEl.querySelector('.record-page');
    if (!page) return;
    page.scrollTo({
      top: e.key === 'ArrowLeft' ? 0 : page.scrollHeight,
      behavior: 'smooth',
    });
    e.preventDefault();
  });

  async function loadFiles() {
    filesLoaded = true;
    note(filesListEl, 'Loading files…');
    showFilesSelect();
    let files;
    try {
      files = await getJSON('/glasses/files?' + cq + tq) || [];
    } catch (e) {
      note(filesListEl, 'Could not load files: ' + e.message, true);
      return;
    }
    if (!files.length) { note(filesListEl, 'No .md or .html files yet.'); return; }
    filesListEl.innerHTML = '';
    files.forEach((f) => {
      // A <div role=button> (not a native <button>) so the glasses focus-walk
      // lands on it — the Display only steps focus onto tabindexed <div>s.
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      const name = f.filename || f.logical || '(file)';
      item.textContent = name;
      item.title = f.logical || f.filename || '';
      onActivate(item, () => { showFilesContent(name); openFile(f); });
      filesListEl.appendChild(item);
    });
  }

  async function openFile(f) {
    filesActive = f.physical;
    note(filesContentEl, 'Loading ' + (f.filename || '') + '…');
    let data;
    try {
      data = await getJSON('/glasses/files/content?' + cq +
        '&path=' + encodeURIComponent(f.physical) + tq);
    } catch (e) {
      note(filesContentEl, 'Could not load file: ' + e.message, true);
      return;
    }
    if (f.physical !== filesActive) return;
    const content = (data && data.content) || '';
    const ext = (f.extension || '').toLowerCase();
    filesFrame = null;   // drop any prior frame so stale height messages no-op
    // One file = one .record-page inside the pager, exactly like a datastore
    // record. The .record-page is the proven-on-glasses vertical scroller.
    //
    // The glasses navigate by FOCUS (the NeuralBand down gesture moves focus to
    // the next focusable element, and the webview scrolls focused elements into
    // view) — plain <div>s aren't focusable, so the content never received
    // focus and nothing scrolled. We make the scroller AND each card focusable
    // (tabindex=0) so the down gesture can land on them and walk down the file.
    filesContentEl.innerHTML = '';
    const page = document.createElement('div');
    page.className = 'record-page';
    page.tabIndex = 0;

    // Header card — the filename, above the content.
    const topCard = document.createElement('div');
    topCard.className = 'card';
    topCard.tabIndex = 0;
    const topK = document.createElement('div');
    topK.className = 'field-k';
    topK.textContent = 'FILE';
    const topV = document.createElement('div');
    topV.className = 'field-v';
    topV.textContent = f.filename || f.logical || '';
    topCard.appendChild(topK);
    topCard.appendChild(topV);
    page.appendChild(topCard);

    // Content card — the rendered file is encapsulated in its own .card.
    const contentCard = document.createElement('div');
    contentCard.className = 'card';
    contentCard.tabIndex = 0;
    if (ext === '.html' || ext === '.htm') {
      // Sandboxed iframe so the document renders with its own markup/styles
      // in isolation and can't reach into (or restyle) the HUD. allow-scripts
      // (without allow-same-origin) keeps it on a unique origin — it can run
      // its own scripts, including our injected clamp + height reporter, but
      // can't touch the parent page, cookies, or storage.
      const frame = document.createElement('iframe');
      frame.className = 'file-frame';
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.srcdoc = content + HTML_CLAMP;
      contentCard.appendChild(frame);
      filesFrame = frame;   // its postMessage(height) drives frame.style.height
    } else {
      const div = document.createElement('div');
      div.className = 'file-md';
      div.innerHTML = renderMd(content);
      // Make each top-level block (heading, paragraph, list, table, …) a focus
      // stop so the NeuralBand down-gesture walks through long prose smoothly —
      // the same way it steps through a datastore record's many small cards.
      for (const child of div.children) child.tabIndex = 0;
      contentCard.appendChild(div);
    }
    page.appendChild(contentCard);

    // Footer card — below the content. Gives the record-page a third .card
    // child (header/content/footer) like a multi-field datastore record.
    const bottomCard = document.createElement('div');
    bottomCard.className = 'card';
    bottomCard.tabIndex = 0;
    const botV = document.createElement('div');
    botV.className = 'field-v empty';
    botV.style.textAlign = 'center';
    botV.textContent = '— end of file —';
    bottomCard.appendChild(botV);
    page.appendChild(bottomCard);

    filesContentEl.appendChild(page);
    page.scrollTop = 0;
  }
})();
</script>
</body>
</html>
