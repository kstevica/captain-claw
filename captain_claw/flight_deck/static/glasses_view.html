<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain Claw</title>

<!-- ── App icons for Meta Ray-Ban Display launcher ─────────────────────
     Meta's wearables runtime scans <link rel="icon"> + the manifest for
     this. PNG only — SVG is explicitly not supported. -->
<link rel="icon"             href="/icon-192.png"        sizes="192x192" type="image/png">
<link rel="icon"             href="/icon-96.png"         sizes="96x96"   type="image/png">
<link rel="icon"             href="/icon-512.png"        sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/glasses/view-manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<style>
  /* ── Design tokens — HUD-style for transparent glasses display ──── */
  :root {
    color-scheme: dark;
    --bg:        #000;        /* pure black is most readable on HUD */
    --ink:       #e8ffe8;
    --ink-dim:   #7faf8a;
    --ink-mut:   #4c6f56;
    --hud:       #5fff9f;     /* primary HUD green */
    --hud-soft:  rgba(95,255,159,0.18);
    --hud-glow:  rgba(95,255,159,0.45);
    --user:      #9bd0ff;
    --user-bg:   #07111d;
    --agent:     #f4ffd6;
    --agent-bg:  #0a140a;
    --err:       #ff8a8a;
    --err-bg:    #1a0a0a;
    --warn:      #ffd877;
    --line:      #1c2820;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 24px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 56px 18px 76px;
    transition: padding-bottom .18s ease;
  }
  body.thinking { padding-bottom: 116px; }
  ::selection { background: var(--hud-soft); color: var(--ink); }

  /* ── Floating HUD header bar ───────────────────────────────────── */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.65) 70%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5; gap: 8px;
    font-size: 11px;
  }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 999px;
    font: 600 10px/1 ui-monospace, Menlo, monospace;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }
  .pill .ssr { color: var(--warn); }
  /* App brand pill — distinct purple matches the Captain Claw mark. */
  .pill.brand {
    background: linear-gradient(135deg, rgba(134,59,255,0.22), rgba(71,191,255,0.16));
    border-color: rgba(134,59,255,0.55);
    color: #efe6ff;
    text-transform: uppercase;
    padding: 3px 10px 3px 6px;
    box-shadow: 0 0 12px rgba(134,59,255,0.25);
  }
  .pill.brand .brand-icon {
    width: 14px; height: 14px;
    display: inline-block;
    filter: drop-shadow(0 0 4px rgba(134,59,255,0.6));
  }
  .pill.brand .brand-name { font-weight: 700; letter-spacing: 0.14em; }
  .pill.conn { color: var(--hud); border-color: rgba(95,255,159,0.3); }
  .pill.conn::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--hud); box-shadow: 0 0 6px var(--hud-glow);
    animation: hud-pulse 2.4s ease-in-out infinite;
  }
  .pill.conn.off { color: var(--err); border-color: rgba(255,138,138,0.3); }
  .pill.conn.off::before { background: var(--err); box-shadow: 0 0 6px rgba(255,138,138,0.6); animation: none; }
  @keyframes hud-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .tts-btn, .tts-link {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px;
    width: 28px; height: 28px; padding: 0; margin: 0;
    font: 13px ui-monospace, Menlo, monospace;
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .tts-btn:hover, .tts-link:hover { background: var(--hud-soft); color: var(--ink); border-color: rgba(95,255,159,0.35); }
  .tts-btn:active, .tts-link:active { background: rgba(95,255,159,0.28); }
  .tts-btn.muted { color: var(--err); border-color: rgba(255,138,138,0.35); }
  .tts-btn.engine {
    font-size: 10px; opacity: 0.85; width: auto; padding: 0 8px;
    letter-spacing: 0.05em;
  }
  /* Hidden — selectors live on /glasses/settings as button grids. */
  .tts-lang { display: none; }

  /* ── First-load audio-gesture notice ───────────────────────────── */
  #gesture-notice {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    background: rgba(13, 26, 17, 0.92);
    border: 1px solid var(--hud);
    color: var(--ink); border-radius: 12px;
    padding: 12px 18px;
    font: 600 14px/1.3 ui-monospace, Menlo, monospace;
    box-shadow: 0 0 0 1px rgba(95,255,159,0.15) inset,
                0 8px 32px rgba(0,0,0,0.7),
                0 0 24px rgba(95,255,159,0.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 10; cursor: pointer;
    transition: opacity .35s, transform .35s;
    max-width: 88%; text-align: center;
    letter-spacing: 0.02em;
  }
  #gesture-notice.hidden { opacity: 0; transform: translate(-50%, -10px); pointer-events: none; }

  /* ── Message stack ─────────────────────────────────────────────── */
  #stack { display: flex; flex-direction: column; gap: 12px; }
  .msg {
    padding: 12px 16px;
    border-radius: 14px;
    background: var(--agent-bg);
    border: 1px solid transparent;
    opacity: 0.55;
    position: relative;
    transition: opacity .25s, transform .25s, border-color .25s;
  }
  .msg.user  { background: var(--user-bg);  color: var(--user); }
  .msg.agent { background: var(--agent-bg); color: var(--agent); }
  .msg.error { background: var(--err-bg);   color: var(--err); }
  .msg.newest { opacity: 1; }
  .msg.newest.agent { border-color: rgba(95,255,159,0.25); box-shadow: 0 0 0 1px rgba(95,255,159,0.08) inset; }
  .msg.newest.user  { border-color: rgba(155,208,255,0.22); }
  .msg.newest.error { border-color: rgba(255,138,138,0.3); }

  .msg-head {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 11px/1 ui-monospace, Menlo, monospace;
    color: var(--ink-mut); margin-bottom: 6px;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .role { display: inline-flex; align-items: center; gap: 6px; }
  .role .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.65;
  }
  .msg.user  .role { color: var(--user); }
  .msg.agent .role { color: var(--hud); }
  .msg.error .role { color: var(--err); }
  .ts { color: var(--ink-mut); font-weight: 500; letter-spacing: 0.05em; }

  .text { word-wrap: break-word; overflow-wrap: anywhere; }
  .text p { margin: 0.3em 0; }
  .text p:first-child { margin-top: 0; }
  .text p:last-child { margin-bottom: 0; }
  .text h1, .text h2, .text h3, .text h4 {
    margin: 0.5em 0 0.2em; line-height: 1.2; font-weight: 700;
  }
  .text h1 { font-size: 1.15em; }
  .text h2 { font-size: 1.08em; }
  .text h3, .text h4 { font-size: 1.0em; }
  .text ul, .text ol { margin: 0.3em 0; padding-left: 1.4em; }
  .text li { margin: 0.15em 0; }
  .text code {
    background: rgba(255,255,255,0.06); color: var(--warn);
    padding: 1px 6px; border-radius: 4px; font-size: 0.9em;
  }
  .text pre {
    background: rgba(0,0,0,0.5); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 10px;
    overflow-x: auto; margin: 0.5em 0;
  }
  .text pre code { background: transparent; padding: 0; color: inherit; }
  .text blockquote {
    margin: 0.4em 0; padding: 4px 12px;
    border-left: 3px solid var(--hud); color: var(--ink);
    background: rgba(95,255,159,0.05);
    border-radius: 0 8px 8px 0;
  }
  .text a { color: var(--user); }
  .text table {
    border-collapse: separate; border-spacing: 0;
    margin: 0.5em 0; font-size: 0.9em; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .text th, .text td {
    padding: 6px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  .text tr:last-child td { border-bottom: 0; }
  .text th {
    background: rgba(255,255,255,0.04);
    font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; font-size: 0.85em;
    color: var(--ink-dim);
  }
  .text tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .text hr { border: 0; border-top: 1px solid var(--line); margin: 0.6em 0; }

  /* ── Status footer (sysbar) ────────────────────────────────────── */
  #sysbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
    border-top: 1px solid var(--line);
    padding: 6px 14px 8px;
    font: 600 12px/1.25 ui-monospace, Menlo, monospace;
    color: var(--ink-mut);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: padding .2s ease, background .2s ease,
                border-color .2s ease, font-size .2s ease,
                box-shadow .2s ease;
    z-index: 4;
  }
  #sysbar .now {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--ink-dim); font-weight: 600; letter-spacing: 0.06em;
  }
  #sysbar .now::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.6;
  }
  #sysbar .now.idle { color: var(--ink-mut); }
  #sysbar .now.busy { color: var(--warn); }
  #sysbar .now.err  { color: var(--err); }
  #sysbar .hist {
    color: var(--ink-mut); opacity: 0.55; font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 3px;
  }
  #sysbar .hist span { margin-right: 12px; }

  /* ── Thinking state ────────────────────────────────────────────── */
  #sysbar.thinking {
    padding: 18px 22px 20px;
    background: linear-gradient(180deg, rgba(45,28,5,0.95), rgba(20,12,2,0.98));
    border-top: 1px solid rgba(255,200,100,0.4);
    font-size: 22px;
    box-shadow: 0 -8px 32px rgba(255, 200, 80, 0.22),
                0 0 0 1px rgba(255,200,100,0.1) inset;
  }
  #sysbar.thinking .now {
    color: var(--warn);
    font-size: 22px; font-weight: 700;
    text-transform: lowercase; letter-spacing: 0.04em;
    gap: 14px;
  }
  #sysbar.thinking .now::before {
    width: 14px; height: 14px; opacity: 1;
    box-shadow: 0 0 14px rgba(255, 216, 119, 0.85),
                0 0 28px rgba(255, 216, 119, 0.4);
    animation: tk-pulse 1.1s ease-in-out infinite;
  }
  #sysbar.thinking .hist { display: none; }

  @keyframes tk-pulse {
    0%, 100% { transform: scale(0.7); opacity: 0.55; }
    50%      { transform: scale(1.25); opacity: 1; }
  }
</style>
</head>
<body>
<header class="hud">
  <div class="hud-left">
    <span class="pill brand" title="Captain Claw">
      <img class="brand-icon" src="/favicon.svg" alt="">
      <span class="brand-name">Claw</span>
    </span>
    <span class="pill" title="server-render token / time">
      <span class="ssr">{{SSR_TOKEN}}</span>
    </span>
    <span class="pill conn off" id="conn">…</span>
  </div>
  <div class="hud-right">
    <button class="tts-btn" id="tts-toggle" type="button" title="toggle voice">🔊</button>
    <button class="tts-btn" id="tts-mode" type="button" title="stream vs one-shot">📡</button>
    <a class="tts-link" id="tts-settings" href="#" title="language &amp; voice settings">⚙</a>
    <select class="tts-lang" id="tts-lang" title="voice language" aria-label="voice language"></select>
    <select class="tts-lang" id="tts-voice" title="voice" aria-label="voice"></select>
    <span class="tts-btn engine" id="tts-engine">—</span>
  </div>
</header>

<div id="gesture-notice">🔇 Voice is off — tap 🔊 to enable</div>

<div id="stack"></div>

<div id="sysbar">
  <div class="now idle" id="sysnow">—</div>
  <div class="hist" id="syshist"></div>
</div>

<!-- marked for markdown + tables. Fallback to plain text if it fails to load. -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const channel = params.get('c') || '';
  const t = params.get('t') || '';
  const qs = t ? ('&t=' + encodeURIComponent(t)) : '';

  // Settings page link — preserves channel + token so "back to glasses"
  // can return here.
  (() => {
    const link = document.getElementById('tts-settings');
    if (!link) return;
    const sp = new URLSearchParams();
    if (channel) sp.set('c', channel);
    if (t) sp.set('t', t);
    const qstr = sp.toString();
    link.href = '/glasses/settings' + (qstr ? '?' + qstr : '');
  })();

  const stack = document.getElementById('stack');
  const conn = document.getElementById('conn');
  const sysnow = document.getElementById('sysnow');
  const syshist = document.getElementById('syshist');

  // Configure marked once (GFM enabled → tables, fenced code, autolinks).
  const hasMarked = (typeof window.marked !== 'undefined');
  if (hasMarked) {
    try {
      marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
    } catch (_) {}
  }
  function renderMarkdown(src) {
    if (hasMarked) {
      try { return marked.parse(String(src || '')); } catch (_) {}
    }
    // Fallback: HTML-escape + newline-to-<br>.
    const esc = String(src || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
    return esc.replace(/\n/g, '<br>');
  }

  const MAX_CONTENT = 3;   // last 3 conversation messages on screen
  const MAX_HIST = 5;      // last 5 status events shown in the footer history
  const content = [];      // user / agent / error
  const statuses = [];     // status events { status, ts }

  function fmtTs(iso) {
    try { return new Date(iso).toLocaleTimeString(); } catch { return ''; }
  }

  function renderStack() {
    stack.innerHTML = '';
    const view = content.slice(-MAX_CONTENT);
    view.forEach((m, i) => {
      const div = document.createElement('div');
      const cls = m.type === 'user' ? 'user' : (m.type === 'error' ? 'error' : 'agent');
      div.className = 'msg ' + cls + (i === view.length - 1 ? ' newest' : '');

      // Header: role badge + timestamp on a single row.
      const head = document.createElement('div');
      head.className = 'msg-head';

      const role = document.createElement('span');
      role.className = 'role';
      const dot = document.createElement('span'); dot.className = 'dot';
      role.appendChild(dot);
      let label = m.type === 'user' ? 'You' : (m.type === 'error' ? 'Error' : 'Agent');
      if (m.type === 'user' && m.image_path) label = '📷  ' + label;
      role.appendChild(document.createTextNode(label));

      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = fmtTs(m.ts);

      head.appendChild(role);
      head.appendChild(ts);

      const txt = document.createElement('div');
      txt.className = 'text';
      // Markdown for agent + user (so user-typed *emphasis* etc renders too);
      // errors stay plain text since they're usually short and may contain
      // characters that look like markdown but aren't.
      if (m.type === 'error') {
        txt.textContent = m.text || '';
      } else {
        txt.innerHTML = renderMarkdown(m.text);
      }

      div.appendChild(head);
      div.appendChild(txt);
      stack.appendChild(div);
    });
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // Map common status strings to colour classes.
  function statusClass(s) {
    s = String(s || '').toLowerCase();
    if (s.includes('think') || s.includes('busy') || s.includes('working')) return 'busy';
    if (s.includes('error') || s.includes('fail')) return 'err';
    if (s.includes('ready') || s.includes('done') || s.includes('idle')) return 'idle';
    if (s.includes('connect') || s.includes('subscribe')) return 'idle';
    return 'idle';
  }

  // Toggle the prominent "thinking" look on both the sysbar and the body
  // (the latter so body padding-bottom grows to keep the last message
  // visible above the enlarged bar).
  const sysbar = document.getElementById('sysbar');
  function setThinking(on) {
    sysbar.classList.toggle('thinking', !!on);
    document.body.classList.toggle('thinking', !!on);
  }

  function renderStatus() {
    const latest = statuses[statuses.length - 1];
    if (!latest) {
      sysnow.textContent = '—';
      sysnow.className = 'now idle';
      syshist.innerHTML = '';
      setThinking(false);
      return;
    }
    const cls = statusClass(latest.status);
    // While thinking, drop the noisy timestamp — just the verb, big.
    sysnow.textContent = (cls === 'busy')
      ? latest.status
      : (latest.status + '  ·  ' + fmtTs(latest.ts));
    sysnow.className = 'now ' + cls;
    setThinking(cls === 'busy');
    // History: prior statuses, oldest first, dimmed.
    const prior = statuses.slice(-MAX_HIST - 1, -1);
    syshist.innerHTML = '';
    prior.forEach(s => {
      const span = document.createElement('span');
      span.textContent = s.status;
      syshist.appendChild(span);
    });
  }

  // True once the WS has finished its backfill (signalled by the bridge's
  // ``status:"subscribed"`` event). TTS is suppressed before this so a page
  // reload doesn't re-speak old replies.
  let liveMode = false;

  function push(m) {
    if (!m || !m.type) return;
    if (m.type === 'user' || m.type === 'agent' || m.type === 'error') {
      content.push(m);
      if (content.length > 30) content.shift();
      renderStack();
      // An agent reply (or an error) means thinking is over — shrink the
      // bar back to the compact look right away, don't wait for the next
      // status tick which may lag a second or two.
      if (m.type === 'agent' || m.type === 'error') {
        statuses.push({ status: 'ready', ts: m.ts || new Date().toISOString() });
        if (statuses.length > 50) statuses.shift();
        renderStatus();
      }
      // Speak the agent's reply once we're past the backfill window.
      if (liveMode && m.type === 'agent' && m.text) {
        try { tts.speak(m.text); } catch (_) {}
      }
    } else if (m.type === 'status') {
      const s = String(m.status || '');
      if (s === 'subscribed') liveMode = true;
      // Skip noisy duplicates (same status text back-to-back).
      const last = statuses[statuses.length - 1];
      if (!s) return;
      if (last && last.status === s) {
        last.ts = m.ts || last.ts;
      } else {
        statuses.push({ status: s, ts: m.ts || new Date().toISOString() });
        if (statuses.length > 50) statuses.shift();
      }
      renderStatus();
    }
  }

  // ── TTS via Soniox. Two paths:
  //      stream   — WS /glasses/tts-stream, PCM s16le @ 24 kHz, Web Audio
  //                 scheduler. First-audio latency is ~150–300 ms; the rest
  //                 of the clip arrives while the start is already playing.
  //      oneshot  — POST /glasses/tts, full MP3 → <audio>. Simpler but
  //                 has to wait for the whole file before any sound.
  //      Default is stream. The toggle is remembered in localStorage.
  const tts = (() => {
    const toggleBtn = document.getElementById('tts-toggle');
    const modeBtn = document.getElementById('tts-mode');
    const langSel = document.getElementById('tts-lang');
    const voiceSel = document.getElementById('tts-voice');
    const engineLabel = document.getElementById('tts-engine');
    const gestureNotice = document.getElementById('gesture-notice');
    // Voice starts OFF — the user must explicitly enable it by tapping 🔊.
    // This avoids two problems at once: no Soniox calls happen unless the
    // user wanted them, and the first audio play coincides with a real
    // user gesture so autoplay policy never blocks.
    let muted = true;
    let sonioxAvailable = true;         // false on 503 from /glasses/tts*
    let currentAudio = null;             // active <Audio> (one-shot path)
    let currentStream = null;            // active stream context (stream path)
    let queue = Promise.resolve();       // sequential play queue
    let gestureGranted = false;          // flipped on first user interaction

    const MODE_KEY = 'glasses.tts.mode';
    const LANG_KEY = 'glasses.tts.lang';
    const VOICE_KEY = 'glasses.tts.voice';
    let mode = (() => {
      try { return localStorage.getItem(MODE_KEY) || 'stream'; }
      catch (_) { return 'stream'; }
    })();
    let lang = (() => {
      try { return localStorage.getItem(LANG_KEY) || 'en'; }
      catch (_) { return 'en'; }
    })();
    let voice = (() => {
      try { return localStorage.getItem(VOICE_KEY) || 'Adrian'; }
      catch (_) { return 'Adrian'; }
    })();

    // 60+ Soniox TTS languages (tts-rt-v1). Sorted by display name.
    const LANGS = [
      ['af','Afrikaans'], ['sq','Albanian'], ['ar','Arabic'], ['az','Azerbaijani'],
      ['eu','Basque'], ['be','Belarusian'], ['bn','Bengali'], ['bs','Bosnian'],
      ['bg','Bulgarian'], ['ca','Catalan'], ['zh','Chinese'], ['hr','Croatian'],
      ['cs','Czech'], ['da','Danish'], ['nl','Dutch'], ['en','English'],
      ['et','Estonian'], ['fi','Finnish'], ['fr','French'], ['gl','Galician'],
      ['de','German'], ['el','Greek'], ['gu','Gujarati'], ['he','Hebrew'],
      ['hi','Hindi'], ['hu','Hungarian'], ['id','Indonesian'], ['it','Italian'],
      ['ja','Japanese'], ['kn','Kannada'], ['kk','Kazakh'], ['ko','Korean'],
      ['lv','Latvian'], ['lt','Lithuanian'], ['mk','Macedonian'], ['ms','Malay'],
      ['ml','Malayalam'], ['mr','Marathi'], ['no','Norwegian'], ['fa','Persian'],
      ['pl','Polish'], ['pt','Portuguese'], ['pa','Punjabi'], ['ro','Romanian'],
      ['ru','Russian'], ['sr','Serbian'], ['sk','Slovak'], ['sl','Slovenian'],
      ['es','Spanish'], ['sw','Swahili'], ['sv','Swedish'], ['tl','Tagalog'],
      ['ta','Tamil'], ['te','Telugu'], ['th','Thai'], ['tr','Turkish'],
      ['uk','Ukrainian'], ['ur','Urdu'], ['vi','Vietnamese'], ['cy','Welsh'],
    ];
    LANGS.sort((a, b) => a[1].localeCompare(b[1]));
    for (const [code, name] of LANGS) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name + ' (' + code + ')';
      langSel.appendChild(opt);
    }
    if (!LANGS.find(l => l[0] === lang)) lang = 'en';
    langSel.value = lang;

    // 28 Soniox voices (all multilingual). Grouped by accent for browsing.
    const VOICES = [
      ['Neutral', ['Maya','Daniel','Noah','Nina','Emma','Jack','Adrian','Claire','Grace','Owen','Mina','Kenji']],
      ['British', ['Oliver','Arthur','Isla','Victoria']],
      ['American/Spanish', ['Rafael','Mateo','Lucia','Sofia']],
      ['Australian', ['Cooper','Mason','Ruby','Elise']],
      ['Indian', ['Arjun','Rohan','Priya','Meera']],
    ];
    const VOICE_FLAT = VOICES.flatMap(g => g[1]);
    for (const [group, names] of VOICES) {
      const og = document.createElement('optgroup');
      og.label = group;
      for (const n of names) {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        og.appendChild(opt);
      }
      voiceSel.appendChild(og);
    }
    if (!VOICE_FLAT.includes(voice)) voice = 'Adrian';
    voiceSel.value = voice;

    function setEngineLabel(s) { engineLabel.textContent = s || ''; }
    function applyModeUi() {
      modeBtn.textContent = mode === 'stream' ? '📡' : '📦';
      modeBtn.title = mode === 'stream' ? 'streaming (tap for one-shot)' : 'one-shot (tap for streaming)';
    }
    function applyMutedUi() {
      toggleBtn.textContent = muted ? '🔇' : '🔊';
      toggleBtn.classList.toggle('muted', muted);
      toggleBtn.title = muted ? 'voice is off — tap to enable' : 'voice is on — tap to mute';
    }
    setEngineLabel(muted ? 'off' : 'soniox');
    applyModeUi();
    applyMutedUi();

    function stopAll() {
      if (currentAudio) {
        try { currentAudio.pause(); currentAudio.removeAttribute('src'); currentAudio.load(); } catch (_) {}
        currentAudio = null;
      }
      if (currentStream) {
        try { currentStream.cancel(); } catch (_) {}
        currentStream = null;
      }
    }

    function dismissGestureNotice() {
      if (gestureGranted) return;
      gestureGranted = true;
      gestureNotice.classList.add('hidden');
      // Hide for real after the fade so it can't be tabbed/clicked.
      setTimeout(() => { gestureNotice.style.display = 'none'; }, 400);
    }
    // Any direct tap on the notice itself also counts as a gesture and
    // unlocks audio — handy on glasses where pointing at controls is hard.
    gestureNotice.addEventListener('click', () => {
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      dismissGestureNotice();
    });

    toggleBtn.addEventListener('click', () => {
      muted = !muted;
      applyMutedUi();
      setEngineLabel(muted ? 'off' : (sonioxAvailable ? 'soniox' : 'off'));
      if (muted) stopAll();
      // Tapping the button counts as a user gesture — wake any suspended
      // AudioContext so the next reply can play.
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      // Only dismiss the "enable voice" notice when audio is actually on.
      if (!muted) dismissGestureNotice();
    });

    modeBtn.addEventListener('click', () => {
      mode = (mode === 'stream') ? 'oneshot' : 'stream';
      try { localStorage.setItem(MODE_KEY, mode); } catch (_) {}
      applyModeUi();
      // Cancel anything in flight so the next message uses the new path.
      stopAll();
      // Counts as a gesture — useful when the user later unmutes.
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
      // Don't dismiss the gesture notice: this button doesn't enable audio.
    });

    langSel.addEventListener('change', () => {
      lang = langSel.value || 'en';
      try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
      stopAll();
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
    });

    voiceSel.addEventListener('change', () => {
      voice = voiceSel.value || 'Adrian';
      try { localStorage.setItem(VOICE_KEY, voice); } catch (_) {}
      stopAll();
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
    });

    // Convert markdown/HTML to clean speakable text.
    function plainify(src) {
      // Strip fenced code blocks (they don't speak well).
      let s = String(src || '').replace(/```[\s\S]*?```/g, ' code block ');
      // Strip inline code backticks.
      s = s.replace(/`([^`]+)`/g, '$1');
      // Drop markdown emphasis markers + headings + list bullets + links.
      s = s.replace(/\*\*([^*]+)\*\*/g, '$1')
           .replace(/\*([^*]+)\*/g, '$1')
           .replace(/^#{1,6}\s+/gm, '')
           .replace(/^[\s]*[-*+]\s+/gm, '')
           .replace(/^[\s]*\d+\.\s+/gm, '')
           .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
           // Tables: keep cell contents, drop pipes/divider rows.
           .replace(/^\s*\|?\s*[:\-\s|]+\s*\|?\s*$/gm, '')
           .replace(/\|/g, ', ');
      // Collapse whitespace.
      s = s.replace(/\s+/g, ' ').trim();
      // Trim insanely long replies — TTS bill / latency guard.
      if (s.length > 600) s = s.slice(0, 600).replace(/[^.!?]*$/, '') || s.slice(0, 600);
      return s;
    }

    // Surface TTS failures via the status footer so we can see them on the
    // glasses without DevTools. Distinguish permanent (turn off + stop
    // trying) from transient (retry next reply).
    function ttsStatusEvent(text) {
      push({ type: 'status', status: 'tts:' + text, ts: new Date().toISOString() });
    }
    function ttsFail(reason, permanent) {
      if (permanent) {
        sonioxAvailable = false;
        setEngineLabel('off:' + reason);
      } else {
        setEngineLabel('err:' + reason);
      }
      ttsStatusEvent((permanent ? 'off ' : 'err ') + reason);
    }

    async function playSoniox(text) {
      let resp;
      try {
        resp = await fetch('/glasses/tts' + (t ? '?t=' + encodeURIComponent(t) : ''), {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, language: lang, voice }),
        });
      } catch (e) {
        // Network/CORS/FD-down. Retryable.
        ttsFail('net', false);
        return;
      }
      if (resp.status === 503 || resp.status === 401 || resp.status === 403) {
        // Server config / auth issue — won't fix itself mid-session.
        ttsFail(String(resp.status), true);
        return;
      }
      if (!resp.ok) {
        // Other non-200: log and try again next reply.
        ttsFail(String(resp.status), false);
        return;
      }
      // Success on the HTTP side — clear any prior 'err:' label.
      setEngineLabel('soniox');
      const blob = await resp.blob();
      if (!blob || blob.size === 0) { ttsFail('empty', false); return; }
      // Surface the MIME the server sent — handy when debugging "no sound
      // but no error" (usually codec mismatch).
      const contentType = resp.headers.get('content-type') || '';
      const url = URL.createObjectURL(blob);
      await new Promise((resolve) => {
        const a = new Audio();
        // Set type via the source element so the browser doesn't have to
        // sniff — avoids decoder picking the wrong path on some webviews.
        if (contentType) a.type = contentType;
        a.src = url;
        currentAudio = a;
        let done = false;
        const finish = (errCode) => {
          if (done) return;
          done = true;
          // Detach the element from the blob URL BEFORE revoking, so any
          // in-flight fetch is cancelled cleanly instead of logging
          // ERR_FILE_NOT_FOUND. The revoke is deferred to the next tick
          // so the pause/load can settle.
          try { a.pause(); a.removeAttribute('src'); a.load(); } catch (_) {}
          setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 0);
          if (currentAudio === a) currentAudio = null;
          if (errCode) ttsFail(errCode, errCode === '503' || errCode === '401' || errCode === '403');
          resolve();
        };
        a.onended = () => { dismissGestureNotice(); finish(null); };
        a.onerror = () => {
          // a.error.code: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED
          const codes = { 1: 'abort', 2: 'net', 3: 'decode', 4: 'codec' };
          const c = (a.error && codes[a.error.code]) || 'audio';
          finish(c);
        };
        a.play().catch((err) => {
          const name = (err && err.name) || 'play';
          finish(name === 'NotAllowedError' ? 'gesture' : 'play');
        });
      });
    }

    // ── Streaming path: WS + Web Audio scheduler ─────────────────────
    // Lazy-create the AudioContext on first use so it can inherit a user
    // gesture (mute/mode-toggle clicks above resume() it if suspended).
    let audioCtx = null;
    function getCtx(sampleRate) {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC({ sampleRate }); }
      catch (_) { audioCtx = new AC(); }
      return audioCtx;
    }

    async function playSonioxStream(text) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) {
        ttsFail('noaudioctx', false);
        return playSoniox(text);  // graceful fallback to one-shot
      }

      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = scheme + '://' + location.host + '/glasses/tts-stream'
                + (t ? '?t=' + encodeURIComponent(t) : '');

      return new Promise((resolve) => {
        let ws;
        try { ws = new WebSocket(url); }
        catch (_) { ttsFail('wsopen', false); return resolve(); }
        ws.binaryType = 'arraybuffer';

        let ctx = null;
        let nextStart = 0;
        let scheduled = 0;
        let finished = 0;
        let streamEnded = false;
        let settled = false;
        const sources = [];
        let cancelled = false;

        const settle = () => {
          if (settled) return;
          settled = true;
          if (currentStream === api) currentStream = null;
          resolve();
        };
        const tryFinalize = () => {
          if (streamEnded && finished >= scheduled) settle();
        };
        const api = {
          cancel() {
            cancelled = true;
            streamEnded = true;
            try { ws.close(); } catch (_) {}
            for (const s of sources) { try { s.stop(); } catch (_) {} }
            settle();
          },
        };
        currentStream = api;

        ws.onopen = () => {
          ws.send(JSON.stringify({ text, language: lang, voice }));
        };
        ws.onmessage = (ev) => {
          if (cancelled) return;
          if (typeof ev.data === 'string') {
            let m; try { m = JSON.parse(ev.data); } catch { return; }
            if (m.type === 'info') {
              ctx = getCtx(m.sample_rate || 24000);
              if (!ctx) { ttsFail('ctx', false); try { ws.close(); } catch (_) {} return settle(); }
              if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
              nextStart = ctx.currentTime;
              setEngineLabel('soniox');
            } else if (m.type === 'error') {
              const code = String(m.code || '');
              const perm = (code === '503' || code === '401' || code === '403');
              ttsFail(code || 'stream', perm);
              try { ws.close(); } catch (_) {}
              streamEnded = true;
              tryFinalize();
            } else if (m.type === 'end') {
              streamEnded = true;
              tryFinalize();
            }
            return;
          }
          // Binary PCM s16le mono.
          if (!ctx) return;            // shouldn't happen — info comes first
          const int16 = new Int16Array(ev.data);
          if (int16.length === 0) return;
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
          const buf = ctx.createBuffer(1, float32.length, ctx.sampleRate);
          buf.copyToChannel(float32, 0);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          // Tiny safety margin so back-to-back chunks don't clip on slow
          // schedulers; effectively zero for our use.
          const startAt = Math.max(ctx.currentTime + 0.01, nextStart);
          src.start(startAt);
          nextStart = startAt + buf.duration;
          scheduled++;
          sources.push(src);
          src.onended = () => {
            finished++;
            // Real audio actually came out — gesture must have been granted.
            if (finished === 1) dismissGestureNotice();
            tryFinalize();
          };
        };
        ws.onerror = () => {
          if (cancelled) return;
          // Don't flip the engine off — could be a transient hiccup.
          ttsFail('wserr', false);
        };
        ws.onclose = () => {
          streamEnded = true;
          // If we got 0 chunks (e.g. error during setup), fall back to
          // one-shot for THIS reply so it isn't silent. The 'err:' label
          // is already set; soniox availability stays true.
          if (!cancelled && scheduled === 0) {
            settle();
            playSoniox(text);
            return;
          }
          tryFinalize();
        };
      });
    }

    async function speakOne(rawText) {
      if (muted || !sonioxAvailable) return;
      const text = plainify(rawText);
      if (!text) return;
      if (mode === 'stream') {
        await playSonioxStream(text);
      } else {
        await playSoniox(text);
      }
    }

    function speak(text) {
      // Hard short-circuit BEFORE the queue: if voice is off (or Soniox is
      // unavailable), never schedule a Soniox call at all. This guarantees
      // zero network traffic to /glasses/tts* while muted, even if multiple
      // agent replies pile up while the user is deciding to enable voice.
      if (muted || !sonioxAvailable) return;
      // Queue so replies play in order, never overlapping.
      queue = queue.then(() => speakOne(text)).catch(() => {});
    }

    return { speak };
  })();

  let ws = null;
  function openWs() {
    if (!channel) { conn.textContent = 'no channel'; return; }
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = scheme + '://' + location.host + '/glasses/ws?c=' + encodeURIComponent(channel) + '&role=glasses' + qs;
    ws = new WebSocket(url);
    // Reset liveMode on every (re)connect; bridge will set it back to true
    // when its "subscribed" status arrives after the backfill batch.
    liveMode = false;
    ws.onopen = () => { conn.textContent = 'live'; conn.classList.remove('off'); };
    ws.onclose = () => {
      conn.textContent = 'reconnecting'; conn.classList.add('off');
      liveMode = false;
      setTimeout(openWs, 1500);
    };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      push(m);
    };
  }

  openWs();
})();
</script>
</body>
</html>
