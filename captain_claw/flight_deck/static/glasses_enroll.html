<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasses · enroll face</title>
<style>
  /* Shares the palette/tokens of glasses_settings.html so it visibly belongs
     to the same family. Cyan = mobile-bridge accent, mono = HUD echo. */
  :root {
    color-scheme: dark;
    --bg:        #07090d;
    --bg-grad:   radial-gradient(900px 500px at 50% -180px, #131a26, #07090d 70%);
    --surface:   #0f141b;
    --surface-2: #141a23;
    --line:      #1c2532;
    --line-hi:   #2a3548;
    --text:      #e8edf6;
    --text-dim:  #8693ad;
    --text-mut:  #5b667c;
    --accent:    #5fe3ff;
    --accent-dk: #18465a;
    --hud:       #5fff9f;
    --warn:      #ffd877;
    --err:       #ff7a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 Roboto, sans-serif;
    font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: var(--bg-grad);
    min-height: 100vh;
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 72px) 14px;
    max-width: 760px; margin: 0 auto;
  }

  .hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 4px 16px; flex-wrap: wrap;
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); text-decoration: none;
    font-size: 14px; font-weight: 600;
  }
  .back .arrow { color: var(--accent); }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }

  .section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset,
                0 8px 24px rgba(0,0,0,0.22);
  }
  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-mut);
    margin: 0 0 12px;
  }

  label.field {
    display: block; margin-bottom: 12px;
  }
  label.field .lbl {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-mut);
    margin-bottom: 6px;
  }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: 15px -apple-system, sans-serif;
    outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  /* Live camera preview + capture */
  .camera-wrap {
    position: relative;
    background: #000; border-radius: 12px; overflow: hidden;
    aspect-ratio: 3 / 4;
    border: 1px solid var(--line);
  }
  video, canvas.preview {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  canvas.hidden { display: none; }

  .cam-row {
    display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;
  }
  button.btn {
    flex: 1 1 auto; min-width: 120px;
    padding: 12px 14px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    font: 600 14px -apple-system, sans-serif;
    cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary {
    background: var(--accent); color: #001823; border-color: var(--accent);
  }
  button.btn.primary:disabled {
    background: var(--surface-2); color: var(--text-mut);
    border-color: var(--line); cursor: not-allowed;
  }
  button.btn.danger { color: var(--err); border-color: #4a2630; }

  .shots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .shot {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line);
    background: #000;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot button.x {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: var(--err);
    border: 1px solid var(--err); cursor: pointer;
    font: 700 12px ui-monospace, Menlo, monospace;
    display: grid; place-items: center; padding: 0;
  }
  .counter {
    font: 11px ui-monospace, Menlo, monospace;
    color: var(--text-mut);
    margin-top: 8px;
  }
  .counter b { color: var(--accent); }

  .status {
    margin-top: 12px; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px;
    font: 13px ui-monospace, Menlo, monospace;
    color: var(--text-dim);
    min-height: 38px;
    white-space: pre-wrap;
  }
  .status.ok { color: var(--hud); border-color: #1a3a25; }
  .status.err { color: var(--err); border-color: #4a2630; }

  .roster {
    margin-top: 12px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .roster-row {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .roster-row:last-child { border-bottom: none; }
  .roster-head {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .roster-head .name { flex: 1; font-weight: 600; }
  .roster-head .meta {
    font: 11px ui-monospace, Menlo, monospace;
    color: var(--text-mut);
  }
  .roster-head .chev {
    color: var(--text-mut); transition: transform .15s; font-size: 12px;
  }
  .roster-row.expanded .roster-head .chev { transform: rotate(90deg); }
  .roster-row .detail {
    display: none;
    padding: 10px 0 4px;
    border-top: 1px dashed var(--line);
    margin-top: 8px;
  }
  .roster-row.expanded .detail { display: block; }
  .roster-row .detail textarea {
    margin-bottom: 8px;
  }
  .roster-row .detail-row {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .roster-row .view-link {
    font: 12px ui-monospace, Menlo, monospace;
    color: var(--accent); text-decoration: none;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  .roster-row .view-link:hover { border-color: var(--accent); background: var(--surface-2); }
  .roster-row button.save {
    background: var(--accent); color: #001823; border: 1px solid var(--accent);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px;
    font-weight: 600;
  }
  .roster-row button.save:disabled { opacity: 0.5; cursor: default; }
  .roster-row button.del {
    background: transparent; border: 1px solid var(--line);
    color: var(--text-mut); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 12px;
    margin-left: auto;
  }
  .roster-row button.del:hover { color: var(--err); border-color: var(--err); }
  .row-status {
    font: 11px ui-monospace, Menlo, monospace;
    color: var(--text-mut);
  }
  .row-status.ok { color: var(--hud); }
  .row-status.err { color: var(--err); }

</style>
</head>
<body>
  <div class="hdr">
    <a class="back" href="/glasses/mobile" id="back-link">
      <span class="arrow">←</span> Bridge
    </a>
    <h1>Enroll face</h1>
  </div>

  <div class="section">
    <div class="section-title">Subject</div>
    <label class="field">
      <div class="lbl">Name</div>
      <input id="name" type="text" autocomplete="off" placeholder="e.g. Ana">
    </label>
    <label class="field">
      <div class="lbl">Notes <span style="font-weight:400;color:var(--text-mut);text-transform:none;letter-spacing:0">(optional · shown on HUD)</span></div>
      <textarea id="notes" placeholder="e.g. cousin, met at Lisbon conference"></textarea>
    </label>
  </div>

  <div class="section">
    <div class="section-title">Capture · 3–5 photos</div>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="cam-row">
      <button id="capture-btn" class="btn primary">📸 Capture</button>
      <button id="flip-btn" class="btn" type="button">Flip camera</button>
    </div>
    <div class="shots" id="shots"></div>
    <div class="counter">Captured <b id="count">0</b> / 5 recommended</div>
    <canvas id="canvas" class="hidden"></canvas>
  </div>

  <div class="section">
    <div class="section-title">Submit</div>
    <div class="cam-row">
      <button id="submit-btn" class="btn primary" disabled>Save person</button>
    </div>
    <div id="status" class="status">Ready.</div>
  </div>

  <div class="section">
    <div class="section-title">Roster</div>
    <div id="roster"><div class="status">Loading…</div></div>
  </div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const nameEl = $('name');
  const notesEl = $('notes');
  const videoEl = $('video');
  const canvasEl = $('canvas');
  const shotsEl = $('shots');
  const countEl = $('count');
  const captureBtn = $('capture-btn');
  const flipBtn = $('flip-btn');
  const submitBtn = $('submit-btn');
  const statusEl = $('status');
  const rosterEl = $('roster');

  // Preserve any channel query param so the back link returns to the same session.
  try {
    const q = new URLSearchParams(location.search);
    const c = q.get('c');
    if (c) $('back-link').href = '/glasses/mobile?c=' + encodeURIComponent(c);
  } catch (_) {}

  // ── Camera ──
  let stream = null;
  let facing = 'environment'; // rear-facing for capturing other people

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false,
      });
      videoEl.srcObject = stream;
      setStatus('Camera ready. Capture 3–5 varied angles.', '');
    } catch (e) {
      setStatus('Camera error: ' + (e && e.message ? e.message : e), 'err');
    }
  }

  flipBtn.addEventListener('click', () => {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCamera();
  });

  // ── Capture ──
  const shots = []; // {blob, url}

  function refreshCount() {
    countEl.textContent = String(shots.length);
    submitBtn.disabled = !(shots.length >= 1 && nameEl.value.trim().length > 0);
  }
  nameEl.addEventListener('input', refreshCount);

  function renderShots() {
    shotsEl.innerHTML = '';
    shots.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'shot';
      const img = document.createElement('img');
      img.src = s.url;
      const x = document.createElement('button');
      x.className = 'x'; x.type = 'button'; x.textContent = '×';
      x.title = 'Remove this photo';
      x.addEventListener('click', () => {
        URL.revokeObjectURL(s.url);
        shots.splice(i, 1);
        renderShots();
        refreshCount();
      });
      div.appendChild(img);
      div.appendChild(x);
      shotsEl.appendChild(div);
    });
  }

  captureBtn.addEventListener('click', async () => {
    if (!stream) { setStatus('Camera not ready.', 'err'); return; }
    const track = stream.getVideoTracks()[0];
    if (!track) { setStatus('No video track.', 'err'); return; }
    const w = videoEl.videoWidth || 1280;
    const h = videoEl.videoHeight || 960;
    canvasEl.width = w; canvasEl.height = h;
    const ctx = canvasEl.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, w, h);
    const blob = await new Promise(res => canvasEl.toBlob(res, 'image/jpeg', 0.9));
    if (!blob) { setStatus('Capture failed.', 'err'); return; }
    const url = URL.createObjectURL(blob);
    shots.push({ blob, url });
    renderShots();
    refreshCount();
  });

  // ── Submit ──
  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  submitBtn.addEventListener('click', async () => {
    const name = nameEl.value.trim();
    if (!name) { setStatus('Name required.', 'err'); return; }
    if (shots.length === 0) { setStatus('Capture at least one photo.', 'err'); return; }

    submitBtn.disabled = true;
    setStatus('Uploading ' + shots.length + ' photo(s)…', '');

    const fd = new FormData();
    fd.append('name', name);
    fd.append('notes', notesEl.value || '');
    shots.forEach((s, i) => fd.append('files', s.blob, 'photo_' + i + '.jpg'));

    try {
      const r = await fetch('/face/enroll', { method: 'POST', body: fd });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        setStatus('Enroll failed: ' + (data.detail || r.statusText), 'err');
        submitBtn.disabled = false;
        return;
      }
      setStatus(
        'Enrolled ' + data.name + ' (' + data.embeddings_added + ' / ' +
        data.submitted + ' faces detected).',
        'ok'
      );
      // Reset for next person.
      shots.splice(0).forEach(s => URL.revokeObjectURL(s.url));
      renderShots();
      nameEl.value = '';
      notesEl.value = '';
      refreshCount();
      loadRoster();
    } catch (e) {
      setStatus('Network error: ' + (e && e.message ? e.message : e), 'err');
      submitBtn.disabled = false;
    }
  });

  // ── Roster ──
  function renderRosterRow(p) {
    const row = document.createElement('div');
    row.className = 'roster-row';
    row.innerHTML =
      '<div class="roster-head">' +
        '<span class="chev">▸</span>' +
        '<div class="name"></div>' +
        '<div class="meta"></div>' +
      '</div>' +
      '<div class="detail">' +
        '<textarea class="notes-edit" rows="2" placeholder="Notes (shown on HUD)"></textarea>' +
        '<div class="detail-row">' +
          '<button class="save" type="button">Save notes</button>' +
          '<a class="view-link" href="#">Encounters ↗</a>' +
          '<span class="row-status"></span>' +
          '<button class="del" type="button">delete</button>' +
        '</div>' +
      '</div>';
    row.querySelector('.name').textContent = p.name;
    row.querySelector('.meta').textContent =
      (p.samples || 0) + ' samples · ' + (p.encounters || 0) + ' seen';
    const notesEdit = row.querySelector('.notes-edit');
    notesEdit.value = p.notes || '';
    const viewLink = row.querySelector('.view-link');
    viewLink.href = '/glasses/persons/' + encodeURIComponent(p.id);
    const statusEl = row.querySelector('.row-status');
    const saveBtn = row.querySelector('.save');
    const delBtn = row.querySelector('.del');

    row.querySelector('.roster-head').addEventListener('click', () => {
      row.classList.toggle('expanded');
    });

    saveBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      saveBtn.disabled = true;
      statusEl.className = 'row-status';
      statusEl.textContent = 'saving…';
      try {
        const r = await fetch('/face/persons/' + encodeURIComponent(p.id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: notesEdit.value }),
        });
        if (r.ok) {
          p.notes = notesEdit.value;
          statusEl.className = 'row-status ok';
          statusEl.textContent = 'saved';
          setTimeout(() => { statusEl.textContent = ''; }, 1500);
        } else {
          statusEl.className = 'row-status err';
          statusEl.textContent = 'save failed';
        }
      } catch (err) {
        statusEl.className = 'row-status err';
        statusEl.textContent = 'network error';
      } finally {
        saveBtn.disabled = false;
      }
    });

    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete ' + p.name + '?')) return;
      const dr = await fetch('/face/persons/' + encodeURIComponent(p.id), {
        method: 'DELETE',
      });
      if (dr.ok) loadRoster();
      else setStatus('Delete failed.', 'err');
    });

    rosterEl.appendChild(row);
  }

  async function loadRoster() {
    try {
      const r = await fetch('/face/persons');
      if (!r.ok) {
        rosterEl.innerHTML = '<div class="status err">Failed to load roster.</div>';
        return;
      }
      const rows = await r.json();
      if (!rows.length) {
        rosterEl.innerHTML = '<div class="status">No people enrolled yet.</div>';
        return;
      }
      rosterEl.innerHTML = '';
      rows.forEach(p => renderRosterRow(p));
    } catch (e) {
      rosterEl.innerHTML = '<div class="status err">Roster error.</div>';
    }
  }

  // ── Warmup + go ──
  // Fire-and-forget warmup so first enroll/recognize doesn't pay the model
  // download/load cost in the user's hand.
  fetch('/face/warmup', { method: 'POST' }).catch(() => {});
  startCamera();
  loadRoster();
})();
</script>
</body>
</html>
