<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasses settings</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #000; color: #eaffea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 18px; line-height: 1.35; }
  body { padding: 12px 14px 80px 14px; }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; color: #6a8;
    margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
  }
  header a { color: #9bf; text-decoration: none; font-weight: 600; }
  h2 {
    margin: 14px 0 6px;
    font-size: 16px; color: #9fb8ff; font-weight: 700;
    letter-spacing: 0.5px;
  }
  .group-label {
    margin: 10px 0 4px;
    font-size: 12px; color: #6a8;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .grid.voice {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  }
  .pick {
    background: #11161d; color: #cfe;
    border: 1px solid #2a3140; border-radius: 8px;
    padding: 12px 10px;
    font: 600 15px ui-monospace, Menlo, monospace;
    text-align: center;
    min-height: 48px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s, border-color .12s;
  }
  .pick:active { background: #1a2230; }
  .pick.selected {
    background: #0d2a14; color: #d8ffd8;
    border-color: #4fc;
    box-shadow: 0 0 0 2px rgba(79,255,191,0.25) inset;
  }
  .pick small { display: block; color: #7a8c7a; font-size: 11px; margin-top: 2px; }
  .saved {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #0d2a14; color: #d8ffd8;
    border: 1px solid #4fc; border-radius: 999px;
    padding: 8px 18px; font-weight: 600; font-size: 14px;
    opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .saved.show { opacity: 1; }
  .now { color: #ffeb6b; font-weight: 700; }
</style>
</head>
<body>
<header>
  <a id="back" href="#">← back to glasses</a>
  <span>lang <span class="now" id="now-lang">…</span> · voice <span class="now" id="now-voice">…</span></span>
</header>

<h2>Voice language</h2>
<div class="grid" id="lang-grid"></div>

<h2>Voice</h2>
<div id="voice-groups"></div>

<div class="saved" id="saved">saved</div>

<script>
(() => {
  const LANG_KEY = 'glasses.tts.lang';
  const VOICE_KEY = 'glasses.tts.voice';

  const params = new URLSearchParams(location.search);
  const channel = params.get('c') || '';
  const t = params.get('t') || '';
  const backUrl = '/glasses/view'
    + (channel ? '?c=' + encodeURIComponent(channel) : '')
    + (t ? (channel ? '&' : '?') + 't=' + encodeURIComponent(t) : '');
  document.getElementById('back').href = backUrl;

  // ── Data ─────────────────────────────────────────────────────────
  const LANGS = [
    ['af','Afrikaans'], ['sq','Albanian'], ['ar','Arabic'], ['az','Azerbaijani'],
    ['eu','Basque'], ['be','Belarusian'], ['bn','Bengali'], ['bs','Bosnian'],
    ['bg','Bulgarian'], ['ca','Catalan'], ['zh','Chinese'], ['hr','Croatian'],
    ['cs','Czech'], ['da','Danish'], ['nl','Dutch'], ['en','English'],
    ['et','Estonian'], ['fi','Finnish'], ['fr','French'], ['gl','Galician'],
    ['de','German'], ['el','Greek'], ['gu','Gujarati'], ['he','Hebrew'],
    ['hi','Hindi'], ['hu','Hungarian'], ['id','Indonesian'], ['it','Italian'],
    ['ja','Japanese'], ['kn','Kannada'], ['kk','Kazakh'], ['ko','Korean'],
    ['lv','Latvian'], ['lt','Lithuanian'], ['mk','Macedonian'], ['ms','Malay'],
    ['ml','Malayalam'], ['mr','Marathi'], ['no','Norwegian'], ['fa','Persian'],
    ['pl','Polish'], ['pt','Portuguese'], ['pa','Punjabi'], ['ro','Romanian'],
    ['ru','Russian'], ['sr','Serbian'], ['sk','Slovak'], ['sl','Slovenian'],
    ['es','Spanish'], ['sw','Swahili'], ['sv','Swedish'], ['tl','Tagalog'],
    ['ta','Tamil'], ['te','Telugu'], ['th','Thai'], ['tr','Turkish'],
    ['uk','Ukrainian'], ['ur','Urdu'], ['vi','Vietnamese'], ['cy','Welsh'],
  ];
  LANGS.sort((a, b) => a[1].localeCompare(b[1]));

  const VOICES = [
    ['Neutral', ['Maya','Daniel','Noah','Nina','Emma','Jack','Adrian','Claire','Grace','Owen','Mina','Kenji']],
    ['British', ['Oliver','Arthur','Isla','Victoria']],
    ['American/Spanish', ['Rafael','Mateo','Lucia','Sofia']],
    ['Australian', ['Cooper','Mason','Ruby','Elise']],
    ['Indian', ['Arjun','Rohan','Priya','Meera']],
  ];

  // ── State ────────────────────────────────────────────────────────
  let lang  = (() => { try { return localStorage.getItem(LANG_KEY)  || 'en';     } catch (_) { return 'en'; } })();
  let voice = (() => { try { return localStorage.getItem(VOICE_KEY) || 'Adrian'; } catch (_) { return 'Adrian'; } })();
  if (!LANGS.find(l => l[0] === lang)) lang = 'en';
  if (!VOICES.flatMap(g => g[1]).includes(voice)) voice = 'Adrian';

  const nowLang = document.getElementById('now-lang');
  const nowVoice = document.getElementById('now-voice');
  const saved = document.getElementById('saved');
  let savedTimer = null;

  function refreshNow() {
    const langName = (LANGS.find(l => l[0] === lang) || ['', lang])[1];
    nowLang.textContent = lang + ' (' + langName + ')';
    nowVoice.textContent = voice;
  }
  function flashSaved() {
    saved.classList.add('show');
    if (savedTimer) clearTimeout(savedTimer);
    savedTimer = setTimeout(() => saved.classList.remove('show'), 900);
  }
  function markSelected(container, dataKey, value) {
    for (const btn of container.querySelectorAll('.pick')) {
      btn.classList.toggle('selected', btn.dataset[dataKey] === value);
    }
  }

  // ── Language grid ───────────────────────────────────────────────
  const langGrid = document.getElementById('lang-grid');
  for (const [code, name] of LANGS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.dataset.lang = code;
    b.innerHTML = name + '<small>' + code + '</small>';
    b.addEventListener('click', () => {
      lang = code;
      try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
      markSelected(langGrid, 'lang', lang);
      refreshNow();
      flashSaved();
    });
    langGrid.appendChild(b);
  }
  markSelected(langGrid, 'lang', lang);

  // ── Voice grid (grouped) ────────────────────────────────────────
  const voiceGroups = document.getElementById('voice-groups');
  for (const [groupName, names] of VOICES) {
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = groupName;
    voiceGroups.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'grid voice';
    for (const n of names) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.dataset.voice = n;
      b.textContent = n;
      b.addEventListener('click', () => {
        voice = n;
        try { localStorage.setItem(VOICE_KEY, voice); } catch (_) {}
        // Re-scan all groups, only one button at a time should be selected.
        for (const g of voiceGroups.querySelectorAll('.grid.voice')) {
          markSelected(g, 'voice', voice);
        }
        refreshNow();
        flashSaved();
      });
      grid.appendChild(b);
    }
    voiceGroups.appendChild(grid);
    markSelected(grid, 'voice', voice);
  }

  refreshNow();
})();
</script>
</body>
</html>
