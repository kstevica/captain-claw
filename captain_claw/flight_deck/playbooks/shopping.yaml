category: shopping
playbooks:
  # ── Search and compare prices ─────────────────────────────────────────

  - id: googleshopping.compare_prices
    title: Compare a product's price across shops
    says:
      - Where is the Sony WH-1000XM5 cheapest right now?
      - Compare prices for a Dyson V15 across shops.
      - Who sells the Nintendo Switch 2 for the least?
      - Find the best price on an iPad Air 13-inch.
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com/search]
    inputs:
      query: {label: Product, kind: text, hint: "Brand and model, as exact as the person gave it"}
      condition: {label: Condition, kind: choice, options: [new, any], default: new}
    open: https://www.google.com/search?q={query}&udm=28
    steps:
      - kind: do
        text: Open the product card for the exact model (not a bundle, case or accessory) and its "Compare prices" list.
      - kind: do
        text: If condition is new, leave out used and refurbished offers.
      - kind: do
        text: Rank the offers by price plus shipping.
    read:
      best_price: The lowest total price and the shop offering it
      offers: The next four offers, each with shop, price, shipping and stock
      price_range: Lowest to highest price listed
      rating: The product's star rating and review count
    answer: "Cheapest: {best_price}. Others: {offers}."
    tags: [price-comparison, product-search]

  - id: web.find_cheaper
    title: Find the product on this page cheaper
    says:
      - Can I get this cheaper somewhere else?
      - Is this a good price, or does another shop beat it?
      - Find this cheaper.
      - Does anyone sell this blender for less?
    kind: look
    where: chrome
    region: global
    sites: [google.com/search]
    inputs:
      product: {label: Product, kind: text, default: the product on the tab the person has open, hint: "Exact model name or number, and EAN/GTIN if shown, read off the person's current tab"}
    open: https://www.google.com/search?q={product}&udm=28
    steps:
      - kind: do
        text: The price to beat is on the tab the person started from; note its shop, price, shipping and seller.
      - kind: do
        text: Open the matching product card and its "Compare prices" list; match model, size, colour and condition exactly.
      - kind: do
        text: Open the two cheapest offers and check that price, shipping and stock hold on the shop's own page.
    read:
      current_price: The price, shipping and shop on the page the person started from
      cheaper_offers: Up to three offers that beat it, each with shop, total price and link
      saving: How much the best offer saves, in money and percent
      caveats: Differences that matter, such as marketplace seller, refurbished, import from abroad or slower delivery
    answer: "You're looking at {current_price}. Cheaper: {cheaper_offers} (saves {saving})."
    tags: [price-comparison, find-cheaper]

  - id: amazon.search_best
    title: Best-rated product on Amazon within a budget
    says:
      - What's the best-rated USB-C charger on Amazon under $30?
      - Find me a well-reviewed air fryer on Amazon.
      - Show me the top Amazon picks for running headphones under 100 dollars.
    kind: look
    where: prefer_chrome
    region: global
    sites: [amazon.com]
    inputs:
      query: {label: What to look for, kind: text}
      max_price: {label: Most to spend, kind: number, required: false, ask: agent}
    open: https://www.amazon.com/s?k={query}
    steps:
      - kind: do
        text: If the person shops on another Amazon site (amazon.co.uk, amazon.de, amazon.ca ...), run the same search there.
      - kind: do
        text: If max_price was given, set the price filter in the left column to at most {max_price}.
      - kind: do
        text: Skip "Sponsored" results; keep items rated 4 stars or more with at least a few hundred ratings.
    read:
      picks: The three best matches, each with name, price, star rating and number of ratings
      delivery: Which of them arrive soonest, and the delivery date shown
      deal: Any of them on a limited-time deal or with a coupon to clip
    answer: "Top picks: {picks}."
    tags: [amazon, product-search, reviews]

  - id: ebay.search
    title: Cheapest Buy It Now listing on eBay
    says:
      - Find a used Canon 50mm f/1.8 lens on eBay.
      - What's the cheapest Buy It Now for a PS5 controller on eBay?
      - Look on eBay for the Lego Millennium Falcon set.
    kind: look
    where: prefer_chrome
    region: global
    sites: [ebay.com]
    inputs:
      query: {label: What to look for, kind: text}
      condition: {label: Condition, kind: choice, options: [any, new, used], default: any}
    open: https://www.ebay.com/sch/i.html?_nkw={query}&_sop=15&LH_BIN=1
    steps:
      - kind: do
        text: If the person uses another eBay site (ebay.co.uk, ebay.de, ebay.com.au ...), use it with the same link path.
      - kind: do
        text: If condition is new or used, tick that box under Condition.
      - kind: do
        text: Results are sorted by price plus shipping; skip "for parts", boxes only and accessories that don't match.
    read:
      listings: The five cheapest matching listings, each with title, condition, price, shipping and seller feedback
      ships_from: Where the cheapest ones ship from
      returns: Whether the cheapest listing accepts returns
    answer: "Cheapest on eBay: {listings}."
    tags: [ebay, product-search]

  - id: idealo.compare_prices
    title: Compare prices on idealo
    says:
      - Check idealo for the cheapest Bosch Serie 4 dishwasher.
      - What's the best price for AirPods Pro on idealo?
      - Compare prices for a Garmin Forerunner 265 on idealo.
    kind: look
    where: prefer_chrome
    region: eu
    sites: [idealo.de, idealo.at, idealo.fr, idealo.it, idealo.es]
    inputs:
      query: {label: Product, kind: text}
    open: https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q={query}
    steps:
      - kind: do
        text: For a person in Austria, France, Italy or Spain, search on idealo.at, idealo.fr, idealo.it or idealo.es instead.
      - kind: do
        text: Open the product page for the exact model and read its offers, sorted by price including shipping.
      - kind: do
        text: Open the price chart and read the last three months.
    read:
      best_offer: The cheapest offer including shipping, its shop and delivery time
      offers: The next three offers, each with shop, total price and shop rating
      price_trend: Lowest and typical price over the last three months from the chart
    answer: "Best: {best_offer}. Three-month trend: {price_trend}."
    tags: [price-comparison, price-history]

  - id: pricerunner.compare_prices
    title: Compare prices on PriceRunner
    says:
      - What's the cheapest Samsung Galaxy S25 on PriceRunner?
      - Compare UK prices for a Ninja air fryer.
      - Which shop has the Dyson Airwrap for the least on PriceRunner?
    kind: look
    where: prefer_chrome
    region: gb
    sites: [pricerunner.com, pricerunner.se, pricerunner.dk]
    inputs:
      query: {label: Product, kind: text}
    open: https://www.pricerunner.com/results?q={query}
    steps:
      - kind: do
        text: For a person in Sweden or Denmark, search on pricerunner.se or pricerunner.dk instead.
      - kind: do
        text: Open the product that matches the exact model and read its shop list, cheapest first.
    read:
      best_offer: The cheapest price, its shop and stock status
      offers: The next three offers, each with shop, price, delivery cost and shop rating
      price_drop: Whether PriceRunner marks the price as dropped or low, and by how much
    answer: "Best: {best_offer}. Also: {offers}."
    tags: [price-comparison]

  # ── Price history ─────────────────────────────────────────────────────

  - id: pricespy.price_history
    title: Has this product been cheaper (PriceSpy)
    says:
      - Has the PS5 Pro been cheaper than this?
      - Show me the price history of the Sonos Era 100 on PriceSpy.
      - Is now a good time to buy a Kindle Paperwhite, or was it lower before?
    kind: look
    where: prefer_chrome
    region: gb
    sites: [pricespy.co.uk, pricespy.co.nz, prisjakt.nu, prisjakt.no, hintaopas.fi]
    inputs:
      query: {label: Product, kind: text}
    open: https://pricespy.co.uk/search?search={query}
    steps:
      - kind: do
        text: For New Zealand, Sweden, Norway or Finland use pricespy.co.nz, prisjakt.nu, prisjakt.no or hintaopas.fi instead.
      - kind: do
        text: Open the product for the exact model, then its price history chart; set it to the longest range shown.
    read:
      lowest_now: Today's lowest price and the shop
      lowest_ever: The lowest price in the chart and when it was
      typical: The price it usually sits at over the last three months
      verdict: Whether today's price is near the low, typical or high end of its history
    answer: "{lowest_now} today; lowest was {lowest_ever}, usually {typical}. {verdict}."
    tags: [price-history, price-comparison]

  - id: camelcamelcamel.price_history
    title: Amazon price history (camelcamelcamel)
    says:
      - Is this Amazon price actually a good deal?
      - What's the lowest the Kindle Paperwhite has been on Amazon?
      - Show me the Amazon price history for the Instant Pot Duo.
    kind: look
    where: prefer_chrome
    region: global
    sites: [camelcamelcamel.com]
    inputs:
      product: {label: Product, kind: text, hint: "A name, an ASIN or the Amazon link itself"}
    open: https://camelcamelcamel.com/search?sq={product}
    steps:
      - kind: do
        text: For another Amazon site use its camel subdomain (uk., de., fr., it., es., ca., au., jp.camelcamelcamel.com).
      - kind: do
        text: Open the matching product and read the "Amazon" price type first, then "3rd party new".
    read:
      current: Current Amazon price
      lowest: Lowest Amazon price ever and its date
      highest: Highest Amazon price ever and its date
      average: Average price over the period shown
    answer: "Now {current}; lowest ever {lowest}, highest {highest}, average {average}."
    tags: [amazon, price-history]

  - id: keepa.price_history
    title: Was this Amazon deal really a deal (Keepa)
    says:
      - Was this Prime Day price really a deal, or did they raise it first?
      - Check Keepa for the product I'm looking at on Amazon.
      - Did this Amazon price go up right before the sale?
    kind: look
    where: any
    region: global
    sites: [keepa.com]
    inputs:
      asin: {label: Amazon product ID (ASIN), kind: text, default: the ASIN of the Amazon product on the person's open tab, hint: "The 10 characters after /dp/ in the Amazon link"}
    open: https://keepa.com/#!product/1-{asin}
    steps:
      - kind: do
        text: "The 1 before the dash is amazon.com; for other sites use 2 UK, 3 Germany, 4 France, 5 Japan, 6 Canada, 8 Italy, 9 Spain, 10 India, 11 Mexico."
      - kind: do
        text: Set the chart range to 3 months, then to 1 year, and compare the Amazon line with the current price.
    read:
      current: Current Amazon price
      before_sale: The price in the weeks before the current deal, and whether it was raised just before
      low_90d: Lowest price in the last 90 days
      low_year: Lowest price in the last year
    answer: "Now {current}; before the sale {before_sale}; 90-day low {low_90d}, 1-year low {low_year}."
    tags: [amazon, price-history, deals]

  # ── Deals and coupons ─────────────────────────────────────────────────

  - id: slickdeals.find_deals
    title: Deals on a product (Slickdeals)
    says:
      - Any good deals on AirPods right now?
      - Has anyone posted a deal on a 65-inch OLED TV?
      - Check Slickdeals for SSD deals.
    kind: look
    where: prefer_chrome
    region: us
    sites: [slickdeals.net]
    inputs:
      query: {label: What to look for, kind: text}
    open: https://slickdeals.net/newsearch.php?q={query}
    steps:
      - kind: do
        text: Keep deals posted in the last two weeks; skip ones marked expired.
      - kind: do
        text: Prefer frontpage or popular deals with many thumbs up; open the top one to check the comments for catches.
    read:
      deals: Up to five live deals, each with title, price, store and date posted
      best: The best deal with its votes and any catch from the comments (coupon, rebate, membership)
    answer: "Best deal: {best}. Others: {deals}."
    tags: [deals, electronics]

  - id: amazon.todays_deals
    title: Today's Amazon deals in a category
    says:
      - What's on sale on Amazon today?
      - Any Amazon deals on headphones today?
      - Show me today's Lightning Deals for kitchen stuff.
    kind: look
    where: prefer_chrome
    region: global
    sites: [amazon.com]
    inputs:
      category: {label: Category or product, kind: text, default: "", hint: "Leave empty for the top deals overall"}
    open: https://www.amazon.com/deals
    steps:
      - kind: do
        text: If the person shops on another Amazon site, open /deals on that site instead.
      - kind: do
        text: If a category was given, pick it in the deals filters, or search for it on the deals page.
    read:
      deals: The top five deals, each with item, deal price, list price, percent off and star rating
      ending: Deals with a countdown, and the time left
    answer: "Today's deals: {deals}."
    tags: [amazon, deals]

  - id: retailmenot.coupons
    title: Coupon codes for a shop
    says:
      - Is there a coupon code for Target?
      - Find me a promo code for Nike before I check out.
      - Any discount codes for Best Buy right now?
    kind: look
    where: prefer_chrome
    region: us
    sites: [retailmenot.com]
    inputs:
      store: {label: Shop's website, kind: text, hint: "The shop's domain, like target.com"}
    open: https://www.retailmenot.com/view/{store}
    steps:
      - kind: do
        text: Keep codes marked verified or used recently; note each code's minimum spend and exclusions.
      - kind: do
        text: Don't apply codes at checkout unless the person asks; just list them.
    read:
      codes: Up to five codes, each with what it gives, conditions and when it was last verified
      sales: Sitewide sales that need no code
      cashback: Any cashback offer shown for the shop
    answer: "Codes to try: {codes}."
    tags: [coupons, deals]

  # ── Reviews ───────────────────────────────────────────────────────────

  - id: amazon.review_digest
    title: What Amazon reviews say about a product
    says:
      - What do people say about the Roomba Combo j9+ on Amazon?
      - Summarize the Amazon reviews for this coffee grinder.
      - Are there common complaints about the Kindle Scribe?
    kind: look
    where: prefer_chrome
    region: global
    sites: [amazon.com]
    inputs:
      product: {label: Product, kind: text}
    open: https://www.amazon.com/s?k={product}
    steps:
      - kind: do
        text: If the person shops on another Amazon site, search there instead.
      - kind: do
        text: Open the matching product (not a sponsored one) and scroll to the reviews section.
      - kind: do
        text: Read the "Customers say" summary, then filter to 1- and 2-star reviews and note what repeats.
      - kind: do
        text: If more reviews need a sign-in, use what the page shows and say so.
    read:
      rating: Average star rating and number of ratings
      breakdown: Share of 5-star and 1-star ratings
      customers_say: Amazon's "Customers say" summary
      pros: What reviewers praise most often
      cons: Complaints that come up again and again in critical reviews
    answer: "{rating}. Liked: {pros}. Complaints: {cons}."
    tags: [amazon, reviews]

  - id: rtings.review
    title: RTINGS test results for a product
    says:
      - What does RTINGS say about the LG C4?
      - How did the Sony WH-1000XM5 test on RTINGS?
      - Is the Dell U2724D a good monitor according to RTINGS?
    kind: look
    where: any
    region: global
    sites: [rtings.com]
    inputs:
      product: {label: Product, kind: text}
    open: https://www.rtings.com/search?q={product}
    steps:
      - kind: do
        text: Open the full review for the exact model, not a comparison or a "best of" list.
    read:
      scores: The usage scores out of 10 (for example Mixed Usage, Gaming, Office)
      pros: The pros listed at the top
      cons: The cons listed at the top
      verdict: The short verdict paragraph
      alternatives: The alternatives the review compares it with
    answer: "{scores}. Pros: {pros}. Cons: {cons}."
    tags: [reviews, electronics]

  - id: wirecutter.best_pick
    title: Wirecutter's pick for a category
    says:
      - What's Wirecutter's top pick for air purifiers?
      - Which robot vacuum does Wirecutter recommend?
      - What's the best budget blender according to Wirecutter?
    kind: look
    where: prefer_chrome
    region: global
    sites: [nytimes.com/wirecutter]
    inputs:
      category: {label: What kind of product, kind: text}
    open: https://www.nytimes.com/wirecutter/search/?s={category}
    steps:
      - kind: do
        text: Open the "best" guide for the category, the newest one if there are several.
      - kind: do
        text: If the guide is cut off by the paywall, read what shows and say the rest needs a subscription.
    read:
      top_pick: The top pick and why
      runner_up: The runner-up, if any
      budget_pick: The budget pick, if any
      upgrade_pick: The upgrade pick, if any
      updated: When the guide was last updated
    answer: "Top pick: {top_pick}. Budget: {budget_pick}. Updated {updated}."
    tags: [reviews, recommendations]

  # ── Compare specs ─────────────────────────────────────────────────────

  - id: web.compare_specs
    title: Compare two products' specs side by side
    says:
      - Compare the MacBook Air M4 and the Dell XPS 13.
      - What's the difference between the Sony A7 IV and the Canon R6 Mark II?
      - Dyson V15 or Shark Stratos, which has better specs?
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com/search]
    inputs:
      product_a: {label: First product, kind: text}
      product_b: {label: Second product, kind: text}
    open: https://www.google.com/search?q={product_a}+vs+{product_b}+specs
    steps:
      - kind: do
        text: Open each maker's official spec page (not a reseller's) for {product_a} and for {product_b}.
      - kind: do
        text: Line up the specs that matter for this kind of product, plus weight, warranty and current price.
    read:
      specs: A side-by-side of the key specs for both
      differences: The three differences that matter most
      prices: The current price of each on the maker's site
    answer: "{differences}. Prices: {prices}."
    tags: [specs, comparison]

  - id: gsmarena.compare_phones
    title: Compare two phones on GSMArena
    says:
      - Compare the iPhone 17 Pro and the Galaxy S25 Ultra.
      - Pixel 10 or iPhone 17, which has the bigger battery?
      - Show me the specs of the OnePlus 13 next to the Xiaomi 15.
    kind: look
    where: any
    region: global
    sites: [gsmarena.com]
    inputs:
      phone_a: {label: First phone, kind: text}
      phone_b: {label: Second phone, kind: text}
    open: https://www.gsmarena.com/compare.php3
    steps:
      - kind: type
        note: The first phone's search box
        value: "{phone_a}"
      - kind: do
        text: Pick the exact model from the suggestions.
      - kind: type
        note: The second phone's search box
        value: "{phone_b}"
      - kind: do
        text: Pick the exact model from the suggestions and wait for the table.
    read:
      display: Screen size, type and refresh rate of each
      chipset: Chipset of each
      battery: Battery capacity and charging speed of each
      cameras: Main and selfie camera specs of each
      size_weight: Dimensions and weight of each
      released: Release date and launch price of each
    answer: "Display: {display}. Chip: {chipset}. Battery: {battery}. Cameras: {cameras}."
    tags: [specs, comparison, phones]

  # ── Package tracking ──────────────────────────────────────────────────

  - id: amazon.track_order
    title: Where is my Amazon order
    says:
      - Where's my Amazon package?
      - When does my Amazon order arrive?
      - Has the vacuum I ordered on Amazon shipped yet?
    kind: look
    where: chrome
    region: global
    sites: [amazon.com]
    inputs:
      order: {label: Which order, kind: text, default: the most recent order not yet delivered}
    open: https://www.amazon.com/gp/css/order-history
    steps:
      - kind: do
        text: If the person shops on another Amazon site, open Your Orders there instead.
      - kind: do
        text: Find {order} in the list.
      - kind: click
        target: {role: link, name: Track package}
    read:
      status: The shipment status line (ordered, shipped, out for delivery, delivered)
      eta: Expected delivery date or time window
      last_event: The latest tracking event with place and time
      carrier: Carrier and tracking number, if shown
    answer: "{status}, arriving {eta}. Last update: {last_event}."
    tags: [amazon, tracking, orders]

  - id: ups.track
    title: Track a UPS package
    says:
      - Track UPS 1Z999AA10123456784.
      - Where is my UPS parcel?
      - When will UPS deliver my package?
    kind: look
    where: prefer_chrome
    region: global
    sites: [ups.com]
    inputs:
      tracking: {label: Tracking number, kind: text, hint: "Most UPS numbers start with 1Z"}
    open: https://www.ups.com/track?tracknum={tracking}&loc=en_US
    read:
      status: Current status (in transit, out for delivery, delivered, exception)
      delivery: Scheduled delivery date and time window
      last_event: The latest scan with place and time
      action: Anything needed from the person (signature, customs fee, missed delivery)
    answer: "{status}, delivery {delivery}. Last scan: {last_event}."
    tags: [tracking, ups]

  - id: fedex.track
    title: Track a FedEx package
    says:
      - Track FedEx 123456789012.
      - Where's my FedEx delivery?
      - Is my FedEx shipment out for delivery?
    kind: look
    where: prefer_chrome
    region: global
    sites: [fedex.com]
    inputs:
      tracking: {label: Tracking number, kind: text, hint: "Usually 12 or 15 digits"}
    open: https://www.fedex.com/fedextrack/?trknbr={tracking}
    read:
      status: Current status (label created, in transit, out for delivery, delivered, delay)
      delivery: Estimated delivery date and time window
      last_event: The latest scan with place and time
      action: Anything needed from the person (signature, customs fee, held at location)
    answer: "{status}, delivery {delivery}. Last scan: {last_event}."
    tags: [tracking, fedex]

  - id: dhl.track
    title: Track a DHL shipment
    says:
      - Track DHL 1234567890.
      - Where's my DHL Express parcel?
      - Is my DHL package stuck in customs?
    kind: look
    where: prefer_chrome
    region: global
    sites: [dhl.com]
    inputs:
      tracking: {label: Tracking number, kind: text, hint: "DHL Express numbers are usually 10 digits"}
    open: https://www.dhl.com/global-en/home/tracking.html?tracking-id={tracking}&submit=1
    steps:
      - kind: do
        text: If DHL asks which service the number belongs to, pick the one that returns results.
    read:
      status: Current status (in transit, customs, out for delivery, delivered)
      delivery: Estimated delivery date
      last_event: The latest event with place and time
      customs: Whether customs is holding it or duties are due
    answer: "{status}, delivery {delivery}. Last update: {last_event}."
    tags: [tracking, dhl]

  - id: 17track.track_parcel
    title: Track a parcel from any carrier
    says:
      - Track this parcel, I don't know the carrier.
      - Where is package RR123456785CN?
      - Which carrier does this tracking number belong to?
    kind: look
    where: prefer_chrome
    region: global
    sites: [17track.net]
    inputs:
      tracking: {label: Tracking number, kind: text}
    open: https://t.17track.net/en#nums={tracking}
    steps:
      - kind: do
        text: If a robot check appears, hand it to the person and wait; never solve it.
    read:
      carrier: The carrier 17TRACK detected, and the local carrier if it was handed over
      status: Current status
      last_event: The latest event with place and time
      days: Days in transit so far
    answer: "{carrier}: {status}. Last event: {last_event} ({days} days in transit)."
    tags: [tracking]

  - id: parcelsapp.track_cross_border
    title: Track an AliExpress, Temu or Shein parcel
    says:
      - Where is my AliExpress order? Tracking LP00123456789012.
      - Track my Temu parcel.
      - Has my Shein package reached the country yet?
    kind: look
    where: prefer_chrome
    region: global
    sites: [parcelsapp.com]
    inputs:
      tracking: {label: Tracking number, kind: text}
    open: https://parcelsapp.com/en/tracking/{tracking}
    read:
      status: Current status
      route: Origin and destination countries, and whether it has arrived in the destination country
      last_event: The latest event with place and time
      local_tracking: The local carrier and its tracking number after hand-over, if shown
      eta: Estimated delivery, if shown
    answer: "{status} ({route}). Last: {last_event}. Local carrier: {local_tracking}."
    tags: [tracking, cross-border]

  # ── Orders: returns, reorders, cart, wishlist ─────────────────────────

  - id: amazon.start_return
    title: Start an Amazon return
    says:
      - Return the headphones I bought on Amazon, they don't fit.
      - Start a return for my last Amazon order.
      - I want a replacement for the broken kettle from Amazon.
    kind: act
    where: chrome
    region: global
    sites: [amazon.com]
    inputs:
      item: {label: Item to return, kind: text}
      reason: {label: Why, kind: text, hint: "In the person's words; matched to Amazon's reason list"}
      resolution: {label: Refund or replacement, kind: choice, options: [refund, replacement], default: refund}
      method: {label: How to send it back, kind: text, default: the free drop-off option nearest the person}
