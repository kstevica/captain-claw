      animal: {label: Pet, kind: choice, options: [dog, cat, rabbit, horse, bird, other]}
      symptom: {label: Symptom or condition, kind: text}
    open: https://www.merckvetmanual.com/searchresults?query={symptom}+{animal}
    steps:
      - kind: do
        text: Prefer results from the owner sections (Dog Owners, Cat Owners and so on) over the pages for vets; open the best one.
      - kind: do
        text: Summarize only what the manual says; don't diagnose the pet.
    read:
      causes: Common causes it lists
      urgent: Signs that mean see a vet now
      vet_care: What a vet usually does to find and treat it
      home_care: Any home care it mentions
