    open: https://calendar.google.com/calendar/r/day
    steps:
      - kind: do
        text: Find {event} in the calendar and note its start time and address.
      - kind: open
        url: https://www.google.com/maps/dir/?api=1&origin={origin}&destination={event}&travelmode={mode}
        note: Put the meeting's address in place of {event}.
      - kind: do
        text: Set "Arrive by" to the meeting's start time and read the suggested departure.
    read:
      meeting: The meeting's title, start time and address
      leave_by: The latest departure time Maps suggests
      duration: Expected travel time
    answer: "Leave by {leave_by} for {meeting} ({duration})."
    needs: [calendar, location]
