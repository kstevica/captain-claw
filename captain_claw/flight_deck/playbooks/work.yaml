    read:
      free_slots: The free gaps, each with day, start and end
      busiest_day: The day with the least free time
      conflicts: Overlapping events, if any
    answer: "Free: {free_slots}."
    needs: [calendar, contacts]
    tags: [calendar, scheduling, availability]

