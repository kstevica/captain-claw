category: work
playbooks:
  # ---- Web analytics and search ------------------------------------------

  - id: ga4.weekly_traffic
    title: Website traffic last week
    says:
      - How much traffic did the website get last week?
      - How many visitors did we have in the last 7 days?
      - Is site traffic up or down this month?
      - Where are our visitors coming from lately?
    kind: look
    where: chrome
    region: global
    sites: [analytics.google.com]
    inputs:
      property: {label: Property, kind: text, default: the one Analytics opens on, hint: "The site or app name as Google Analytics lists it"}
      period: {label: Period, kind: choice, options: [last 7 days, last 28 days, last 90 days], default: last 7 days}
    open: https://analytics.google.com/analytics/web/
    steps:
      - kind: do
        text: If {property} is not the property shown top left, switch to it with the property picker.
      - kind: do
        text: Open Reports → Acquisition → Traffic acquisition, set the date range to {period} and turn on "Compare to preceding period".
    read:
      users: Total users, and the change vs the preceding period
      sessions: Sessions, and the change vs the preceding period
      engagement_rate: Engagement rate
      top_channels: The three session channel groups with the most sessions, each with its sessions
    answer: "{users} users and {sessions} sessions over the {period}; most came from {top_channels}."
    tags: [analytics, traffic, website]

  - id: ga4.top_pages
    title: Most viewed pages on the website
    says:
      - What were our top pages last week?
      - Which blog posts got the most views this month?
      - What pages do people visit most on the site?
    kind: look
    where: chrome
    region: global
    sites: [analytics.google.com]
    inputs:
      property: {label: Property, kind: text, default: the one Analytics opens on}
      period: {label: Period, kind: choice, options: [last 7 days, last 28 days, last 90 days], default: last 7 days}
      path: {label: Only pages under, kind: text, default: "", hint: "A path prefix like /blog/ to narrow the list"}
    open: https://analytics.google.com/analytics/web/
    steps:
      - kind: do
        text: If {property} is not the property shown top left, switch to it with the property picker.
      - kind: do
        text: Open Reports → Engagement → Pages and screens, set the date range to {period}, and set the table's dimension to "Page path and screen class".
      - kind: do
        text: If a path was given, type {path} into the table's search box. Sort by Views, highest first.
    read:
      top_pages: The ten pages with the most views, each with views, active users and average engagement time
      total_views: Total views across all pages for the period
    answer: "Top pages over the {period}: {top_pages}."
    tags: [analytics, content, website]

  - id: ga4.key_events
    title: Conversions on the website
    says:
      - How many sign-ups did we get from the website last week?
      - How are conversions doing this month?
      - Which channel brought the most purchases in the last 28 days?
    kind: look
    where: chrome
    region: global
    sites: [analytics.google.com]
    inputs:
      property: {label: Property, kind: text, default: the one Analytics opens on}
      event: {label: Which conversion, kind: text, default: all key events, hint: "An event name like sign_up, purchase or generate_lead"}
      period: {label: Period, kind: choice, options: [last 7 days, last 28 days, last 90 days], default: last 7 days}
    open: https://analytics.google.com/analytics/web/
    steps:
      - kind: do
        text: If {property} is not the property shown top left, switch to it with the property picker.
      - kind: do
        text: Open Reports → Engagement → Key events (called Conversions in older properties), set the date range to {period} with "Compare to preceding period" on.
      - kind: do
        text: Then open Reports → Acquisition → Traffic acquisition, pick {event} in the Key events column's menu, and note which channels bring the most.
    read:
      key_events: Each key event's count for the period and its change vs the preceding period
      top_channel: The session channel group with the most of {event}, with its count
      rate: The session key event rate, if shown
    answer: "{key_events}. The best channel was {top_channel}."
    tags: [analytics, conversions, marketing]

  - id: searchconsole.top_queries
    title: Top Google searches bringing visitors
    says:
      - What are people searching on Google to find us?
      - How many clicks did we get from Google search last month?
      - Which keywords is our site ranking for?
      - Did our search clicks drop this week?
    kind: look
    where: chrome
    region: global
    sites: [search.google.com/search-console]
    inputs:
      property: {label: Search Console property, kind: text, hint: "sc-domain:example.com for a domain property, or the full prefix like https://www.example.com/"}
      period: {label: Period, kind: choice, options: [last 7 days, last 28 days, last 3 months], default: last 28 days}
    open: https://search.google.com/search-console/performance/search-analytics?resource_id={property}
    steps:
      - kind: do
        text: If the property isn't found, open the property picker top left and choose the one that matches the site.
      - kind: do
        text: Set the date filter to {period}, turn on Average CTR and Average position, and stay on the Queries tab.
    read:
      clicks: Total clicks for the period
      impressions: Total impressions
      ctr: Average CTR
      position: Average position
      top_queries: The ten queries with the most clicks, each with clicks, impressions and position
    answer: "{clicks} clicks from {impressions} impressions over the {period}; top queries: {top_queries}."
    tags: [seo, search, website]

  - id: searchconsole.indexing_problems
    title: Pages Google isn't indexing
    says:
      - Are there any indexing problems in Search Console?
      - Why aren't some of our pages showing up on Google?
      - Is our new pricing page indexed yet?
      - How many of our pages does Google have indexed?
    kind: look
    where: chrome
    region: global
    sites: [search.google.com/search-console]
    inputs:
      property: {label: Search Console property, kind: text, hint: "sc-domain:example.com for a domain property, or the full prefix like https://www.example.com/"}
      page: {label: One page to check, kind: url, default: "", hint: "A full page address to run through URL Inspection"}
    open: https://search.google.com/search-console/index?resource_id={property}
    steps:
      - kind: do
        text: Read the Indexed and Not indexed totals, then the "Why pages aren't indexed" table.
      - kind: do
        text: Open the reason with the most pages and note three example URLs.
      - kind: do
        text: If a page was given, paste {page} into "Inspect any URL" at the top and read the result. Never click "Request indexing" unless the person asked.
    read:
      indexed: Number of indexed pages
      not_indexed: Number of pages not indexed
      reasons: Each reason pages aren't indexed, with its page count and validation status
      examples: Example URLs for the biggest reason
      page_status: For the inspected page, whether it is on Google, its last crawl date and the canonical Google chose
    answer: "{indexed} pages indexed, {not_indexed} not. Main reasons: {reasons}."
    tags: [seo, indexing, website]

  # ---- Payments and store -------------------------------------------------

  - id: stripe.revenue_this_month
    title: Revenue in Stripe this month
    says:
      - How much revenue have we done this month in Stripe?
      - What's our gross volume this week?
      - How did last month's sales compare to the month before?
      - What's our MRR right now?
    kind: look
    where: chrome
    region: global
    sites: [dashboard.stripe.com]
    inputs:
      period: {label: Period, kind: choice, options: [today, last 7 days, this month, last month], default: this month}
      account: {label: Stripe account, kind: text, default: the one the dashboard opens on}
    open: https://dashboard.stripe.com/dashboard
    steps:
      - kind: do
        text: Look only. Never open refunds, payouts, transfers or any page that moves money.
      - kind: do
        text: If {account} isn't the account shown top left, switch to it. Make sure test mode or a sandbox is off so the numbers are live.
      - kind: do
        text: On Home, set the overview's date range to {period} and compare to the previous period.
      - kind: do
        text: If the account bills subscriptions, open Billing → Overview and read MRR.
    read:
      gross_volume: Gross volume for the period, with the change vs the previous period
      net_volume: Net volume for the period
      payments: Number of successful payments
      mrr: Monthly recurring revenue, if the account uses subscriptions
    answer: "Gross volume {gross_volume}, net {net_volume} for {period}."
    tags: [revenue, payments, finance]

  - id: stripe.failed_payments
    title: Failed payments in Stripe
    says:
      - Any failed payments in Stripe this week?
      - Which customers' cards got declined recently?
      - How much did we lose to failed charges this month?
    kind: look
    where: chrome
    region: global
    sites: [dashboard.stripe.com]
    inputs:
      period: {label: Period, kind: choice, options: [last 7 days, last 30 days, this month], default: last 7 days}
    open: "https://dashboard.stripe.com/payments?status[]=failed"
    steps:
      - kind: do
        text: Look only. Never retry a charge, refund, or contact a customer from here.
      - kind: do
        text: Set the Date filter to {period}. Open a few payments to read their decline reason.
    read:
      count: Number of failed payments in the period
      amount: Their total amount, by currency
      reasons: The most common decline reasons, with counts
      customers: The customers with failed payments, each with amount and date
    answer: "{count} failed payments ({amount}) in the {period}; mostly {reasons}."
    tags: [payments, failed, finance]

  - id: stripe.new_customers
    title: New customers in Stripe
    says:
      - How many new customers did we get this week?
      - Who signed up as a paying customer this month?
      - Show me our newest Stripe customers.
    kind: look
    where: chrome
    region: global
    sites: [dashboard.stripe.com]
    inputs:
      period: {label: Period, kind: choice, options: [today, last 7 days, this month, last month], default: last 7 days}
    open: https://dashboard.stripe.com/customers
    steps:
      - kind: do
        text: Look only; change nothing on any customer.
      - kind: do
        text: Add the Created date filter for {period} and sort by newest.
    read:
      count: Number of customers created in the period
      customers: Each new customer's name or email, created date and plan or first payment
      not_paying: New customers whose first payment failed or who have no payment yet
    answer: "{count} new customers in the {period}."
    tags: [customers, payments, growth]

  - id: shopify.todays_orders
    title: Today's orders in Shopify
    says:
      - How many orders did we get today?
      - What are today's sales on the Shopify store?
      - Any orders still waiting to be shipped?
      - How did yesterday go in the shop?
    kind: look
    where: chrome
    region: global
    sites: [admin.shopify.com]
    inputs:
      store: {label: Store, kind: text, hint: "The store handle, the part after /store/ in the admin link"}
      day: {label: Day, kind: date, default: today}
    open: https://admin.shopify.com/store/{store}/orders
    steps:
      - kind: do
        text: Filter the orders to {day} (Date → the day). Look only; don't fulfil, refund or edit orders.
      - kind: do
        text: Count unfulfilled ones and note any with a fraud-risk flag or pending payment.
    read:
      order_count: Number of orders on the day
      total_sales: Their total value
      unfulfilled: Orders not yet fulfilled
      flagged: Orders with a high-risk flag or pending payment, each with its number
    answer: "{order_count} orders for {total_sales} on {day}; {unfulfilled} still to ship."
    tags: [ecommerce, orders, store]

  - id: shopify.low_stock
    title: Products running low in Shopify
    says:
      - What's running low in the shop?
      - Which products are out of stock?
      - Do we need to reorder anything this week?
    kind: look
    where: chrome
    region: global
    sites: [admin.shopify.com]
    inputs:
      store: {label: Store, kind: text, hint: "The store handle, the part after /store/ in the admin link"}
      threshold: {label: Low means at most, kind: number, default: 5}
      location: {label: Location, kind: text, default: all locations}
    open: https://admin.shopify.com/store/{store}/products/inventory
    steps:
      - kind: do
        text: Pick {location} in the location menu, then sort by Available, lowest first. Look only; don't adjust quantities.
    read:
      out_of_stock: Products and variants with 0 or less available
      low_items: Products and variants at or below {threshold}, each with available and incoming quantity
    answer: "Out of stock: {out_of_stock}. Running low: {low_items}."
    tags: [ecommerce, inventory, store]

  # ---- Ads and email marketing --------------------------------------------

  - id: metaads.campaign_spend
    title: Facebook and Instagram ads spend
    says:
      - How much did we spend on Facebook ads this week?
      - What's our cost per lead on Meta right now?
      - Which Instagram campaign is performing best?
      - Are any of our Meta ads not delivering?
    kind: look
    where: chrome
    region: global
    sites: [adsmanager.facebook.com]
    inputs:
      period: {label: Period, kind: choice, options: [today, yesterday, last 7 days, last 30 days, this month], default: last 7 days}
      account: {label: Ad account, kind: text, default: the one Ads Manager opens on}
    open: https://adsmanager.facebook.com/adsmanager/manage/campaigns
    steps:
      - kind: do
        text: Look only. Never change a budget, bid or status, and never toggle a campaign on or off.
      - kind: do
        text: If {account} isn't selected, switch ad account at the top left. Set the date range to {period} on the Campaigns tab.
    read:
      total_spend: Amount spent across campaigns
      campaigns: Each active campaign with amount spent, results, and cost per result
      best: The campaign with the lowest cost per result
      delivery_issues: Campaigns or ads marked Not delivering, Rejected or Learning limited
    answer: "{total_spend} spent over {period}; best campaign {best}."
    tags: [ads, marketing, spend]

  - id: googleads.campaign_performance
    title: Google Ads spend and conversions
    says:
      - How are our Google Ads doing this month?
      - What's our cost per conversion on Google Ads?
      - How much have we spent on search ads this week?
    kind: look
    where: chrome
    region: global
    sites: [ads.google.com]
    inputs:
      period: {label: Period, kind: choice, options: [today, yesterday, last 7 days, last 30 days, this month], default: last 7 days}
      account: {label: Ads account, kind: text, default: the one Google Ads opens on}
    open: https://ads.google.com/aw/campaigns
    steps:
      - kind: do
        text: Look only. Never change budgets, bids, ads or campaign status, and dismiss recommendation prompts without applying them.
      - kind: do
        text: If asked to pick an account, choose {account}. Set the date range to {period}.
    read:
      cost: Total cost for the period
      conversions: Total conversions and cost per conversion
      campaigns: Each enabled campaign with cost, clicks, conversions and cost per conversion
      limited: Campaigns marked Limited by budget or with disapproved ads
    answer: "{cost} spent over {period}; {conversions}."
    tags: [ads, marketing, spend]

  - id: linkedin.ads_spend
    title: LinkedIn ads spend and results
    says:
      - How much have we spent on LinkedIn ads this month?
      - What's the cost per lead on our LinkedIn campaigns?
      - How is the LinkedIn campaign doing?
    kind: look
    where: chrome
    region: global
    sites: [linkedin.com/campaignmanager]
    inputs:
      period: {label: Period, kind: choice, options: [last 7 days, last 30 days, this month, last month], default: last 30 days}
      account: {label: Ad account, kind: text, default: the only or most recent one}
    open: https://www.linkedin.com/campaignmanager/
    steps:
      - kind: do
        text: Look only; never change budgets, bids or campaign status.
      - kind: do
        text: Open the ad account {account}, go to Campaigns, and set the date range to {period}.
    read:
      spent: Total spent
      key_results: Key results (leads, clicks or conversions, as the campaigns' objective sets) and cost per result
      ctr: Average click-through rate
      campaigns: Each active campaign with spent, key results and cost per result
    answer: "{spent} spent over {period}; {key_results}."
    tags: [ads, marketing, linkedin]

  - id: mailchimp.campaign_stats
    title: How the last newsletter did
    says:
      - How did our last newsletter perform?
      - What was the open rate on the Mailchimp campaign?
      - How many people clicked last week's email?
    kind: look
    where: chrome
    region: global
    sites: [admin.mailchimp.com]
    inputs:
      campaign: {label: Campaign, kind: text, default: the latest sent}
    open: https://admin.mailchimp.com/reports/
    steps:
      - kind: do
        text: Open the report for {campaign}. Look only; don't send, resend or edit anything.
    read:
      sent_to: Recipients and send date
      open_rate: Open rate
      click_rate: Click rate
      unsubscribes: Unsubscribes and bounces
      top_links: The most clicked links
    answer: "Sent to {sent_to}: {open_rate} opened, {click_rate} clicked, {unsubscribes}."
    tags: [email, newsletter, marketing]

  # ---- CRM ----------------------------------------------------------------

  - id: hubspot.find_contact
    title: Look up a contact or company in HubSpot
    says:
      - What's the status of the Acme account in HubSpot?
      - Who owns this contact in HubSpot?
      - When did we last talk to the Acme lead?
      - Look up the open deals for this company in our CRM.
    kind: look
    where: chrome
    region: global
    sites: [app.hubspot.com]
    inputs:
      who: {label: Contact or company, kind: text, hint: "A name, email address or company"}
    open: https://app.hubspot.com/
    steps:
      - kind: do
        text: Search {who} in the search bar at the top and open the contact or company that matches.
      - kind: do
        text: Look only; don't edit properties or log anything.
    read:
      record: Name, company and email of the record found
      owner: Contact or company owner
      stage: Lifecycle stage and lead status
      last_activity: Date and kind of the last activity, and what it said
      deals: Associated deals, each with stage, amount and close date
    answer: "{record}: {stage}, owned by {owner}; last activity {last_activity}."
    tags: [crm, contacts, sales]

  - id: salesforce.opportunity_lookup
    title: Look up a deal in Salesforce
    says:
      - Where is the Acme deal in Salesforce?
      - What stage is the Acme opportunity at, and when does it close?
      - What's the next step on our biggest open deal?
    kind: look
    where: chrome
    region: global
    inputs:
      site: {label: Salesforce address, kind: url, hint: "The org's own link, like https://acme.lightning.force.com or https://acme.my.salesforce.com"}
      deal: {label: Opportunity or account, kind: text}
    open: "{site}"
    steps:
      - kind: do
        text: Search {deal} in the global search at the top (or open the Opportunities tab) and open the matching opportunity.
      - kind: do
        text: Look only; don't edit fields or change the stage.
    read:
      opportunity: Opportunity name and account
      stage: Stage and probability
      amount: Amount
      close_date: Close date
      owner: Opportunity owner
      next_step: Next step and the last logged activity
    answer: "{opportunity} is at {stage}, {amount}, closing {close_date}; next step {next_step}."
    tags: [crm, sales, deals]

  - id: pipedrive.log_note
    title: Add a note to a deal in Pipedrive
    says:
      - Add a note to the Acme deal in Pipedrive that they want a demo next week.
      - Log in Pipedrive that the client asked for a revised quote.
      - Put a note on this deal saying we sent the contract.
    kind: act
    where: chrome
    region: global
    sites: [app.pipedrive.com, pipedrive.com]
    inputs:
      deal: {label: Deal, kind: text}
      note: {label: Note, kind: text}
    open: https://app.pipedrive.com/pipeline
    steps:
      - kind: do
        text: Search {deal} with the search bar at the top and open the deal that matches.
      - kind: click
        target: {role: tab, name: Notes}
      - kind: type
        note: the note box ("Take notes")
        value: "{note}"
    read:
      deal_found: The deal's title, organization and stage
    stop: Save
    tags: [crm, notes, sales]

  # ---- Code and engineering -----------------------------------------------

  - id: github.prs_to_review
    title: Pull requests waiting for my review
    says:
      - Which PRs are waiting for my review?
      - Do I have any code reviews pending on GitHub?
      - What pull requests need me?
    kind: look
    where: chrome
    region: global
    sites: [github.com]
    open: https://github.com/pulls/review-requested
    read:
      count: Number of open pull requests requesting the person's review
      prs: Each one with title, repository, author, age and its checks status
      oldest: The longest-waiting pull request and how long it has waited
    answer: "{count} PRs wait for your review; the oldest is {oldest}."
    tags: [github, code-review, engineering]

  - id: github.failing_checks
    title: My pull requests with failing checks
    says:
      - Are any of my PRs failing CI?
      - Why is my pull request red?
      - Which of my GitHub PRs have broken checks?
    kind: look
    where: chrome
    region: global
    sites: [github.com]
    open: https://github.com/pulls?q=is%3Aopen+is%3Apr+author%3A%40me+status%3Afailure
    steps:
      - kind: do
        text: For up to three of the pull requests, open the Checks tab, open the failing job and find the first error line.
      - kind: do
        text: Look only; never re-run jobs, push or merge.
    read:
      count: Number of the person's open pull requests with failing checks
      prs: Each one with title, repository and the names of its failing checks
      causes: The first error line from each failing job opened
    answer: "{count} of your PRs are failing: {prs}."
    tags: [github, ci, engineering]

  - id: github.issues_assigned
    title: GitHub issues assigned to me
    says:
      - What GitHub issues are assigned to me?
      - What's on my plate in GitHub?
      - Any stale issues assigned to me?
    kind: look
    where: chrome
    region: global
    sites: [github.com]
    inputs:
      repo: {label: Only in repository, kind: text, default: "", hint: "owner/name to narrow it to one repository"}
    open: https://github.com/search?q=is%3Aissue+is%3Aopen+assignee%3A%40me&type=issues
    steps:
      - kind: do
        text: If a repository was given, add repo:{repo} to the search. Sort by Recently updated.
    read:
      count: Number of open issues assigned to the person
      issues: Each issue with title, repository, labels and last update
      stale: Issues not updated for more than 14 days
    answer: "{count} open issues are assigned to you; stale: {stale}."
    tags: [github, issues, engineering]

  - id: github.changes_since_tag
    title: What changed since the last release
    says:
      - What's changed since v2.3.0?
      - Write release notes for everything merged since the last tag.
      - What went into main since the last release?
    kind: look
    where: chrome
    region: global
    sites: [github.com]
    inputs:
      owner: {label: Owner, kind: text, hint: "The user or organization in the repository link"}
      repo: {label: Repository, kind: text}
      tag: {label: Since tag, kind: text, hint: "e.g. v2.3.0; if unknown the run reads the latest release first"}
      branch: {label: Up to branch, kind: text, default: main}
    open: https://github.com/{owner}/{repo}/compare/{tag}...{branch}
    steps:
      - kind: open
        url: https://github.com/{owner}/{repo}/releases/latest
        note: Only if the tag wasn't given or the comparison doesn't exist; take the latest release's tag and compare from it.
      - kind: do
        text: Read the commit list; merge commits and squash titles name the pull requests. Group them as features, fixes and other.
    read:
      commit_count: Number of commits between {tag} and {branch}
      merged_prs: The pull requests merged in that range, with numbers and titles
      breaking: Anything marked breaking, a major version bump or a migration
      contributors: Who contributed
    answer: "{commit_count} commits since {tag}: {merged_prs}."
    tags: [github, release, changelog]

  - id: gitlab.mrs_to_review
    title: Merge requests waiting for my review
    says:
      - Which merge requests are waiting for my review in GitLab?
      - Any MRs assigned to me for review?
      - What GitLab reviews do I owe people?
    kind: look
    where: chrome
    region: global
    sites: [gitlab.com]
    open: https://gitlab.com/dashboard/merge_requests
    steps:
      - kind: do
        text: Open the reviews view (the "Reviews" tab, or filter Reviewer = the person). Look only; don't approve or merge.
    read:
      count: Number of open merge requests where the person is a reviewer
      mrs: Each with title, project, author, age and pipeline status
      oldest: The longest-waiting one
    answer: "{count} merge requests wait for your review; the oldest is {oldest}."
    tags: [gitlab, code-review, engineering]

  # ---- Tickets and tasks --------------------------------------------------

  - id: jira.my_open_issues
    title: My open Jira tickets
    says:
      - What Jira tickets are assigned to me?
      - What's in my Jira queue right now?
      - Do I have any overdue tickets?
      - What should I work on next in Jira?
    kind: look
    where: chrome
    region: global
    inputs:
      site: {label: Jira address, kind: url, hint: "The team's Jira link, like https://acme.atlassian.net"}
    open: "{site}"
    steps:
      - kind: do
        text: "Open the issue search (Filters → View all work items, or {site}/issues/), switch to JQL and run: assignee = currentUser() AND statusCategory != Done ORDER BY priority DESC, duedate ASC"
      - kind: do
        text: Look only; don't change status or assignee.
    read:
      count: Number of unresolved issues assigned to the person
      issues: Each with key, summary, status, priority and due date
      overdue: Issues past their due date
    answer: "{count} open tickets; overdue: {overdue}."
    tags: [jira, tickets, tasks]

  - id: jira.sprint_status
    title: How the current sprint is going
    says:
      - How's the sprint going?
      - How many tickets are left in this sprint?
      - Is anything blocked in the current sprint?
    kind: look
    where: chrome
