      as: {label: Post as, kind: choice, options: [me, company page], default: me}
      page: {label: Company page, kind: text, default: "", hint: "The page's id or name from its LinkedIn link, if posting as the company"}
    open: https://www.linkedin.com/feed/?shareActive=true
    steps:
      - kind: open
        url: https://www.linkedin.com/company/{page}/admin/
        note: Only when posting as the company page; then click Create → Start a post there.
      - kind: do
        text: If the post box isn't open, click "Start a post".
      - kind: type
        note: the post editor
        value: "{text}"
      - kind: do
        text: Check the author shown is right (the person or the page) and the audience is what they want.
    read:
      author: Who the post will appear from
    stop: Post
    tags: [linkedin, social, post]

  - id: x.write_post
    title: Write a post on X
    says:
      - Tweet that our new feature is live.
      - Draft an X post about the webinar on Thursday.
      - Post this on our X account.
    kind: act
    where: chrome
    region: global
    sites: [x.com]
    inputs:
      text: {label: Post, kind: text}
    open: https://x.com/intent/post?text={text}
    steps:
      - kind: do
        text: Check the account shown is the right one and the text fits the length limit; shorten it with the person if not.
    read:
      account: The account the post will go out from
      length: Characters used and the limit
    stop: Post
    tags: [x, social, post]

  - id: linkedin.job_post
    title: Draft a job post on LinkedIn
    says:
      - Post a job on LinkedIn for a senior backend engineer.
      - Draft a LinkedIn job ad for a part-time office manager.
      - Put our marketing lead opening on LinkedIn Jobs.
    kind: act
    where: chrome
    region: global
    sites: [linkedin.com]
    inputs:
      title: {label: Job title, kind: text}
      company: {label: Company, kind: text, default: the person's company page}
      location: {label: Location, kind: place}
      workplace: {label: Workplace, kind: choice, options: [On-site, Hybrid, Remote], default: On-site}
      type: {label: Job type, kind: choice, options: [Full-time, Part-time, Contract, Temporary, Internship], default: Full-time}
      description: {label: Description, kind: text, default: drafted from the title and what the agent knows}
    open: https://www.linkedin.com/talent/post-a-job
    steps:
      - kind: do
        text: Fill job title {title}, company {company}, workplace {workplace}, location {location} and job type {type}, then continue.
      - kind: do
        text: Put {description} in the description; add screening questions only if the person gave them.
      - kind: do
        text: If LinkedIn asks for a budget, a card or a promotion, pick the free option or stop and tell the person. Never enter payment details.
    read:
      job: Title, company, location and type as filled in
      cost: Whether this post is free or LinkedIn wants a budget
    stop: Post job
    tags: [hiring, linkedin, jobs]

  # ---- Scheduling links, signatures and admin -----------------------------

  - id: calendly.open_slots
    title: Open times on a Calendly link
    says:
      - What times are open on this Calendly link next week?
      - When can I book a call with the vendor through their Calendly?
      - What slots does my Calendly show for Friday?
    kind: look
    where: any
    region: global
    sites: [calendly.com]
    inputs:
      user: {label: Calendly name, kind: text, hint: "The part right after calendly.com/"}
      event: {label: Event, kind: text, default: "", hint: "The part after the name, like 30min"}
      date: {label: Around, kind: date, default: this week}
    open: https://calendly.com/{user}/{event}
    steps:
      - kind: do
        text: If no event was given, pick the event type whose length fits the request.
      - kind: do
        text: Move to the month of {date} and open the days around it to list the times. Don't book anything.
    read:
      event_type: The event's name and length
      slots: Open days and times near {date}
      time_zone: The time zone the times are shown in
    answer: "{event_type}: open {slots} ({time_zone})."
    tags: [calendly, scheduling, availability]

  - id: docusign.waiting_envelopes
    title: DocuSign envelopes waiting
    says:
      - Do I have anything to sign in DocuSign?
      - Who still hasn't signed the contract we sent?
      - What DocuSign envelopes are waiting on others?
    kind: look
    where: chrome
    region: global
    sites: [app.docusign.com]
    open: https://app.docusign.com/documents
    steps:
      - kind: do
        text: Read the Action Required folder, then Waiting for Others. Look only; never sign, decline, void or resend.
    read:
      action_required: Envelopes waiting for the person's signature, each with subject, sender, sent date and expiry
      waiting_on_others: Envelopes waiting on someone else, each with subject, who hasn't signed and since when
      expiring_soon: Envelopes that expire within a week
    answer: "To sign: {action_required}. Waiting on others: {waiting_on_others}."
    tags: [docusign, contracts, signatures]

  - id: googleadmin.user_lookup
    title: Look up a user in Google Workspace admin
    says:
      - Is the new hire's Google account set up?
      - When did this user last sign in to Google Workspace?
      - Does the contractor account have 2-step verification on?
    kind: look
    where: chrome
    region: global
    sites: [admin.google.com]
    inputs:
      user: {label: User, kind: text, hint: "Name or email address"}
    open: https://admin.google.com/ac/users
    steps:
      - kind: do
        text: Search {user} in the users list and open the account. Look only; never reset a password, suspend, delete or change settings.
    read:
      account: Name, email and organizational unit
      status: Active, suspended or archived
      last_sign_in: Last sign-in time
      two_step: 2-step verification enrollment and enforcement
      licenses: Assigned licenses
      groups: Groups the user belongs to
    answer: "{account} is {status}; last sign-in {last_sign_in}; 2-step {two_step}."
    tags: [admin, workspace, users]
