category: regional
playbooks:

  # ── United States ──────────────────────────────────────────────────────────

  - id: usps.track_package
    title: Where is my USPS package
    says:
      - Where is my USPS package?
      - Track this USPS tracking number for me.
      - When will my USPS parcel arrive?
      - Has my certified mail been delivered?
    kind: look
    where: prefer_chrome
    region: us
    sites: [tools.usps.com]
    inputs:
      tracking: {label: USPS tracking number, kind: text, hint: "Digits (and letters for international), spaces removed"}
    open: https://tools.usps.com/go/TrackConfirmAction?tLabels={tracking}
    read:
      status: The latest status headline (Delivered, In Transit, Out for Delivery, Alert)
      last_event: The newest tracking event with its place and time
      expected: Expected delivery day or window, if shown
    answer: "{status}. Latest: {last_event}. Expected: {expected}."
    tags: [parcel, tracking, post]

  - id: amtrak.train_times
    title: Amtrak trains and fares between two stations
    says:
      - What Amtrak trains go from New York to Washington on Friday?
      - How much is the Amtrak from Boston to New York tomorrow morning?
      - When's the last train from Philadelphia to New York tonight?
    kind: look
    where: prefer_chrome
    region: us
    sites: [amtrak.com]
    inputs:
      origin: {label: From station, kind: place}
      destination: {label: To station, kind: place}
      date: {label: Date, kind: date}
      time: {label: Around, kind: time, required: false, ask: agent}
    open: https://www.amtrak.com/home
    steps:
      - kind: do
        text: Type {origin} in From and {destination} in To, picking each station from the suggestions.
      - kind: do
        text: Choose one-way, set the date {date}, one adult, and press "Find Trains".
      - kind: do
        text: If a time was given, focus on the trains around {time}.
    read:
      trains: Each train's departure and arrival time, name (Acela, Northeast Regional...) and duration
      cheapest: The lowest coach fare and which train it is on
      sold_out: Trains shown as sold out
    tags: [train, rail, tickets]

  - id: zillow.home_search
    title: Homes for sale or rent on Zillow
    says:
      - What houses are for sale in Austin under $500k?
      - Show me 2-bedroom rentals in Denver on Zillow.
      - What's on the market in my zip code right now?
    kind: look
    where: prefer_chrome
    region: us
    sites: [zillow.com]
    inputs:
      area: {label: "City, neighborhood or ZIP", kind: place}
      listing: {label: For, kind: choice, options: [sale, rent], default: sale}
      max_price: {label: Max price (USD), kind: number, required: false, ask: agent}
      beds: {label: Min bedrooms, kind: number, required: false, ask: agent}
    open: https://www.zillow.com/
    steps:
      - kind: do
        text: Type {area} in the search box and press Enter.
      - kind: do
        text: Switch the listing type to "For Sale" or "For Rent" to match {listing}; set the price up to {max_price} and beds {beds}+ if given.
      - kind: do
        text: Sort by Newest.
    read:
      count: How many homes match
      listings: The first 5–8 homes with price, beds, baths, square feet, address and days on Zillow
    needs: [memory]
    tags: [real-estate, homes, rent]

  - id: zillow.zestimate
    title: What a house is worth (Zestimate)
    says:
      - What's the Zestimate for this address?
      - How much is my house worth on Zillow?
      - What would this place rent for, according to Zillow?
      - When did this house last sell and for how much?
    kind: look
    where: prefer_chrome
    region: us
    sites: [zillow.com]
    inputs:
      address: {label: Street address, kind: place}
    open: https://www.zillow.com/
    steps:
      - kind: do
        text: Type {address} in the search box and press Enter; if a list appears, open the home that matches.
    read:
      zestimate: The Zestimate and its range
      rent_zestimate: The Rent Zestimate
      last_sold: Last sale price and date
      facts: Beds, baths, square feet and year built
      status: Whether it is for sale, for rent or off market
    answer: "Zestimate {zestimate}; rent estimate {rent_zestimate}. Last sold {last_sold}."
    needs: [memory]
    tags: [real-estate, valuation]

  - id: recreation.campsite_availability
    title: Free campsites on Recreation.gov
    says:
      - Are there any campsites free at Upper Pines in Yosemite next weekend?
      - Check Recreation.gov availability for Moraine Park, July 10 to 12.
      - Is there a campsite open near the Grand Canyon on Friday?
    kind: look
    where: any
    region: us
    sites: [recreation.gov]
    inputs:
      campground: {label: Campground or park, kind: text}
      arrive: {label: Arriving, kind: date}
      leave: {label: Leaving, kind: date}
    open: https://www.recreation.gov/search?q={campground}
    steps:
      - kind: do
        text: Open the campground (not a permit, tour or day-use pass) that best matches {campground}.
      - kind: do
        text: Open its availability view and set the dates {arrive} to {leave}.
      - kind: do
        text: If nothing is free, note when the booking window for those dates opens, as the page states it.
    read:
      name: The campground's name and the park or forest it is in
      free_sites: Sites free for every night, with site number, loop and type (tent, RV, group)
      price: Nightly fee
      release: When reservations open, if nothing is free
    tags: [camping, national-park, outdoors]

  - id: nps.park_alerts
    title: Alerts and closures at a US national park
    says:
      - Are there any closures in Yosemite right now?
      - Is Going-to-the-Sun Road open in Glacier?
      - Any alerts for Zion this week?
      - Do I need a reservation to drive into Arches?
    kind: look
    where: any
    region: us
    sites: [nps.gov]
    inputs:
      park: {label: Park, kind: text}
      park_code: {label: NPS park code, kind: text, ask: agent, hint: "The four-letter code in nps.gov links, e.g. yose (Yosemite), grca (Grand Canyon), glac (Glacier), arch (Arches)"}
    open: https://www.nps.gov/{park_code}/planyourvisit/conditions.htm
    steps:
      - kind: do
        text: If the page is not found, search nps.gov for {park} and open its "Current Conditions" or "Alerts" page.
    read:
      alerts: Each current alert with its title and what it affects
      closures: Roads, trails and campgrounds closed
      hazards: Fire, smoke, flooding or weather warnings
      reservations: Timed-entry or vehicle reservations in effect
    tags: [national-park, closures, outdoors]

  - id: uscis.case_status
    title: USCIS case status by receipt number
    says:
      - What's the status of my USCIS case?
      - Check my USCIS receipt number.
      - Has my green card application moved?
    kind: look
    where: prefer_chrome
    region: us
    sites: [egov.uscis.gov]
    inputs:
      receipt: {label: Receipt number, kind: text, hint: "13 characters: three letters (EAC, IOE, LIN, MSC, SRC, WAC...) then ten digits"}
    open: https://egov.uscis.gov/
    steps:
      - kind: do
        text: Type {receipt} in "Enter a Receipt Number" and press "Check Status".
      - kind: do
        text: If a robot check appears, hand it to the person and wait.
    read:
      status: The case status headline
      detail: The paragraph under it, with the date of the last action
      form: The form type it names (I-485, I-765, I-130...)
    answer: "{status}: {detail}"
    needs: [memory]
    tags: [immigration, government]

  - id: tsa.what_can_i_bring
    title: Can I take this through US airport security
    says:
      - Can I bring a power bank in my carry-on?
      - Is peanut butter allowed through TSA?
      - Can I pack a pocket knife in checked luggage?
    kind: look
    where: any
    region: us
    sites: [tsa.gov]
    inputs:
      item: {label: Item, kind: text}
    open: https://www.tsa.gov/travel/security-screening/whatcanibring/all
    steps:
      - kind: do
        text: Type {item} in the "What Can I Bring?" search, press Enter and open the closest item.
    read:
      carry_on: Allowed in carry-on bags, with any limits
      checked: Allowed in checked bags, with any limits
      notes: TSA's notes for it (3-1-1 liquids, battery limits, officer's final say)
    answer: "{item}: carry-on {carry_on}; checked {checked}. {notes}"
    tags: [airport, security, flying]

  # ── United Kingdom ─────────────────────────────────────────────────────────

  - id: nationalrail.live_departures
    title: Live train departures from a UK station
    says:
      - When's the next train from Euston to Manchester?
      - Is my 17:32 from Waterloo on time?
      - Live departures from Leeds, please.
      - Are trains from Brighton to London running?
    kind: look
    where: any
    region: gb
    sites: [nationalrail.co.uk]
    inputs:
      from_crs: {label: From station code, kind: text, ask: agent, hint: "Three-letter CRS code the agent works out from the station name, e.g. EUS London Euston, MAN Manchester Piccadilly, LDS Leeds"}
      to_crs: {label: Going to (station code), kind: text, default: "", hint: "Leave empty for every departure"}
    open: https://www.nationalrail.co.uk/live-trains/departures/{from_crs}/{to_crs}
    steps:
      - kind: do
        text: If the page is not found, the code is wrong; correct it from the station name and open it again.
    read:
      departures: The next departures with scheduled time, expected time (On time, Delayed, Cancelled), platform and destination
      disruption: Any disruption notice at the top of the board
    tags: [train, rail, live]

  - id: nationalrail.journey_planner
    title: Plan a UK train journey with times and fares
    says:
      - How much is a train from London to Edinburgh next Saturday?
      - What's the cheapest train from Bristol to Cardiff tomorrow morning?
      - Trains from Oxford to Birmingham arriving by 10 on Monday?
    kind: look
    where: any
    region: gb
    sites: [nationalrail.co.uk]
    inputs:
      origin: {label: From station, kind: place}
      destination: {label: To station, kind: place}
      date: {label: Date, kind: date}
      time: {label: Time, kind: time, default: "09:00"}
      timing: {label: Time is, kind: choice, options: [depart after, arrive by], default: depart after}
      railcard: {label: Railcard, kind: text, default: none}
    open: https://www.nationalrail.co.uk/journey-planner/
    steps:
      - kind: do
        text: Enter {origin} as From and {destination} as To, picking each station from the suggestions.
      - kind: do
        text: Set {date}, "{timing}" {time}, one adult and the railcard ({railcard}) if any; press "Get times & tickets".
      - kind: do
        text: Use "Later trains" if fewer than three options show.
    read:
      journeys: Each option's departure and arrival time, duration and changes
      cheapest: The cheapest fare and its ticket type (Advance, Off-Peak, Anytime)
      operator: The train company for each option
    tags: [train, rail, tickets]

  - id: tfl.journey_planner
    title: Plan a London journey with TfL
    says:
      - How do I get from King's Cross to Canary Wharf by Tube?
      - Fastest way from Heathrow to Paddington?
      - Step-free route from Waterloo to the British Museum?
    kind: look
    where: any
    region: gb
    sites: [tfl.gov.uk]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      when: {label: Leaving, kind: text, default: now, hint: "now, or a day and time"}
      step_free: {label: Step-free only, kind: flag, default: false}
    open: https://tfl.gov.uk/plan-a-journey/
    steps:
      - kind: do
        text: Type {origin} in From and {destination} in To, picking each from the suggestions.
      - kind: do
        text: If leaving is not now, open "Change time" and set {when}; for step-free, choose it under the accessibility options.
      - kind: do
        text: Press "Plan my journey".
    read:
      fastest: The fastest route with total time and lines used (Tube, Elizabeth line, bus, walking)
      legs: Each leg with its line and where to change
      fare: The pay-as-you-go fare, if shown
      disruptions: Disruption warnings on the route
    tags: [transit, london, directions]

  - id: tfl.line_status
    title: Is the Tube running (TfL line status)
    says:
      - Is the Northern line running OK?
      - Any delays on the Tube right now?
      - Is the Elizabeth line part-closed this weekend?
    kind: look
    where: any
    region: gb
    sites: [tfl.gov.uk]
    inputs:
      line: {label: Line, kind: text, default: all lines}
      when: {label: When, kind: choice, options: [now, this weekend], default: now}
    open: https://tfl.gov.uk/tube-dlr-overground/status/
    steps:
      - kind: do
        text: If {when} is "this weekend", switch the status view to the weekend.
    read:
      status: Each line's status (Good service, Minor delays, Part closure...), or just the asked line's
      details: Reason and affected section for any line not on good service
    tags: [transit, london, disruption]

  - id: royalmail.track_parcel
    title: Track a Royal Mail item
    says:
      - Where's my Royal Mail parcel?
      - Track my Royal Mail Special Delivery.
      - Has my signed-for letter arrived?
    kind: look
    where: prefer_chrome
    region: gb
    sites: [royalmail.com]
    inputs:
      tracking: {label: Tracking or reference number, kind: text, hint: "Usually two letters, nine digits and GB"}
    open: https://www.royalmail.com/track-your-item
    steps:
      - kind: do
        text: Reject non-essential cookies, type {tracking} in the tracking box and press "Track".
    read:
      status: The latest status
      events: Tracking events with dates and places
      delivered_to: Who signed for it or where it was left, if delivered
    answer: "{status}."
    tags: [parcel, tracking, post]

  - id: rightmove.property_search
    title: Homes to buy or rent on Rightmove
    says:
      - What 2-bed flats are to rent in Clapham under £2,000?
      - Show me houses for sale in Bath on Rightmove.
      - What's on the market near my postcode?
    kind: look
    where: any
    region: gb
    sites: [rightmove.co.uk]
    inputs:
      area: {label: "Area, town or postcode", kind: place}
      listing: {label: To, kind: choice, options: [buy, rent], default: buy}
      max_price: {label: Max price (GBP), kind: number, required: false, ask: agent}
      beds: {label: Min bedrooms, kind: number, required: false, ask: agent}
    open: https://www.rightmove.co.uk/
    steps:
      - kind: do
        text: Type {area} in the search box, pick the suggestion, and press "For sale" or "To rent" to match {listing}.
      - kind: do
        text: Set the max price {max_price} and min bedrooms {beds} if given, then search.
      - kind: do
        text: Sort by "Newest listed".
    read:
      count: How many properties match
      listings: The first 5–8 with price, bedrooms, type, address and date added or reduced
    needs: [memory]
    tags: [real-estate, homes, rent]

  - id: dvsa.mot_history
    title: MOT history of a UK vehicle
    says:
      - When is the MOT due on my car?
      - Check the MOT history of this car before I buy it.
      - Did this van pass its last MOT?
    kind: look
    where: prefer_chrome
    region: gb
    sites: [check-mot.service.gov.uk]
    inputs:
      reg: {label: Registration number, kind: text}
    open: https://www.check-mot.service.gov.uk/
    steps:
      - kind: do
        text: Type {reg} as the registration number and continue; check the make shown matches the vehicle meant.
    read:
      vehicle: Make, model, colour and fuel type
      expires: MOT expiry date
      last_test: Last test date, result and mileage
      defects: Failures and advisories from recent tests
      mileage: Mileage at each test, noting any drop
    needs: [memory]
    tags: [car, mot, vehicle]

  - id: dvla.vehicle_tax
    title: Is this vehicle taxed (DVLA check)
    says:
      - Is my car taxed?
      - When does the road tax run out on this registration?
      - Is this car SORN?
    kind: look
    where: any
    region: gb
    sites: [vehicleenquiry.service.gov.uk]
    inputs:
      reg: {label: Registration number, kind: text}
    open: https://vehicleenquiry.service.gov.uk/
    steps:
      - kind: do
        text: Type {reg}, continue, and answer "Yes" when it asks if the vehicle shown is the right one.
    read:
      tax: Taxed, Untaxed or SORN, with the tax due date
      mot: MOT valid until
      details: Make, colour, year of manufacture and CO2 emissions
    answer: "Tax: {tax}. MOT: {mot}."
    needs: [memory]
    tags: [car, tax, vehicle]

  - id: companieshouse.company_lookup
    title: Look up a UK company on Companies House
    says:
      - Is this company still trading?
      - Who are the directors of this UK company?
      - When are the accounts due for company 01234567?
      - What's the registered office of Tesco PLC?
    kind: look
    where: any
    region: gb
    sites: [find-and-update.company-information.service.gov.uk]
    inputs:
      company: {label: Company name or number, kind: text}
    open: https://find-and-update.company-information.service.gov.uk/search/companies?q={company}
    steps:
      - kind: do
        text: Open the result that matches; if several do, prefer the active one and say which you chose.
      - kind: do
        text: Read the Overview, then the "People" tab for officers and "Filing history" for recent filings.
    read:
      status: Company status (Active, Dissolved, Liquidation...) and company number
      incorporated: Incorporation date and company type
      address: Registered office address
      business: Nature of business (SIC codes)
      due: Next accounts and confirmation statement due dates
      officers: Current directors and secretary with appointment dates
      psc: Persons with significant control
    tags: [company, register, due-diligence]

  - id: nhs.condition_info
    title: NHS advice on a condition or symptom
    says:
      - What does the NHS say about chickenpox?
      - When should I see a GP about a sore throat?
      - What are the symptoms of shingles?
    kind: look
    where: any
    region: gb
    sites: [nhs.uk]
    inputs:
      condition: {label: Condition or symptom, kind: text}
    open: https://www.nhs.uk/search/results?q={condition}
    steps:
      - kind: do
        text: Open the Health A to Z page that matches {condition}, not news or service listings.
    read:
      symptoms: The main symptoms listed
      self_care: What you can do yourself
      see_gp: When to see a GP or use NHS 111
      urgent: When to call 999 or go to A&E
    tags: [health, nhs]

  # ── Germany ────────────────────────────────────────────────────────────────

  - id: db.connections
    title: Deutsche Bahn connections, delays and prices
    says:
      - Wann fährt der nächste Zug von Berlin nach Hamburg?
      - What trains go from Munich to Frankfurt tomorrow morning?
      - Is the ICE from Cologne to Berlin delayed?
      - How much is a Sparpreis from Stuttgart to Berlin on Friday?
    kind: look
    where: any
    region: de
    sites: [bahn.de]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date, required: false, ask: agent, hint: "Today if not given"}
      time: {label: Time, kind: time, required: false, ask: agent, hint: "Now if not given"}
    open: https://www.bahn.de/buchung/fahrplan/suche
    steps:
      - kind: do
        text: Decline optional cookies. Type {origin} in "Von" and {destination} in "Nach", picking each station from the list.
      - kind: do
        text: Set the date {date} and time {time} (today and now if not given) and press "Suchen".
      - kind: do
        text: Use "Spätere Verbindungen" until at least four connections show.
    read:
      connections: Each connection's departure, arrival, duration, changes and train types (ICE, IC, RE)
      delays: Real-time delays, cancellations and their reasons
      price: The cheapest price per connection (Sparpreis, Flexpreis), if shown
    tags: [train, rail, tickets]

  - id: immoscout24.property_search
    title: Flats and houses on ImmobilienScout24
    says:
      - Find 2-room flats to rent in Leipzig under 900 euros.
      - Wohnung mieten in München Schwabing, was gibt es?
      - Houses for sale near Hamburg on ImmoScout.
    kind: look
    where: prefer_chrome
    region: de
    sites: [immobilienscout24.de]
    inputs:
      area: {label: City or district, kind: place}
      listing: {label: To, kind: choice, options: [rent, buy], default: rent}
      type: {label: Type, kind: choice, options: [flat, house], default: flat}
      max_price: {label: Max price (EUR), kind: number, required: false, ask: agent}
      rooms: {label: Min rooms, kind: number, required: false, ask: agent}
    open: https://www.immobilienscout24.de/
    steps:
      - kind: do
        text: Decline optional cookies. Choose "Mieten" or "Kaufen" for {listing} and "Wohnung" or "Haus" for {type}.
      - kind: do
        text: Type {area} in the location field, pick the suggestion and search.
      - kind: do
        text: Set "Preis bis" {max_price} and "Zimmer ab" {rooms} if given; sort by newest.
    read:
      count: Number of results
      listings: The first 5–8 with price (Kaltmiete or Kaufpreis), rooms, m², district and listing date
    tags: [real-estate, rent, flat]

  - id: mobilede.car_search
    title: Used cars on mobile.de
    says:
      - Find a used VW Golf under 15,000 euros on mobile.de.
      - What does a 2019 BMW 320d cost in Germany?
      - Gebrauchter Tesla Model 3 unter 30.000 Euro?
    kind: look
    where: prefer_chrome
    region: de
    sites: [mobile.de]
    inputs:
      make: {label: Make, kind: text}
      model: {label: Model, kind: text}
      max_price: {label: Max price (EUR), kind: number, required: false, ask: agent}
      year_from: {label: First registered from (year), kind: number, required: false, ask: agent}
      max_km: {label: Max mileage (km), kind: number, required: false, ask: agent}
    open: https://www.mobile.de/
    steps:
      - kind: do
        text: Decline optional cookies. In the quick search pick {make} and {model}; set "Preis bis" {max_price}, "Erstzulassung ab" {year_from} and "Kilometer bis" {max_km} if given.
      - kind: do
        text: Press the results button ("... Angebote"), then sort by price ascending.
    read:
      count: Number of offers
      listings: The first 5–8 with price, first registration, mileage, power, fuel, dealer or private, and location
      price_rating: mobile.de's price rating for each (Sehr guter Preis, Guter Preis, Fairer Preis...)
    tags: [car, used, classifieds]

  - id: dhlpaket.track_parcel
    title: Track a DHL Paket or Deutsche Post item in Germany
    says:
      - Wo ist mein DHL Paket?
      - Track my German DHL parcel.
      - Is my Einschreiben delivered yet?
      - When will my DHL package arrive at the Packstation?
    kind: look
    where: any
    region: de
    sites: [dhl.de]
    inputs:
      tracking: {label: Sendungsnummer, kind: text, hint: "Often 12 or 20 digits, or starts with JJD; Einschreiben start with letters"}
    open: https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode={tracking}
    steps:
      - kind: do
        text: Decline optional cookies. If details need the recipient's postcode, ask the person for it.
    read:
      status: The current status and the step on the progress bar
      events: Recent events with date, time and place
      eta: Expected delivery day or time window
      pickup: The Packstation, Filiale or neighbour it went to, if not delivered at the door
    answer: "{status}. Expected: {eta}."
    tags: [parcel, tracking, post]

  - id: northdata.company_lookup
    title: German company facts on North Data
    says:
      - Who runs this GmbH?
      - What's the revenue of this German company?
      - Find the Handelsregister entry for this company.
      - Is this German company in insolvency?
    kind: look
    where: any
    region: de
    sites: [northdata.de]
    inputs:
      company: {label: Company name, kind: text}
      city: {label: City, kind: text, required: false, ask: agent}
    open: https://www.northdata.de/search?query={company}
    steps:
      - kind: do
        text: Open the result that matches (use {city} to tell same-named companies apart) and say which one you chose.
    read:
      register: Register court and number (e.g. Amtsgericht München HRB 12345) and legal form
      status: Active, in liquidation or insolvency, with dates
      address: Registered address
      management: Current Geschäftsführer or Vorstand
      financials: Latest published revenue, balance-sheet total, earnings and employees, with the year
      history: Latest Handelsregister announcements
    tags: [company, register, due-diligence]

  - id: berlin.buergeramt_appointment
    title: Book a Berlin Bürgeramt appointment
    says:
      - Get me a Bürgeramt appointment for my Anmeldung in Berlin.
      - Find the earliest Termin to register my address in Berlin.
      - Book a Berlin appointment to apply for a new Personalausweis.
    kind: act
    where: chrome
    region: de
    sites: [service.berlin.de]
    inputs:
