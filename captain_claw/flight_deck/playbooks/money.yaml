  - id: irs.filing_deadlines
    title: US federal tax deadlines
    says:
      - When are US taxes due this year?
      - When is the next estimated tax payment due?
      - What's the filing deadline if I get an extension?
      - When are 1099s due for my business?
    kind: look
    where: any
    region: us
    sites: [irs.gov]
    inputs:
      who: {label: For, kind: choice, options: [individual, business], default: individual}
    open: https://www.irs.gov/filing/individuals/when-to-file
    steps:
      - kind: do
        text: For business dates (payroll, 1099s, estimated tax by entity type), open the IRS Tax Calendar at https://www.irs.gov/businesses/small-businesses-self-employed/online-tax-calendar and read the coming ones.
    read:
      filing_deadline: The return due date for the tax year
      extension_deadline: The due date with an extension, and the note that tax owed is still due on the original date
      estimated_payments: The quarterly estimated-tax due dates
      business_dates: The next business deadlines, if who is business
    answer: "Returns are due {filing_deadline} ({extension_deadline} with an extension). Estimated tax: {estimated_payments}."
    tags: [tax, deadlines, calendar]

  # --- The person's own accounts (read only) ---------------------------------

  - id: card.statement_summary
    title: Read my latest credit card statement
    says:
      - How much is my credit card bill and when is it due?
      - What's the minimum payment on my Amex?
      - What were the biggest charges on my last card statement?
    kind: look
    where: chrome
    region: global
    inputs:
      site: {label: Card issuer's site, kind: url, hint: "The issuer's sign-in or statements page, e.g. the person's bookmarked Amex or Chase page"}
    open: "{site}"
    steps:
      - kind: do
        text: Check the page is {site}, the address the person gave; if they only know the issuer's name, ask them for the address (or find it and confirm the domain with them) — never follow a search ad to a sign-in page.
      - kind: do
        text: If a sign-in page shows, hand it to the person to sign in; never type a password, card number or one-time code.
      - kind: do
        text: Open Statements and read the latest one. Only read; never open Pay, Transfer or autopay settings.
    read:
      period: The statement period and closing date
      statement_balance: The statement balance
      minimum_due: The minimum payment due
      due_date: The payment due date
      current_balance: The current balance and available credit, if shown
      largest_charges: The five largest charges on the statement, each with date, merchant and amount
    answer: "Statement for {period}: {statement_balance}, minimum {minimum_due}, due {due_date}."
    tags: [credit-card, statement, bills]

  - id: wise.balances
    title: My Wise balances
    says:
      - How much do I have in my Wise account?
      - What's my Wise euro balance?
      - Has the client's transfer landed in Wise yet?
    kind: look
    where: chrome
    region: global
    sites: [wise.com]
    inputs:
      search: {label: Look for, kind: text, required: false, ask: agent, hint: "A sender or amount to find in recent activity"}
    open: https://wise.com/home
    steps:
      - kind: do
        text: If Wise shows a sign-in page, hand it to the person to sign in; never type a password or code.
      - kind: do
        text: If {search} was given, look for it in the recent transactions. Only read; never open Send, Convert or Add money.
    read:
      balances: Each currency balance with its amount
      total: The total the page shows and its currency
      recent: The latest transactions, each with date, description, amount and status
      match: The transaction matching {search}, if one was asked for
    answer: "Wise: {balances} (total {total})."
    tags: [wise, balance]

  - id: stripe.open_invoices
    title: Unpaid invoices and their due dates in Stripe
    says:
      - Which invoices are still unpaid in Stripe?
      - What's overdue in Stripe?
      - When is the invoice for Acme due?
    kind: look
    where: chrome
    region: global
    sites: [dashboard.stripe.com]
    inputs:
      customer: {label: Customer, kind: text, required: false, ask: agent}
    open: https://dashboard.stripe.com/invoices
    steps:
      - kind: do
        text: If Stripe shows a sign-in page, hand it to the person to sign in; never type a password or code.
      - kind: do
        text: Filter to the Open and Past due invoices; if {customer} was given, search for that customer.
      - kind: do
        text: Only read; never send, finalize, void or mark an invoice paid.
    read:
      past_due: Past-due invoices, each with customer, amount, due date and days overdue
      open_not_due: Open invoices not yet due, each with customer, amount and due date
      total_outstanding: The total outstanding, as shown or summed from the rows
    answer: "Past due: {past_due}. Coming due: {open_not_due}. Outstanding in all: {total_outstanding}."
    tags: [invoices, accounts-receivable, due-dates]
