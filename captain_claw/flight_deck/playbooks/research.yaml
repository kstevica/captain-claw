category: research
playbooks:
  # ── People and meetings ──────────────────────────────────────────────

  - id: linkedin.person_brief
    title: Brief me on a person before a meeting
    says:
      - Brief me on the person I'm meeting at 2 pm.
      - Who is our new client contact at Siemens? Check their LinkedIn.
      - Give me a quick background on the CFO I'm meeting tomorrow.
      - What should I know about the investor I'm calling later?
    kind: look
    where: chrome
    region: global
    sites: [linkedin.com, google.com]
    inputs:
      name: {label: Person's name, kind: text}
      company: {label: Their company, kind: text, default: "", hint: "Narrows the search when the name is common"}
      purpose: {label: What the meeting is about, kind: text, required: false, ask: agent}
    open: https://www.linkedin.com/search/results/people/?keywords={name}%20{company}
    steps:
      - kind: do
        text: Open the profile whose current company and location fit; if two or more fit, ask the person which with ask_user.
      - kind: do
        text: Read the headline, About, Experience and Education, then the last few posts under Activity.
      - kind: open
        url: https://www.google.com/search?q={name}%20{company}
        note: Talks, interviews, articles and press quotes from the last two years.
      - kind: do
        text: Keep to professional facts; leave out family, home, health and personal social accounts.
    read:
      headline: Their current title and company
      tenure: How long in the current role and at the company
      previous_roles: The two or three roles before, with years
      education: Schools and degrees listed
      location: City or region on the profile
      common_ground: Mutual connections, shared employers or schools with the person
      recent_activity: What they posted or reshared lately, a line each
      web_mentions: Talks, interviews or news that mention them in their work role
      talking_points: Two or three openers tied to what the meeting is about
    answer: "{headline}, {tenure} in the role. Before: {previous_roles}. Lately: {recent_activity}"
    tags: [meeting-prep, people, linkedin]

  - id: calendar.meeting_briefs
    title: Brief me on everyone I'm meeting
    says:
      - Brief me on everyone I'm meeting tomorrow.
      - Who are the outside people on my calendar this week?
      - Prep me for tomorrow's meetings — who are they and what do their companies do?
    kind: look
    where: chrome
    region: global
    sites: [calendar.google.com, linkedin.com]
    inputs:
      day: {label: Which day, kind: date, required: false, ask: agent, hint: "Tomorrow unless the person says otherwise"}
      only_external: {label: Only people outside my company, kind: flag, default: true}
    open: https://calendar.google.com/calendar/r/day
    steps:
      - kind: do
        text: Go to {day}; open each meeting and note its time, title and guest list.
      - kind: do
        text: If only_external, drop guests on the person's own email domain, rooms and group addresses.
      - kind: do
        text: For each guest left, search LinkedIn people with their name and company (from the email domain) and read the matching profile's headline and tenure.
      - kind: do
        text: For each company, take one line on what it does from its website or LinkedIn page.
    read:
      meetings: Each meeting's time and title
      people: Each guest's name, title, company, time in role and one useful fact
      companies: One line per company on what it does and its size
      unmatched: Guests who could not be matched with confidence
    needs: [calendar]
    tags: [meeting-prep, calendar, people]

  # ── Companies ────────────────────────────────────────────────────────

  - id: web.company_brief
    title: Brief me on a company
    says:
      - Give me a one-page brief on Datadog.
      - What does Celonis do and how big are they?
      - I have a call with Personio next week, what should I know about them?
      - Who runs Wise, how big is it, and what's been in the news?
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com, linkedin.com]
    inputs:
      company: {label: Company, kind: text}
    open: https://www.google.com/search?q={company}
    steps:
      - kind: do
        text: Open the company's own website (not ads or directories) and read the home and About pages.
      - kind: open
        url: https://www.linkedin.com/search/results/companies/?keywords={company}
        note: Open the matching company page; read industry, size, headquarters and the last few posts.
      - kind: open
        url: https://www.google.com/search?q={company}&tbm=nws&tbs=qdr:m
        note: News from the last month.
    read:
      what_they_do: What they sell and to whom, in two sentences
      founded: Year founded
      headquarters: Head office city and country
      size: Employee range from LinkedIn, plus revenue if public
      leadership: CEO and founders as the site or LinkedIn lists them
      customers: Named customers or the segments they target
      ownership: Public with ticker, owned by a group, or VC-backed
      recent_news: The top three headlines of the last month, with date and outlet
    answer: "{company}: {what_they_do} HQ {headquarters}, {size}. News: {recent_news}"
    tags: [company, brief, due-diligence]

  - id: crunchbase.funding
    title: How much funding a startup has raised
    says:
      - How much has Mistral AI raised so far?
      - Who invested in Notion and when was their last round?
      - Pull the funding history for this startup from Crunchbase.
    kind: look
    where: prefer_chrome
    region: global
    sites: [crunchbase.com]
    inputs:
      company: {label: Company, kind: text}
    open: https://www.crunchbase.com/
    steps:
      - kind: type
        note: The search box at the top of the page
        value: "{company}"
      - kind: do
        text: Open the organization whose website matches; then its Financials section.
      - kind: do
        text: If a sign-up wall hides part of the page, read only what is visible and say so.
    read:
      total_funding: Total funding amount
      last_round: Last round's type, amount, date and lead investors
      rounds: Earlier rounds with date and amount
      investors: The best-known investors listed
      acquisitions: Companies it bought, or who bought it
      headcount: Employee range shown
      similar: Similar companies Crunchbase lists
    answer: "{company} has raised {total_funding}; last round {last_round}."
    tags: [company, funding, startups]

  - id: opencorporates.entities
    title: Find a company's legal entities across countries
    says:
      - Which legal entities does Siemens have registered around the world?
      - Find the registered company behind this brand and its company number.
      - Is Unilever's Dutch entity still active?
    kind: look
    where: prefer_chrome
    region: global
    sites: [opencorporates.com]
    inputs:
      company: {label: Company name, kind: text}
      country: {label: Country, kind: text, required: false, ask: agent}
    open: https://opencorporates.com/companies?q={company}
    steps:
      - kind: do
        text: If a country was named, filter by its jurisdiction on the left; otherwise note how many matches each jurisdiction has.
      - kind: do
        text: Open the main entity, or each one the person asks about, and read its registry page.
    read:
      entities: Each match's name, jurisdiction, company number, status and incorporation date
      registered_address: The main entity's registered address
      officers: Directors and officers listed, with roles
      source: Which official registry the data came from and when it was last updated
    tags: [company, registry, entities]

  - id: sec.annual_report
    title: Highlights of a company's latest 10-K
    says:
      - What did Nvidia's latest 10-K say about revenue and risks?
      - Pull the key numbers from Apple's last annual report.
      - How many employees does Coca-Cola report in its 10-K?
    kind: look
    where: prefer_chrome
    region: us
    sites: [sec.gov]
    inputs:
      company: {label: Company, kind: text}
    open: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company={company}&type=10-K
    steps:
      - kind: do
        text: If a list of companies comes up, open the one that matches (check state and industry); if unsure, ask the person with ask_user.
      - kind: do
        text: Open the newest 10-K, then its main document (not the exhibits).
      - kind: do
        text: Read Item 1 Business, the Item 1A risk headings, Item 7 MD&A and the income statement in Item 8.
    read:
      fiscal_year: The fiscal year the report covers
      revenue: Total revenue and its change from the year before
      net_income: Net income and its change
      segments: Revenue by segment or region
      employees: Headcount stated in Item 1
      top_risks: The three to five headline risk factors
      outlook: What MD&A says about trends and the year ahead
      filing_link: Link to the filing
    answer: "{company} FY{fiscal_year}: revenue {revenue}, net income {net_income}. Top risks: {top_risks}"
    tags: [sec, filings, annual-report]

  - id: sec.recent_filings
    title: What a public company filed lately
    says:
      - Has Boeing filed any 8-Ks this month?
      - What did Tesla report to the SEC lately?
      - Show me Microsoft's latest quarterly filing.
    kind: look
    where: prefer_chrome
    region: us
    sites: [sec.gov]
    inputs:
      company: {label: Company, kind: text}
      form: {label: Filing type, kind: choice, options: [8-K, 10-Q, DEF 14A, S-1], default: 8-K}
    open: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company={company}&type={form}
    steps:
      - kind: do
        text: If a list of companies comes up, open the one that matches.
      - kind: do
        text: Open the newest five filings; for an 8-K read the item numbers and the attached press release headline.
    read:
      filings: Each filing's date, form and one line on what it says
      material: Anything material — leadership change, deal, guidance, restatement
      links: Links to the filings read
    answer: "Latest {form} filings for {company}: {filings}"
    tags: [sec, filings]

  - id: wikipedia.quick_facts
    title: Quick facts from Wikipedia
    says:
      - When was Bosch founded and how many people work there?
      - What's the population of Lagos?
      - Give me the key facts about the Treaty of Lisbon.
      - Who owns Ray-Ban?
    kind: look
    where: any
    region: global
    sites: [en.wikipedia.org]
    inputs:
      topic: {label: Topic, kind: text}
      question: {label: What to find out, kind: text, required: false, ask: agent}
    open: https://en.wikipedia.org/wiki/Special:Search?search={topic}
    steps:
      - kind: do
        text: If search results or a disambiguation page come up, open the article that matches.
      - kind: do
        text: Read the infobox and the lead; for the question asked, find the section that answers it.
    read:
      summary: The lead in two sentences
      facts: Key infobox facts, each with its year
      answer_text: The sentence that answers the question, with its footnote source
      article: The article's title and link
    tags: [facts, encyclopedia]

  # ── Pricing and vendors ──────────────────────────────────────────────

  - id: web.pricing_table
    title: Turn a pricing page into a table
    says:
      - What does Intercom cost? Put their plans in a table.
      - Grab our competitor's pricing page as a table.
      - What's on each of Figma's plans?
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com]
    inputs:
      product: {label: Product, kind: text}
      billing: {label: Billing, kind: choice, options: [monthly, annual], default: monthly}
    open: https://www.google.com/search?q={product}%20pricing
    steps:
      - kind: do
        text: Open the official pricing page on the vendor's own domain, not a review site.
      - kind: do
        text: Set the billing toggle to {billing} if there is one; expand "Compare all features".
      - kind: do
        text: Note the currency and whether prices are per user, per seat, per use or flat.
    read:
      plans: Each plan's name, price, unit and billing
      limits: Each plan's main limits — users, usage, storage
      differences: What each plan adds over the one below
      free_option: Free plan or trial, and how long
      enterprise: Whether the top tier is "contact sales"
      page_url: The pricing page's link
    answer: "{product} ({billing}): {plans}"
    tags: [pricing, competitors, table]

  - id: web.compare_vendors
    title: Compare several vendors' pricing
    says:
      - Compare Asana, Monday and ClickUp pricing for a 15-person team.
      - Which is cheapest for 10 agents — Zendesk, Freshdesk or Help Scout?
      - Put HubSpot, Pipedrive and Zoho CRM pricing side by side.
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com]
    inputs:
      vendors: {label: Vendors, kind: text, hint: "Two to six names, comma separated"}
      seats: {label: Team size, kind: number, default: 10, min: 1}
      must_have: {label: Must-have features, kind: text, default: ""}
    open: https://www.google.com/
    steps:
      - kind: do
        text: For each of {vendors}, search "<vendor> pricing" and open its official pricing page.
      - kind: do
        text: Read all on the same billing basis, and work out the monthly cost for {seats} users on the cheapest plan that has {must_have}.
      - kind: do
        text: Note what changes the math — minimum seats, add-ons, usage fees, annual-only prices.
    read:
      table: One row per vendor — plan picked, list price, unit, monthly cost for the team
      cheapest: The cheapest vendor and plan that meets the needs
      caveats: Minimum seats, add-on fees, annual-only discounts
      sources: Each pricing page's link
    answer: "Cheapest for {seats} users: {cheapest}. Watch for: {caveats}"
    tags: [pricing, vendors, comparison]

  - id: web.similar_companies
    title: Find companies similar to one
    says:
      - Who are Gong's main competitors?
      - Find companies like Deel.
      - What are the alternatives to Airtable?
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com]
    inputs:
      company: {label: Company or product, kind: text}
      count: {label: How many, kind: number, default: 8, min: 1}
    open: https://www.google.com/search?q={company}%20competitors%20alternatives
    steps:
      - kind: do
        text: Collect names from comparison pages, the vendor's own "vs" pages and G2 or Capterra alternatives lists; skip listicles that copy each other.
      - kind: do
        text: Open the top {count} candidates' sites and note what each sells and to whom.
    read:
      companies: Each one's name, website, what it does and how it differs
      closest: The two or three most direct competitors
      segments: How the field splits — by size, price or focus
    answer: "Closest to {company}: {closest}."
    tags: [competitors, market-map]

  - id: web.contact_page
    title: Find a company's contact or press page
    says:
      - How do I reach Spotify's press team?
      - Find the sales contact for Atlassian.
      - What's the support email for Canva?
    kind: look
    where: prefer_chrome
    region: global
    sites: [google.com]
    inputs:
      company: {label: Company, kind: text}
      purpose: {label: Which contact, kind: choice, options: [general, press, sales, support, partnerships, investors], default: general}
    open: https://www.google.com/search?q={company}%20{purpose}%20contact
    steps:
      - kind: do
        text: Open the company's own Contact, Press or Newsroom page; skip directories and data brokers.
      - kind: do
        text: Check the site footer too ("Contact", "Press", "Media", "Investors"); take only contact points the company publishes.
    read:
      email: The published address for that purpose
      phone: The published phone number
      form: Link to the contact form when there is no email
      address: Head office address
      page_url: The page it came from
    answer: "{company} ({purpose}): {email} {phone} — {page_url}"
    tags: [contact, press, company]

  # ── Websites and domains ─────────────────────────────────────────────

  - id: builtwith.tech_stack
    title: What a website is built with
    says:
      - What tech stack does allbirds.com use?
      - Is this competitor's site on Shopify or WooCommerce?
      - Which analytics and CRM tools does hubspot.com run?
    kind: look
    where: prefer_chrome
    region: global
    sites: [builtwith.com, wappalyzer.com]
    inputs:
      domain: {label: Website, kind: text, hint: "Just the domain, like example.com"}
    open: https://builtwith.com/{domain}
    steps:
      - kind: do
        text: Read the technology groups — analytics, CMS, frameworks, hosting, payments, marketing.
      - kind: open
        url: https://www.wappalyzer.com/lookup/{domain}/
        note: A second opinion, or the fallback when BuiltWith shows little; free results may be partial.
    read:
      cms: CMS or site builder
      frameworks: Front-end and back-end frameworks
      analytics: Analytics and tag managers
      hosting: Host and CDN
      commerce: E-commerce platform and payment providers
      marketing: Email, chat, CRM and ad pixels
    answer: "{domain} runs on {cms} / {frameworks}, hosted on {hosting}; analytics: {analytics}."
    tags: [tech-stack, website, competitors]

  - id: icann.domain_lookup
    title: Who registered a domain and when it expires
    says:
      - Who owns the domain acme-widgets.com?
      - When does example.org expire?
      - How old is this website's domain?
    kind: look
    where: any
    region: global
    sites: [lookup.icann.org]
    inputs:
      domain: {label: Domain, kind: text}
    open: https://lookup.icann.org/en/lookup?name={domain}
    steps:
      - kind: do
        text: Wait for the registration data to load; where the registry redacts fields, say "redacted" rather than guess.
    read:
      registrar: The registrar
      created: Creation date
      expires: Expiry date
      updated: Last updated date
      status: Domain status codes
      registrant: Registrant organization or country, if shown
      name_servers: Name servers
    answer: "{domain}: registered {created} via {registrar}, expires {expires}. Registrant: {registrant}."
    tags: [domain, whois, rdap]

  - id: wayback.old_version
    title: See how a page looked in the past
    says:
      - What did Stripe's homepage look like in 2015?
      - When was this page first archived?
      - Show me our competitor's pricing page from a year ago.
    kind: look
    where: any
    region: global
    sites: [web.archive.org]
    inputs:
      page: {label: Page, kind: text, hint: "A domain or a full address"}
      when: {label: Around when, kind: date, required: false, hint: "Empty for the first capture"}
    open: https://web.archive.org/web/*/{page}
    steps:
      - kind: do
        text: Read the capture count and the first and last capture dates above the calendar.
      - kind: do
        text: Pick the year and day nearest {when} (or the first capture) and open that snapshot.
    read:
      captures: How many times the page was archived
      first_capture: Date of the first capture
      snapshot_date: Date of the snapshot opened
      snapshot_url: Its link
      what_it_shows: Headline, offer, prices or claims on that version
    answer: "Archived {captures} times since {first_capture}. On {snapshot_date}: {what_it_shows} ({snapshot_url})"
    tags: [archive, history, website]

  - id: wayback.what_changed
    title: What changed on a page since a date
    says:
      - What has changed on Notion's pricing page since January?
      - Did our competitor change their homepage claims since last quarter?
      - Compare this terms-of-service page with the version from 2023.
    kind: look
    where: any
    region: global
    sites: [web.archive.org]
    inputs:
      page: {label: Page, kind: text, hint: "A full address"}
      since: {label: Since, kind: date}
    open: https://web.archive.org/web/*/{page}
    steps:
      - kind: do
        text: Open the capture nearest {since}; note its headline, sections, prices and claims.
      - kind: do
        text: Open the live page (or the latest capture if the live one is walled) and read the same parts.
      - kind: do
        text: Compare them section by section; the Wayback "Changes" view can highlight text differences between two captures.
    read:
      then: The old capture's date and what it said
      added: What is new
      removed: What is gone
      changed: Prices, plan names, numbers or claims that differ
      old_url: Link to the old capture
    answer: "Since {since}: added {added}; removed {removed}; changed {changed}."
    tags: [archive, changes, competitors]

  # ── Papers and patents ───────────────────────────────────────────────

  - id: scholar.papers_on_topic
    title: Key papers on a topic
    says:
      - Find the most cited papers on retrieval-augmented generation.
      - What's the research on four-day work weeks and productivity?
      - Papers on perovskite solar cell stability since 2022.
    kind: look
    where: prefer_chrome
    region: global
    sites: [scholar.google.com]
    inputs:
      topic: {label: Topic, kind: text}
      since_year: {label: From year, kind: number, default: ""}
    open: https://scholar.google.com/scholar?q={topic}&as_ylo={since_year}
    steps:
      - kind: do
        text: Read the first page of results; open a "[PDF]" link only when the snippet doesn't say what the paper found.
    read:
      papers: Top ten — title, authors, year, venue, citation count
      most_cited: The most cited of them
      recent: The most relevant from the last two years
      pdf_links: Free full-text links shown
    answer: "Most cited: {most_cited}. Recent: {recent}."
    tags: [papers, academic, literature]

  - id: scholar.cited_by
    title: Who cites a paper
    says:
      - Who has cited "Attention Is All You Need" recently?
      - How many citations does this paper have, and what built on it?
      - Find newer work that cites this study.
    kind: look
    where: prefer_chrome
    region: global
    sites: [scholar.google.com]
    inputs:
      paper: {label: Paper title, kind: text}
    open: https://scholar.google.com/scholar?q={paper}
    steps:
      - kind: do
        text: Find the result whose title and authors match.
      - kind: click
        target: {role: link, name: Cited by}
        note: The "Cited by N" link under that result
      - kind: do
        text: Pick a recent year range on the left to see the newest citing work.
    read:
      citations: Total citation count
      newest_citing: The five newest citing papers, with year and venue
      most_cited_citing: The most cited papers that cite it
      themes: What the citing work uses it for, from titles and snippets
    answer: "Cited {citations} times. Newest: {newest_citing}."
    tags: [papers, citations, academic]

  - id: semanticscholar.paper_summary
    title: What a paper is about, in short
    says:
      - Give me the TL;DR of the paper "Denoising Diffusion Probabilistic Models".
      - What's this paper about and how influential is it?
      - Is there a free PDF of this study?
    kind: look
    where: prefer_chrome
    region: global
    sites: [semanticscholar.org]
    inputs:
      paper: {label: Paper title, kind: text}
    open: https://www.semanticscholar.org/search?q={paper}
    steps:
      - kind: do
        text: Open the matching paper; read its TLDR, abstract and citation panel.
    read:
      tldr: The one-line TLDR
      authors_year: Authors, year and venue
      citations: Citation count and highly influential citations
      key_references: The main papers it builds on
      pdf: Open-access PDF link, if any
    answer: "{tldr} ({authors_year}; {citations} citations)."
    tags: [papers, summary, academic]

  - id: arxiv.latest_papers
    title: Newest arXiv papers on a topic
    says:
      - What's new on arXiv about speculative decoding?
      - Latest preprints on quantum error correction.
      - Any new papers this week on robot manipulation?
    kind: look
    where: any
    region: global
    sites: [arxiv.org]
    inputs:
      topic: {label: Topic, kind: text}
      count: {label: How many, kind: number, default: 10, min: 1}
    open: https://arxiv.org/search/?query={topic}&searchtype=all&order=-announced_date_first
    steps:
      - kind: do
        text: Read the newest {count} results; open the abstract page of any whose title is unclear.
    read:
      papers: Each paper's title, authors, date, arXiv ID and category
      gist: One line per paper on what it does
      links: The abstract page links
    tags: [papers, preprints, arxiv]

  - id: pubmed.search_studies
    title: What studies say on a health topic
    says:
      - What do studies say about intermittent fasting and blood pressure?
      - Find recent reviews on vitamin D and depression.
      - Any clinical trials on GLP-1 drugs and alcohol use?
    kind: look
    where: any
    region: global
    sites: [pubmed.ncbi.nlm.nih.gov]
    inputs:
      topic: {label: Topic, kind: text}
      study_type: {label: Kind of study, kind: choice, options: [any, review, clinical trial, meta-analysis], default: any}
    open: https://pubmed.ncbi.nlm.nih.gov/?term={topic}
    steps:
      - kind: do
        text: Unless study_type is any, tick it under Article type; for the latest work set Sort by to Most recent.
      - kind: do
        text: Read the top ten abstracts' conclusions; report what studies found, not medical advice.
    read:
      studies: Top ten — title, journal, year, study type
      findings: One line from each abstract's conclusion
      reviews: Systematic reviews or meta-analyses on the first page
      free_full_text: Which have free full text
    tags: [health, studies, medical-research]

  - id: patents.prior_art
    title: Search patents for prior art
    says:
      - Are there patents on a foldable bike helmet?
      - Search prior art for wireless charging through furniture.
      - Who holds patents on solid-state battery separators?
    kind: look
    where: any
    region: global
    sites: [patents.google.com]
    inputs:
      idea: {label: The invention in keywords, kind: text}
      before: {label: Filed before, kind: date, required: false, ask: agent}
    open: https://patents.google.com/?q={idea}
    steps:
      - kind: do
        text: If a date was given, set the Before filter to priority date {before}.
      - kind: do
        text: Read the top ten; open the three closest and read the abstract and first claim.
      - kind: do
        text: Try two rephrasings with synonyms, since patents use odd terms. Say this is a search, not a legal opinion.
    read:
      patents: Close matches — number, title, assignee, priority date, status
      closest: The three nearest and what their first claim covers
