category: travel
playbooks:
  # ── Directions and road trips ──────────────────────────────────────────

  - id: maps.travel_time
    title: How long from A to B
    says:
      - How long does it take to get from Zagreb to Split?
      - How far is the airport from here by car right now?
      - How long by train from Vienna to Graz?
    kind: look
    where: any
    region: global
    sites: [google.com/maps]
    inputs:
      origin: {label: From, kind: place, hint: "An address, a place name, or 'here' for the person's location"}
      destination: {label: To, kind: place}
      mode: {label: How, kind: choice, options: [driving, transit, walking, bicycling], default: driving}
      depart_at: {label: Leaving at, kind: time, required: false, ask: agent}
    open: https://www.google.com/maps/dir/?api=1&origin={origin}&destination={destination}&travelmode={mode}
    steps:
      - kind: do
        text: If depart_at was given, open the "Leave now" menu, pick "Depart at" and set {depart_at} before reading.
    read:
      duration: The fastest route's time, with traffic as Maps shows it
      distance: That route's distance
      route: The road or line it takes
      alternatives: The other routes Maps offers, each with its time
    answer: "{duration} by {mode} via {route} ({distance})."
    needs: [location]
    tags: [directions, traffic, commute]

  - id: maps.multi_stop_route
    title: Road trip with stops on the way
    says:
      - Plan a drive from Munich to Rome via Innsbruck and Verona.
      - How long is Zagreb to Plitvice to Zadar to Split by car?
      - Map a route from Ljubljana with stops at Lake Bled and Bohinj.
      - What's the total driving time if we stop in Lyon on the way to Barcelona?
    kind: look
    where: any
    region: global
    sites: [google.com/maps]
    inputs:
      origin: {label: Start, kind: place}
      destination: {label: End, kind: place}
      stops: {label: Stops on the way, kind: text, hint: "Places in visiting order, separated by |, e.g. Innsbruck|Verona"}
      mode: {label: How, kind: choice, options: [driving, walking, bicycling], default: driving}
    open: https://www.google.com/maps/dir/?api=1&origin={origin}&destination={destination}&waypoints={stops}&travelmode={mode}
    steps:
      - kind: do
        text: Check every stop landed on the right place (not a same-named town elsewhere); fix any wrong one in its box.
      - kind: do
        text: Open the route's "Details" to read the time and distance of each leg.
    read:
      total_time: Total driving time for the whole trip, without breaks
      total_distance: Total distance
      legs: Each leg (from → to) with its time and distance
      tolls: Whether Maps says the route has tolls or crosses borders
    answer: "{total_time} in all ({total_distance}). Legs: {legs}."
    tags: [directions, road-trip]

  - id: maps.transit_journey
    title: Which bus or train to take
    says:
      - Which bus do I take from Lisbon airport to Rossio?
      - How do I get to the Louvre from Gare du Nord by metro?
      - When's the next train from Schiphol to Amsterdam Centraal?
      - I need to be at the Colosseum by 9, which tram should I catch?
    kind: look
    where: any
    region: global
    sites: [google.com/maps]
    inputs:
      origin: {label: From, kind: place, hint: "A stop, an address, or 'here'"}
      destination: {label: To, kind: place}
      when: {label: Leave or arrive at, kind: text, default: now, hint: "now, 'depart 08:15' or 'arrive by 09:00'"}
    open: https://www.google.com/maps/dir/?api=1&origin={origin}&destination={destination}&travelmode=transit
    steps:
      - kind: do
        text: Unless {when} is now, open the "Leave now" menu, choose "Depart at" or "Arrive by" and set the date and time.
      - kind: do
        text: Open the first suggested trip to see each leg, the stops and the walking parts.
    read:
      departure: When and from which stop or platform the first vehicle leaves
      lines: The lines taken, in order (bus, tram, metro or train numbers and their direction)
      transfers: Where to change, and how many changes
      arrival: Arrival time at the destination
      duration: Total trip time, walking included
      fare: The fare if Maps shows one
    answer: "Take {lines} from {departure}; arrive {arrival} ({duration})."
    needs: [location]
    tags: [transit, directions, public-transport]

  - id: rome2rio.ways_to_get_there
    title: Every way to get from A to B
    says:
      - What's the best way to get from Lisbon airport into the city?
      - How do I get from Florence to Cinque Terre without a car?
      - Is it better to fly or take the train from Madrid to Barcelona?
      - Cheapest way from Split to Dubrovnik?
    kind: look
    where: prefer_chrome
    region: global
    sites: [rome2rio.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
    open: https://www.rome2rio.com/
    steps:
      - kind: type
        target: {role: combobox, name: From}
        value: "{origin}"
      - kind: type
        target: {role: combobox, name: To}
        value: "{destination}"
      - kind: key
        key: Enter
      - kind: do
        text: Read the list of options; open the top two to see their operators and how often they run.
    read:
      options: Each way listed (train, bus, flight, ferry, drive, taxi) with its time and price range
      fastest: The fastest option and its time
      cheapest: The cheapest option and its price
      operators: Who runs the best options and how often they go
    answer: "Fastest: {fastest}. Cheapest: {cheapest}."
    tags: [directions, transit, comparison]

  - id: tollguru.toll_cost
    title: Tolls and fuel cost for a drive
    says:
      - How much are the tolls from Boston to Washington DC?
      - What will tolls and fuel cost driving from Paris to Nice?
      - Is there a toll-free way from Chicago to Indianapolis?
    kind: look
    where: any
    region: global
    sites: [tollguru.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      vehicle: {label: Vehicle, kind: choice, options: [car, motorcycle, car with trailer, rv, truck], default: car}
    open: https://tollguru.com/toll-calculator
    steps:
      - kind: do
        text: If the trip is outside the US, switch to the matching calculator from the site's menu (Europe, Canada, Mexico, India, Australia, France, Germany, Italy…).
      - kind: do
        text: Enter {origin} and {destination}, set the vehicle to {vehicle}, and calculate.
      - kind: do
        text: Compare the routes offered, including the cheapest one without tolls if shown.
    read:
      tolls: Total toll cost for the suggested route, by payment type if shown (tag vs cash or plate)
      fuel: Estimated fuel cost
      toll_roads: The toll roads, bridges or tunnels on the way
      toll_free: The toll-free route's extra time and distance, if there is one
    answer: "Tolls about {tolls}, fuel about {fuel}. Toll-free option: {toll_free}."
    tags: [tolls, driving, road-trip]

  - id: tolls.vignette_rules
    title: Do I need a vignette in a country
    says:
      - Do I need a vignette to drive through Austria?
      - How much is the Slovenian motorway vignette?
      - What tolls do I pay driving through Switzerland to Italy?
      - Where do I buy the Czech e-vignette?
    kind: look
    where: any
    region: eu
    sites: [tolls.eu]
    inputs:
      country: {label: Country, kind: text, hint: "English name in lowercase, hyphens for spaces, e.g. austria, czechia, bosnia-and-herzegovina"}
      vehicle: {label: Vehicle, kind: choice, options: [car, motorcycle, camper, car with trailer], default: car}
    open: https://www.tolls.eu/{country}
    steps:
      - kind: do
        text: If the route crosses several countries, open each country's page in turn (https://www.tolls.eu/ lists them).
    read:
      system: Whether the country uses a vignette, distance tolls, or both
      prices: The vignette options (days, months, year) and prices for a {vehicle}
      where_to_buy: The official place to buy it, and a warning if resellers add fees
      extra_tolls: Tunnels, passes or bridges charged on top
      fines: The fine for driving without one, if given
    answer: "{system}. {prices}. Buy at {where_to_buy}."
    tags: [tolls, vignette, driving]

  # ── Trains, buses, ferries ─────────────────────────────────────────────

  - id: trainline.train_search
    title: Train times and fares across Europe
    says:
      - Find trains from Paris to Amsterdam next Friday morning.
      - How much is a train from Milan to Rome on 12 May?
      - Cheapest train from London to Edinburgh this weekend?
    kind: look
    where: any
    region: eu
    sites: [thetrainline.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
      time: {label: Around, kind: time, default: "08:00"}
      travellers: {label: Travellers, kind: number, default: 1}
    open: https://www.thetrainline.com/
    steps:
      - kind: type
        target: {role: combobox, name: From}
        value: "{origin}"
      - kind: type
        target: {role: combobox, name: To}
        value: "{destination}"
      - kind: do
        text: Set the date to {date} leaving after {time}, set {travellers} passengers, and press "Search".
      - kind: do
        text: Scroll the results from {time} onwards; note the cheapest and the fastest.
    read:
      trains: The departures around {time} with times, changes and price
      cheapest: The cheapest train and its fare
      fastest: The fastest train and its duration
      operator: Which rail company runs them
    answer: "Cheapest {cheapest}; fastest {fastest}."
    tags: [train, rail, europe]

  - id: omio.trip_search
    title: Train, bus or plane, compared
    says:
      - Compare train, bus and flight from Berlin to Prague.
      - What's cheapest from Munich to Venice, bus or train?
      - How can I get from Vienna to Budapest on Saturday?
    kind: look
    where: prefer_chrome
    region: eu
    sites: [omio.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
      travellers: {label: Travellers, kind: number, default: 1}
    open: https://www.omio.com/
    steps:
      - kind: type
        target: {role: combobox, name: From}
        value: "{origin}"
      - kind: type
        target: {role: combobox, name: To}
        value: "{destination}"
      - kind: do
        text: Set one way on {date} for {travellers} passengers and search.
      - kind: do
        text: Look at the Train, Bus and Flight tabs in turn.
    read:
      by_train: Cheapest and fastest train, with times and price
      by_bus: Cheapest and fastest bus, with times and price
      by_plane: Cheapest flight with times and price, if any
      best: Which mode wins on price and which on time
    answer: "Train {by_train}; bus {by_bus}; plane {by_plane}."
    tags: [train, bus, comparison]

  - id: flixbus.bus_search
    title: FlixBus rides and prices
    says:
      - Is there a FlixBus from Zagreb to Ljubljana tomorrow?
      - How much is the bus from Prague to Vienna on Sunday?
      - Find a night bus from Berlin to Amsterdam.
    kind: look
    where: any
    region: global
    sites: [flixbus.com, global.flixbus.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
      travellers: {label: Travellers, kind: number, default: 1}
    open: https://www.flixbus.com/
    steps:
      - kind: type
        target: {role: combobox, name: From}
        value: "{origin}"
      - kind: type
        target: {role: combobox, name: To}
        value: "{destination}"
      - kind: do
        text: Set the date to {date}, set {travellers} adults, and press "Search".
    read:
      rides: The rides that day with departure and arrival times, stops, duration and transfers
      cheapest: The cheapest ride and its price
      seats_left: Any "few seats left" warnings
    answer: "{cheapest}. All rides: {rides}."
    tags: [bus, coach]

  - id: flixbus.book_ride
    title: Book a FlixBus ride up to payment
    says:
      - Book me the FlixBus from Munich to Prague on Friday morning.
      - Get two bus tickets from Milan to Venice for Saturday.
      - Reserve the evening FlixBus from Brussels to Paris.
    kind: act
    where: chrome
    region: global
    sites: [flixbus.com, shop.flixbus.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
      time: {label: Around, kind: time, default: "09:00"}
      travellers: {label: Travellers, kind: number, default: 1}
    open: https://www.flixbus.com/
    steps:
      - kind: do
        text: Search {origin} to {destination} on {date} for {travellers} adults.
      - kind: do
        text: Pick the ride closest to {time}; if two are close, take the cheaper and say so. Press "Continue".
      - kind: do
        text: Decline paid extras (seat reservation, extra bags, flexibility) unless the person asked for them.
      - kind: do
        text: Fill in passenger names and contact details from what the agent knows; ask for anything missing.
      - kind: do
        text: Stop at the payment step and show the ride and total.
    read:
      ride: The chosen ride's times, stations and duration
      total: The total price shown before payment
      conditions: Change and cancellation rules for this fare
    stop: Continue to payment
    needs: [memory]
    tags: [bus, coach, booking]

  - id: eurostar.train_search
    title: Eurostar times and fares
    says:
      - Eurostar from London to Paris on Friday, what's cheapest?
      - How much is the Eurostar to Brussels next week?
      - What time is the first Eurostar from Amsterdam to London on Monday?
    kind: look
    where: any
    region: eu
    sites: [eurostar.com]
    inputs:
      origin: {label: From, kind: place, hint: "e.g. London St Pancras, Paris Gare du Nord, Brussels-Midi, Amsterdam Centraal"}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
      travellers: {label: Travellers, kind: number, default: 1}
    open: https://www.eurostar.com/
    steps:
      - kind: do
        text: Pick {origin} and {destination}, one way on {date}, {travellers} adults, and search.
      - kind: do
        text: Read each departure's price for every class (Standard, Plus, Premier).
    read:
      trains: The departures with times and the price per class
      cheapest: The cheapest departure and its class and price
      check_in: How early Eurostar asks travellers to arrive at the station
    answer: "Cheapest: {cheapest}. Arrive {check_in} before."
    tags: [train, rail, eurostar]

  - id: interrail.timetable
    title: Interrail train times and reservations
    says:
      - Do I need a seat reservation on the Paris to Barcelona train with my Interrail pass?
      - Interrail train times from Vienna to Venice on Tuesday.
      - Which trains from Munich to Zurich are covered by my Eurail pass without a reservation?
    kind: look
    where: any
    region: eu
    sites: [interrail.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      date: {label: Date, kind: date}
    open: https://www.interrail.com/en-int/plan-your-trip/interrail-timetable
    steps:
      - kind: do
        text: Enter {origin}, {destination} and {date} in the timetable and search.
      - kind: do
        text: For each connection, open its details to see whether a reservation is required or optional.
    read:
      connections: The trains that day with times, changes and duration
      reservation: Which trains need a seat reservation and its fee, and which need none
      pass_valid: Any train or operator not covered by the pass
    answer: "{connections}. Reservations: {reservation}."
    tags: [train, rail, interrail, pass]

  - id: seat61.train_route_guide
    title: How to do a journey by train (Seat 61)
    says:
      - How do I get from London to Rome by train?
      - Is there a sleeper train from Vienna to Venice?
      - Best way to go by train from Zagreb to Istanbul?
      - Where do I book cheap tickets for trains in Italy?
    kind: look
    where: any
    region: global
    sites: [seat61.com]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
    open: https://www.seat61.com/
    steps:
      - kind: do
        text: From the home page's destination list, open the page for the country of {destination}.
      - kind: do
        text: Find the section on getting there from {origin}, or from the nearest hub the page covers.
    read:
      best_route: The recommended train route, with changes and any sleeper
      journey_time: How long it takes door to door
      where_to_book: Which operator or site sells the cheapest tickets, and when booking opens
      fares: The typical fares quoted
      tips: Any warnings (reservations, strikes, engineering work, which side to sit)
    answer: "{best_route}, about {journey_time}. Book via {where_to_book}."
    tags: [train, rail, guide]

  - id: directferries.ferry_search
    title: Ferry times and prices for a crossing
    says:
      - Ferry from Dover to Calais on Saturday with a car.
      - When's the ferry from Split to Ancona and how much?
      - How much is the ferry from Barcelona to Mallorca for two?
    kind: look
    where: any
    region: global
    sites: [directferries.com]
    inputs:
      origin: {label: From port, kind: place}
      destination: {label: To port, kind: place}
      date: {label: Date, kind: date}
      travellers: {label: Passengers, kind: number, default: 1}
      vehicle: {label: Vehicle, kind: choice, options: [none, car, motorhome, motorcycle, bicycle], default: none}
    open: https://www.directferries.com/
    steps:
      - kind: do
        text: Choose the route {origin} to {destination}, one way on {date}, {travellers} passengers and vehicle {vehicle}, then get quotes.
      - kind: do
        text: Read every sailing offered that day.
    read:
      sailings: The sailings with operator, departure and arrival times and duration
      cheapest: The cheapest sailing and its total price
      vehicle_price: What the vehicle adds, if one was chosen
    answer: "{cheapest}. Other sailings: {sailings}."
    tags: [ferry, boat]

  - id: ferryhopper.island_hopping
    title: Island-hopping ferry plan
    says:
      - Plan ferries Athens to Paros, then Naxos, then Santorini in June.
      - Can I get from Split to Hvar and then Korčula by ferry the same week?
      - Ferry connections between Mykonos and Milos?
    kind: look
    where: any
    region: eu
    sites: [ferryhopper.com]
    inputs:
      legs: {label: Legs, kind: text, hint: "Each leg with its date, e.g. Piraeus→Paros 10 Jun; Paros→Naxos 13 Jun"}
      travellers: {label: Passengers, kind: number, default: 1}
    open: https://www.ferryhopper.com/en/
    steps:
      - kind: do
        text: Choose a multi-trip search and add one trip per leg in {legs}, each with its date, for {travellers} passengers; search.
      - kind: do
        text: If a leg has no direct ferry, look at the indirect connections Ferryhopper suggests.
    read:
      legs: For each leg, the sailings that day with operator, times and price
      connections: Legs with no direct ferry and the suggested change
      total: The cheapest total across all legs
    answer: "{legs}. Cheapest total {total}."
    tags: [ferry, islands, boat]

  # ── Flights ────────────────────────────────────────────────────────────

  - id: googleflights.flight_search
    title: Find flights on a date
    says:
      - Find flights from Zagreb to Lisbon on 2 March.
      - What's the cheapest nonstop from London to New York next Friday?
      - Flights to Barcelona from Vienna, back a week later?
    kind: look
    where: any
    region: global
    sites: [google.com/travel/flights]
    inputs:
      origin: {label: From, kind: place, hint: "City or airport code, e.g. ZAG"}
      destination: {label: To, kind: place}
      date: {label: Departure, kind: date}
      return_date: {label: Return, kind: date, required: false, ask: before}
      travellers: {label: Travellers, kind: number, default: 1}
      cabin: {label: Class, kind: choice, options: [economy, premium economy, business, first], default: economy}
    open: https://www.google.com/travel/flights?q=Flights%20to%20{destination}%20from%20{origin}%20on%20{date}
    steps:
      - kind: do
        text: If return_date was given, switch to Round trip and set the return to {return_date}; otherwise keep One way.
      - kind: do
        text: Set {travellers} passengers and {cabin} if they differ, then read the "Best" and "Cheapest" tabs.
    read:
      best: Google's top pick with airline, times, stops and price
      cheapest: The cheapest flight with airline, times, stops and price
      nonstop: The cheapest nonstop, if any
      price_level: Google's note on whether prices are low, typical or high
      bags: Whether a carry-on bag is included on the cheapest fare
    answer: "Best: {best}. Cheapest: {cheapest}. Prices are {price_level}."
    tags: [flights, airfare]

  - id: googleflights.cheapest_dates
    title: Cheapest days to fly
    says:
      - Which day next month is cheapest to fly to Lisbon?
      - Is it cheaper to fly to Paris a day earlier?
      - Find the cheapest dates for a week in Barcelona around 10 May.
    kind: look
    where: any
    region: global
    sites: [google.com/travel/flights]
    inputs:
      origin: {label: From, kind: place}
      destination: {label: To, kind: place}
      around: {label: Around date, kind: date}
      nights: {label: Nights, kind: number, default: 7, hint: "0 for one way"}
    open: https://www.google.com/travel/flights?q=Flights%20to%20{destination}%20from%20{origin}%20on%20{around}
    steps:
      - kind: do
        text: For a round trip set the return {nights} nights after {around}; for 0 nights keep One way.
      - kind: do
        text: Open "Date grid" (round trip) or "Price graph" (one way) and scan the days around {around}.
    read:
      cheapest_dates: The cheapest departure (and return) dates and price
      chosen_price: The price on the dates asked for
      saving: How much moving the dates saves
    answer: "Cheapest is {cheapest_dates}, saving {saving} against {chosen_price}."
    tags: [flights, airfare, flexible-dates]

  - id: skyscanner.cheapest_month
    title: Cheapest month to fly
    says:
      - When's the cheapest month to fly to Tokyo?
      - Cheapest time this spring to fly London to Lisbon?
      - Which month are flights to Bali cheapest from Amsterdam?
    kind: look
    where: prefer_chrome
    region: global
    sites: [skyscanner.net, skyscanner.com]
    inputs:
      origin: {label: From, kind: text, hint: "Airport or city code, lowercase, e.g. lond, ams, zag"}
      destination: {label: To, kind: text, hint: "Airport or city code, e.g. tyoa, lis, dps"}
      months: {label: Which months, kind: text, default: next 12 months}
    open: https://www.skyscanner.net/transport/flights/{origin}/{destination}/
    steps:
      - kind: do
        text: In the date picker choose "Whole month" and then "Cheapest month" (or step through {months}).
      - kind: do
        text: Note the lowest price for each month, then open the cheapest month's calendar.
    read:
      cheapest_month: The cheapest month and its lowest price
      by_month: The lowest price for each month shown
      cheapest_dates: The cheapest dates inside that month
      airlines: Airlines on the cheapest options, and whether they are direct
    answer: "{cheapest_month}; best dates {cheapest_dates}."
    tags: [flights, airfare, flexible-dates]

  - id: skyscanner.everywhere
    title: Where can I fly cheaply from here
    says:
      - Where can I fly cheaply from Vienna in May?
      - Cheapest weekend getaway from London next month?
      - Show me the cheapest destinations from Zagreb this summer.
    kind: look
    where: prefer_chrome
    region: global
    sites: [skyscanner.net, skyscanner.com]
    inputs:
      origin: {label: From, kind: text, hint: "Airport or city code, lowercase, e.g. vie, lond, zag"}
      when: {label: When, kind: text, default: cheapest month}
    open: https://www.skyscanner.net/transport/flights-from/{origin}/
    steps:
      - kind: do
        text: Set the destination to "Everywhere" and the dates to {when}; sort by cheapest.
    read:
      destinations: The ten cheapest countries or cities with their lowest price
      top_pick: The cheapest destination, its dates and airline
      direct: Which of them have direct flights
    answer: "Cheapest: {top_pick}. Others: {destinations}."
    tags: [flights, inspiration, airfare]

  - id: expedia.flight_hotel_package
    title: Flight and hotel package price
    says:
      - How much is a flight plus hotel package to Cancún for a week?
      - Price a package to Rome with hotel for two in June.
      - Is a flight and hotel bundle to Lisbon cheaper than booking separately?
    kind: look
    where: prefer_chrome
    region: global
    sites: [expedia.com]
    inputs:
      origin: {label: Leaving from, kind: place}
      destination: {label: Going to, kind: place}
      checkin: {label: Depart, kind: date}
      checkout: {label: Return, kind: date}
      adults: {label: Adults, kind: number, default: 2}
    open: https://www.expedia.com/Vacation-Packages
    steps:
      - kind: do
        text: Choose "Flight + Hotel"; fill in {origin}, {destination}, {checkin} to {checkout} and {adults} adults; search.
      - kind: do
        text: Sort hotels by price and open the cheapest well-rated one (8+/10) to see its package total with flights.
    read:
      package: Cheapest well-rated package total, and per person
      hotel: The hotel, its rating and area
