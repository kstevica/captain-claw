    open: https://home-affairs.ec.europa.eu/policies/schengen/schengen-visas/short-stay-calculator_en
    steps:
      - kind: do
        text: Open the calculator (it may open in a new tab), choose the check or planning mode, and enter each stay from {stays}.
      - kind: do
        text: Set the date to check to {check_date} and calculate.
    read:
      days_used: Days used in the 180 days before {check_date}
      days_left: Days still allowed
      latest_exit: The last day one may stay if entering on {check_date}
    answer: "{days_used} days used, {days_left} left; stay until {latest_exit} at the latest."
    needs: [memory]
    tags: [visa, schengen, entry]

