    inputs:
      country: {label: Country, kind: text, hint: "As timeanddate writes it, e.g. portugal, usa, uk, japan"}
      city: {label: City, kind: text, hint: "Lowercase with hyphens, e.g. lisbon, new-york"}
      dates: {label: Trip dates, kind: text}
    open: https://www.timeanddate.com/weather/{country}/{city}/ext
    steps:
      - kind: do
        text: If the page is not found, search the city at https://www.timeanddate.com/weather/ and open its 14-day forecast.
      - kind: do
        text: If {dates} start more than 14 days out, open the city's "Climate" tab and read that month's averages instead.
    read:
      forecast: Daily highs, lows and conditions for the trip dates (or the month's averages)
