    open: https://www.timeanddate.com/worldclock/{country}/{city}
    steps:
      - kind: do
        text: If the page is not found, search the city at https://www.timeanddate.com/worldclock/ and open it.
    read:
      local_time: Current local time and date there
      zone: Time zone name and UTC offset
      difference: Difference from the person's own time zone
