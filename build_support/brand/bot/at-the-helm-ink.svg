<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240"
     style="--body:#ecebe3; --plate:#111; --eye:#ecebe3; --gold:#ecebe3; --goldD:#111; --goldS:#111;
  --navy:#111; --navyD:#111; --white:#ecebe3; --coral:#111; --lamp:#111; --cyan:#111;
  --line:#111; --sw:2.4; --wire:#111; --shade:0; --inkonly:1; --ringP:#ecebe3; --ringD:#111; --paper:#ecebe3; --ink:#111;">
  <!-- Captain Bot, "at-the-helm" (ink). Drawn from the firmware Bot character (face.cpp drawBot)
       in its own units; see build_support/brand/bot/README.md. -->
  <style>
.body  { fill: var(--body);  stroke: var(--line); stroke-width: var(--sw); }
.plate { fill: var(--plate); }
.eye   { fill: var(--eye); }
.gold  { fill: var(--gold);  stroke: var(--line); stroke-width: var(--sw); }
.goldD { fill: var(--goldD); }
.navy  { fill: var(--navy);  stroke: var(--line); stroke-width: var(--sw); }
.navyD { fill: var(--navyD); }
.white { fill: var(--white); stroke: var(--line); stroke-width: var(--sw); }
.coral { fill: var(--coral); stroke: var(--line); stroke-width: var(--sw); }
.lamp  { fill: var(--lamp); }
.wire  { stroke: var(--wire); stroke-width: 3; fill: none; stroke-linecap: round; }
.wave  { stroke: var(--cyan); stroke-width: 4; fill: none; stroke-linecap: round; }
.ray   { stroke: var(--goldS); stroke-width: 3; fill: none; stroke-linecap: round; }
.ringD { stroke: var(--ringD); fill: none; }
.ringP { stroke: var(--ringP); fill: none; }
.ringI { stroke: var(--goldS); fill: none; }
.spoke { stroke: var(--navy); stroke-width: 6; fill: none; stroke-linecap: round; }
.hose  { stroke: var(--navy); stroke-width: 5; fill: none; stroke-linecap: round; }
.shade { opacity: var(--shade); }
.inkonly { opacity: var(--inkonly); }
  </style>
  <defs>
    <g id="faceparts">
      <rect class="eye" x="-26" y="-14" width="16" height="11" rx="3"/>
      <rect class="eye" x="10" y="-14" width="16" height="11" rx="3"/>
      <g class="eye">
        <rect x="-24" y="13.5" width="5" height="5" rx="1.5"/>
        <rect x="-17" y="12.5" width="5" height="7" rx="1.5"/>
        <rect x="-10" y="11.5" width="5" height="9" rx="1.5"/>
        <rect x="-3"  y="11"   width="5" height="10" rx="1.5"/>
        <rect x="4"   y="11.5" width="5" height="9" rx="1.5"/>
        <rect x="11"  y="12.5" width="5" height="7" rx="1.5"/>
        <rect x="18"  y="13.5" width="5" height="5" rx="1.5"/>
      </g>
    </g>
    <g id="face">
      <rect class="plate" x="-36" y="-28" width="72" height="58" rx="9"/>
      <use href="#faceparts"/>
    </g>
    <g id="head">
      <rect class="body" x="-52" y="-12" width="8" height="24" rx="3"/>
      <rect class="body" x="44" y="-12" width="8" height="24" rx="3"/>
      <rect class="body" x="-44" y="-36" width="88" height="76" rx="14"/>
      <use href="#face"/>
    </g>
    <g id="d-helm">
      <line class="spoke" x1="0" y1="0" x2="0" y2="-70"/>
      <line class="spoke" x1="0" y1="0" x2="49.5" y2="-49.5"/>
      <line class="spoke" x1="0" y1="0" x2="70" y2="0"/>
      <line class="spoke" x1="0" y1="0" x2="49.5" y2="49.5"/>
      <line class="spoke" x1="0" y1="0" x2="0" y2="70"/>
      <line class="spoke" x1="0" y1="0" x2="-49.5" y2="49.5"/>
      <line class="spoke" x1="0" y1="0" x2="-70" y2="0"/>
      <line class="spoke" x1="0" y1="0" x2="-49.5" y2="-49.5"/>
      <path class="gold" fill-rule="evenodd" d="M-80 0a80 80 0 1 0 160 0a80 80 0 1 0-160 0ZM-69 0a69 69 0 1 1 138 0a69 69 0 1 1-138 0Z"/>
      <path class="shade" d="M-62 -48A78 78 0 0 1 -8 -77" stroke="#fff" stroke-opacity=".32" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g transform="rotate(0)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="lamp" cy="-99" r="7.5"/></g>
      <g transform="rotate(45)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(90)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(135)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(180)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(225)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(270)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <g transform="rotate(315)"><rect class="gold" x="-4.5" y="-96" width="9" height="19" rx="3"/><circle class="gold" cy="-99" r="7.5"/></g>
      <use href="#head" transform="translate(0 -2)"/>
    </g>
  </defs>
  <use href="#d-helm" transform="translate(120 120) scale(1.1)"/>
</svg>
