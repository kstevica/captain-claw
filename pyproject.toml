[project]
name = "captain-claw"
version = "0.8.3"
description = "Self-hosted framework for orchestrating fleets of specialist AI agents — ensemble reasoning and a full agentic coding pipeline, model-agnostic and local-friendly"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE"]
authors = [
    { name = "Stevica Kuharski", email = "kstevica@gmail.com" }
]
keywords = ["ai", "agent", "cli", "terminal", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "tiktoken>=0.5.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "aiofiles>=23.0.0",
    "structlog>=23.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "blessed>=1.20.0",
    "python-dotenv>=1.0.0",
    "glob2>=0.7",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
    "playwright>=1.40.0",
    "weasyprint>=60.0",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "model2vec>=0.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "docker>=7.0",
    "websockets>=13.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
tts = [
    "pocket-tts>=1.0.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
vector = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]
vision = [
    "Pillow>=10.0.0",
]
pdf = [
    # PDFs read with their headings and tables (the agent setup, and files an
    # agent adds to its knowledge). PyMuPDF is AGPL-3.0, so it stays optional:
    # without it PDFs are read page by page.
    "pymupdf4llm>=0.3",
]
cv = [
    # Deterministic local computer-vision ops (the `vision` tool). CPU-only,
    # headless (no GUI deps). OpenCV 5 has the rewritten DNN engine for Phase 2.
    "opencv-python-headless>=5.0",
    "numpy>=1.24.0",
]
payments = [
    # Bill pay by barcode (Flight Deck only): HUB3 PDF417 + EPC QR out,
    # barcodes in invoices back in. pdf417gen is pinned to a minor version
    # because payments/hub3.py swaps one of its internals (byte compaction).
    "segno>=1.6,<2",
    "pdf417gen>=0.8,<0.9",
    "zxing-cpp>=3.1,<4",
    "pypdfium2>=4",
    # Revolut Business (Phase 1): RS256 client-assertion JWT + its key/cert.
    "cryptography>=42",
]
browser = [
    # Included in core deps; kept for backward compat with pip install captain-claw[browser].
    "playwright>=1.40.0",
]
screen = [
    "mss>=9.0.0",
    "pynput>=1.7.0",
    "pyautogui>=0.9.54",
    "sounddevice>=0.4.0",
    "numpy>=1.24.0",
    "soniox>=0.1.0",
]
faces = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
    "sqlite-vec>=0.1.6",
    "opencv-python-headless>=4.9.0",
]
whatsapp-web = [
    # The user's own WhatsApp as a linked device (Flight Deck only; see
    # docs/whatsapp-web-plan.md). Pinned exactly: the service refuses any other
    # version, because neonize would fetch a native library it doesn't bundle.
    # libmagic is optional: without it a built-in file-type sniffer is used.
    "neonize==0.5.2",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
captain-claw = "captain_claw.main:main"
captain-claw-web = "captain_claw.web_server:main"
captain-claw-agent = "captain_claw.web_server:main"
captain-claw-orchestrate = "captain_claw.orchestrator_cli:cli_orchestrate"
captain-claw-fd = "captain_claw.flight_deck.server:main"
flight-deck = "captain_claw.flight_deck.server:main"
captain-claw-mcp = "captain_claw.mcp_serve:main"
botport = "botport.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools.packages.find]
where = [".", "botport"]
include = ["captain_claw*", "botport*"]
# The repo-root botport/ directory (no __init__) would be found as a namespace
# package too, yielding a bogus "botport.botport"; the real package is botport/botport.
exclude = ["botport.botport*", "botport.tests*"]

[tool.setuptools.package-data]
captain_claw = ["web/static/**/*", "instructions/**/*", "flight_deck/static/**/*", "payments/*.json"]
botport = ["dashboard/static/**/*"]
