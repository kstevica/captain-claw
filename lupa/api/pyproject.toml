[project]
name = "lupa-api"
version = "0.1.0"
description = "Lupa — agentic research desk BFF. Consumes Captain Claw's Flight Deck HTTP API; never imports captain_claw."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "aiosqlite>=0.19",
    "PyJWT>=2.8",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lupa-api = "lupa_api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lupa_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
