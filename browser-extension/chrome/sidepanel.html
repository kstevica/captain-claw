<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captain</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="icons/icon-32.png" alt="">
    <div class="brand">
      <div class="brand-name">Captain</div>
      <div class="brand-sub" id="deckName"></div>
    </div>
    <button class="icon-btn" id="btnHistory" title="Recent" hidden></button>
    <button class="icon-btn" id="btnSettings" title="Settings" hidden></button>
  </header>
  <main id="view"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
